services:
  # nginx
  nginx:
    hostname: raspberry
    container_name: nginx
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    volumes:
      - /etc/ssl/certs/dhparam.pem:/etc/ssl/certs/dhparam.pem:ro
      - /etc/docker/infrastructure/nginx:/etc/nginx:ro
      - /etc/docker/infrastructure/nginx/${HOSTNAME}.pem:/etc/nginx/${HOSTNAME}.pem:ro
      - /etc/docker/infrastructure/nginx/${HOSTNAME}.key:/etc/nginx/${HOSTNAME}.key:ro
    networks:
      - nginx
      - siz
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
  # portainer
  portainer:
    hostname: portainer
    container_name: portainer
    image: portainer/portainer-ce:2.40.0-alpine
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/docker/infrastructure/portainer/data:/data
    environment:
      - TRUSTED_ORIGINS=portainer.${HOSTNAME}
    networks:
      - siz
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "--no-check-certificate", "http://localhost:9000" ]
  # More info at https://github.com/pi-hole/docker-pi-hole/ and https://docs.pi-hole.net/
  pihole:
    hostname: pihole
    container_name: pihole
    image: pihole/pihole:2026.04.0
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    env_file:
      - /etc/docker/infrastructure/.env
    environment:
      TZ: 'Europe/Berlin'
      FTLCONF_dns_upstreams: '172.30.2.52'  # unbound
      FTLCONF_dns_dnssec: 'true'
    security_opt:
      - no-new-privileges:false
    # Volumes store your data between container upgrades
    volumes:
      - /etc/docker/infrastructure/pihole/pihole:/etc/pihole
      - /etc/docker/infrastructure/pihole/dnsmasq.d:/etc/dnsmasq.d
    # Recommended but not required (DHCP needs NET_ADMIN)
    # https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
    #cap_add:
    #  - NET_ADMIN
    restart: unless-stopped
    networks:
      siz:
        ipv4_address: 172.30.2.53
      outbound: {}  # replace with outbound if needed
    dns:
      - 127.0.0.1
      - 172.30.2.52
      - 9.9.9.9
    depends_on:
      - unbound
  unbound:
    hostname: unbound
    container_name: unbound
    image: klutchell/unbound:1.24.2
    restart: unless-stopped
    networks:
      siz:
        ipv4_address: 172.30.2.52
      nginx: {}
    dns:
      - 127.0.0.1
      - 9.9.9.9
    healthcheck:
      test: [ "CMD", "dig", "www.heise.de", "@127.0.0.1" ]
  outbound:
    hostname: outbound
    container_name: outbound
    image: pihole/pihole:2026.04.0
    env_file:
      - /etc/docker/infrastructure/.outbound.env
    environment:
      TZ: 'Europe/Berlin'
      FTLCONF_dns_upstreams: '172.30.2.52'  # unbound
      FTLCONF_dns_dnssec: 'true'
    security_opt:
      - no-new-privileges:false
    # Volumes store your data between container upgrades
    volumes:
      - /etc/docker/infrastructure/pihole_outbound/pihole:/etc/pihole
      - /etc/docker/infrastructure/pihole_outbound/dnsmasq.d:/etc/dnsmasq.d
    # Recommended but not required (DHCP needs NET_ADMIN)
    # https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
    #cap_add:
    #  - NET_ADMIN
    restart: unless-stopped
    networks:
      outbound:
        ipv4_address: 172.30.1.153
      siz: {}
    dns:
      - 127.0.0.1
      - 172.30.2.52
      - 9.9.9.9
    depends_on:
      - unbound
  # Backup - resticprofile
  resticprofile:
    hostname: resticprofile
    container_name: resticprofile
    image: creativeprojects/resticprofile:0.33.0
    deploy:
      resources:
        limits:
          cpus: '0.50'
    secrets:
      - restic_passphrase
    environment:
      TZ: 'Europe/Berlin'
    volumes:
      - /etc/docker/infrastructure/restic/.ssh:/root/.ssh
      - /etc/docker/infrastructure/resticprofile/ssh_config:/etc/ssh/ssh_config:ro
      - /etc/docker/infrastructure/resticprofile/config:/etc/resticprofile:ro
      - /home:/source/home:ro
      - /etc:/source/etc:ro
      - /var/lib/docker/volumes:/source/docker-volumes:ro
      # Prom metrics for telegraf
      - /var/lib/resticprofile/metrics:/metrics
    restart: unless-stopped
    networks:
      - nginx
    extra_hosts:
      dungeon: "${DUNGEON_IP}"
    entrypoint: '/bin/sh'
    command:
      - '-c'
      - 'resticprofile schedule --all && crond -f'
  # Monitoring
  healthmonitor:
    hostname: healthmonitor
    container_name: healthmonitor
    image: ghcr.io/rafhaanshah/container-mon:v1.1.1
    env_file:
      - /etc/docker/infrastructure/.healthmonitor.env
    environment:
      - CONTAINERMON_CHECK_STOPPED=false
      # Set according to the server's Docker API version
      # Run "docker version" on host to determine the matching version
      - DOCKER_API_VERSION=1.41
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - siz
      - outbound  # internet
    dns:
      - 172.30.1.153
networks:
  nginx:
    name: nginx
  siz:
    name: siz
    external: true
  outbound:
    name: outbound
    external: true

secrets:
  restic_passphrase:
    file: /etc/docker/infrastructure/secrets/restic_passphrase
