version: "3"
services:
  # nginx
  nginx:
    hostname: raspberry
    container_name: nginx
    image: library/nginx:1.21-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "53:53/udp"
    volumes:
      - /etc/ssl/certs/dhparam.pem:/etc/ssl/certs/dhparam.pem:ro
      - /etc/docker/infrastructure/nginx:/etc/nginx:ro
      - /etc/docker/infrastructure/nginx/raspi.crt:/etc/nginx/raspi.crt:ro
      - /etc/docker/infrastructure/nginx/raspi.key:/etc/nginx/raspi.key:ro
    networks:
      - nginx
      - default
  # portainer
  portainer:
    hostname: portainer
    container_name: portainer
    image: portainer/portainer-ce:2.9.2-alpine
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/docker/infrastructure/portainer/data:/data
    networks:
      - nginx
      - default
  # autoheal (?)
  #autoheal:
networks:
  nginx:
    name: nginx
  default:
    driver: bridge