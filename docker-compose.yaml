services:
  # nginx
  nginx:
    hostname: raspberry
    container_name: nginx
    image: nginx:1.31-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    volumes:
      - /etc/ssl/certs/dhparam.pem:/etc/ssl/certs/dhparam.pem:ro
      - /etc/docker/infrastructure/nginx:/etc/nginx:ro
      - /etc/docker/infrastructure/nginx/${HOSTNAME}.pem:/etc/nginx/${HOSTNAME}.pem:ro
      - /etc/docker/infrastructure/nginx/${HOSTNAME}.key:/etc/nginx/${HOSTNAME}.key:ro
    networks:
      - nginx
      - siz
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
  # portainer
  portainer:
    hostname: portainer
    container_name: portainer
    image: portainer/portainer-ce:2.45.2-alpine
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/docker/infrastructure/portainer/data:/data  # TODO move to storage
    environment:
      - TRUSTED_ORIGINS=https://portainer.${HOSTNAME}
    networks:
      - siz
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "--no-check-certificate", "http://localhost:9000" ]
  # More info at https://github.com/pi-hole/docker-pi-hole/ and https://docs.pi-hole.net/
  pihole:
    hostname: pihole
    container_name: pihole
    image: pihole/pihole:2026.09.0
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    env_file:
      - /etc/docker/infrastructure/.env
    environment:
      TZ: 'Europe/Berlin'
      FTLCONF_dns_upstreams: '172.30.2.52'  # unbound
      FTLCONF_dns_dnssec: 'true'
      FTLCONF_misc_dnsmasq_lines: 'edns-packet-max=1232'
    # Volumes store your data between container upgrades
    volumes:
      - /etc/docker/infrastructure/pihole/pihole:/etc/pihole
    # Recommended but not required (DHCP needs NET_ADMIN)
    # https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
    #cap_add:
    #  - NET_ADMIN
    restart: unless-stopped
    networks:
      siz:
        ipv4_address: 172.30.2.53
      outbound: {}  # replace with outbound if needed
    dns:
      - 127.0.0.1
      - 172.30.2.52
      - 9.9.9.9
    depends_on:
      - unbound
  unbound:
    hostname: unbound
    container_name: unbound
    image: klutchell/unbound:v1.26.1
    restart: unless-stopped
    networks:
      siz:
        ipv4_address: 172.30.2.52
      nginx: {}
    dns:
      - 127.0.0.1
      - 9.9.9.9
    healthcheck:
      test: [ "CMD", "dig", "www.heise.de", "@127.0.0.1" ]
  outbound:
    hostname: outbound
    container_name: outbound
    image: pihole/pihole:2026.09.0
    env_file:
      - /etc/docker/infrastructure/.outbound.env
    environment:
      TZ: 'Europe/Berlin'
      FTLCONF_dns_upstreams: '172.30.2.52'  # unbound
      FTLCONF_dns_dnssec: 'true'
      FTLCONF_misc_dnsmasq_lines: 'edns-packet-max=1232'
    # Only a cache: setup-pihole.yaml provisions this Pi-hole, so the volume isn't backed up. It keeps the egress
    # filter closed when the container is recreated; an empty Pi-hole would allow everything (#293).
    volumes:
      - outbound_pihole:/etc/pihole
    # Recommended but not required (DHCP needs NET_ADMIN)
    # https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
    #cap_add:
    #  - NET_ADMIN
    restart: unless-stopped
    networks:
      outbound:
        ipv4_address: 172.30.1.153
      siz: {}
    dns:
      - 127.0.0.1
      - 172.30.2.52
      - 9.9.9.9
    depends_on:
      - unbound
  # Backup - resticprofile
  resticprofile:
    hostname: resticprofile
    container_name: resticprofile
    image: creativeprojects/resticprofile:0.33.1
    # On stop, let a running backup shut down cleanly so restic removes its repository lock (#250)
    init: true
    stop_grace_period: 2m
    deploy:
      resources:
        limits:
          cpus: '0.50'
    secrets:
      - restic_passphrase
    environment:
      TZ: 'Europe/Berlin'
    volumes:
      - /etc/docker/infrastructure/resticprofile/.ssh:/root/.ssh # TODO ansible
      - /etc/docker/infrastructure/resticprofile/ssh_config:/etc/ssh/ssh_config:ro
      - /etc/docker/infrastructure/resticprofile/config:/etc/resticprofile:ro
      - /home:/source/home:ro
      - /etc:/source/etc:ro
      - /var/lib/docker/volumes:/source/docker-volumes:ro
      - /var/restore:/restore-target:rw
      # The clean-slate restore's marker (#287)
      - /var/lib/restore:/restore-state:ro
      # Prom metrics for telegraf
      - /var/lib/resticprofile/metrics:/metrics
    restart: unless-stopped
    networks:
      - nginx
    extra_hosts:
      dungeon: "${DUNGEON_IP}"
    # Unhealthy when the last successful backup (daily at 03:00) is older than 26h, so healthmonitor
    # alerts on a missing backup, not only on a failed one (#259). Also unhealthy before the first backup.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          awk -v now=$$(date +%s)
          '/^resticprofile_backup_last_success_timestamp_seconds/ { ok = now - $$2 < 26 * 3600 } END { exit !ok }'
          /metrics/backup_last_success.prom
      interval: 10m
      # Check every 10s during the first minute, so the status is known right after a deploy
      start_period: 1m
      start_interval: 10s
    entrypoint: '/bin/sh'
    command:
      - '-c'
      - |
        # No backups before the clean-slate restore is done or skipped, or a fresh host's empty state would become
        # the latest snapshot (#287). bootstrap.yaml writes the marker.
        [ -f /restore-state/done ] || echo 'Waiting for /var/lib/restore/done (bootstrap.yaml) to schedule backups'
        while [ ! -f /restore-state/done ]; do sleep 60; done
        resticprofile schedule --all || exit 1
        crond -f &
        crond_pid=$$!
        # crond doesn't pass SIGTERM on to its jobs: stop the running job (resticprofile) first and wait for it
        stop_job() {
          pkill -TERM -P $$crond_pid
          while pgrep -P $$crond_pid >/dev/null; do sleep 1; done
          kill $$crond_pid
        }
        trap stop_job TERM INT
        wait $$crond_pid
  # Monitoring
  healthmonitor:
    hostname: healthmonitor
    container_name: healthmonitor
    image: ghcr.io/rafhaanshah/container-mon:v1.1.1
    env_file:
      - /etc/docker/infrastructure/.healthmonitor.env
    environment:
      - CONTAINERMON_CHECK_STOPPED=false
      # container-mon does not negotiate the API version. 1.44 is the oldest version Docker 29+ accepts
      # and still within the range of Debian's docker.io 26.x. Drop it once all hosts run docker-ce 28.4+.
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - siz
      - outbound  # internet
    dns:
      - 172.30.1.153
volumes:
  outbound_pihole:
    name: outbound_pihole
networks:
  nginx:
    name: nginx
  siz:
    name: siz
    external: true
  outbound:
    name: outbound
    external: true

secrets:
  restic_passphrase:
    file: /etc/docker/infrastructure/secrets/restic_passphrase
