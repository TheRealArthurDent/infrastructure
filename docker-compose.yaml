version: "3.7"
services:
  # nginx
  nginx:
    hostname: raspberry
    container_name: nginx
    image: nginx:1.21-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      #- "53:53/tcp"
      #- "53:53/udp"
    volumes:
      - /etc/ssl/certs/dhparam.pem:/etc/ssl/certs/dhparam.pem:ro
      - /etc/docker/infrastructure/nginx:/etc/nginx:ro
      - /etc/docker/infrastructure/nginx/raspi.pem:/etc/nginx/raspi.pem:ro
      - /etc/docker/infrastructure/nginx/raspi.key:/etc/nginx/raspi.key:ro
    networks:
      - nginx
      - siz
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://localhost/index.html" ]
    labels:
      diun.watch_repo: 'true'
      diun.include_tags: '^[0-9]+\.[0-9]+-alpine$$'
      diun.exclude_tags: '.*-perl;1.12-alpine' # there is no armv7 version of 1.12-alpine for what ever reason.
  # portainer
  portainer:
    hostname: portainer
    container_name: portainer
    image: portainer/portainer-ce:2.11.0-alpine
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/docker/infrastructure/portainer/data:/data
    networks:
      - siz
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "--no-check-certificate", "http://localhost:9000" ]
    labels:
      diun.watch_repo: 'true'
      diun.include_tags: '^[2-9]\.[0-9]+\.[0-9.]+-alpine$$'
  # autoheal (?)
  #autoheal:
  # More info at https://github.com/pi-hole/docker-pi-hole/ and https://docs.pi-hole.net/
  pihole:
    hostname: pihole
    container_name: pihole
    image: pihole/pihole:2022.01.1
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    env_file:
      - /etc/docker/infrastructure/.env
    environment:
      TZ: 'Europe/Berlin'
      PIHOLE_DNS_: '172.30.2.52' # unbound
      DNSSEC: 'true'
    security_opt:
      - no-new-privileges:false
    # Volumes store your data between container upgrades
    volumes:
      - /etc/docker/infrastructure/pihole/pihole:/etc/pihole
      - /etc/docker/infrastructure/pihole/dnsmasq.d:/etc/dnsmasq.d
      - /var/run/docker.sock:/var/run/docker.sock
    # Recommended but not required (DHCP needs NET_ADMIN)
    #   https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
    #cap_add:
    #  - NET_ADMIN
    restart: unless-stopped
    networks:
      siz:
        ipv4_address: 172.30.2.53
      outbound: {} # replace with outbound if needed
    dns:
      - 127.0.0.1
      - 172.30.2.52
      - 9.9.9.9
    depends_on:
      - unbound
    labels:
      diun.watch_repo: 'true'
      diun.include_tags: '20[0-9]{2}\.[0-9]{2}(\.[0-9]+)?'
  unbound:
    hostname: unbound
    container_name: unbound
    image: klutchell/unbound:v1.14.0-r4
    restart: unless-stopped
    networks:
      siz:
        ipv4_address: 172.30.2.52
      nginx: {}
    dns:
      - 127.0.0.1
      - 9.9.9.9
    healthcheck:
      test: [ "CMD", "dig", "www.heise.de", "@127.0.0.1" ]
    labels:
      diun.watch_repo: 'true'
      diun.include_tags: '^[0-9]+\.[0-9]+(\.[0-9]+)?$$'
  outbound:
    hostname: outbound
    container_name: outbound
    image: pihole/pihole:2022.01.1
    env_file:
      - /etc/docker/infrastructure/.outbound.env
    environment:
      TZ: 'Europe/Berlin'
      PIHOLE_DNS_: '172.30.2.52' # unbound
      DNSSEC: 'true'
    security_opt:
      - no-new-privileges:false
    # Volumes store your data between container upgrades
    volumes:
      - /etc/docker/infrastructure/pihole_outbound/pihole:/etc/pihole
      - /etc/docker/infrastructure/pihole_outbound/dnsmasq.d:/etc/dnsmasq.d
      - /var/run/docker.sock:/var/run/docker.sock
#    # Recommended but not required (DHCP needs NET_ADMIN)
#    #   https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
#    #cap_add:
#    #  - NET_ADMIN
    restart: unless-stopped
    networks:
      outbound:
        ipv4_address: 172.30.1.153
      siz: {}
    dns:
      - 127.0.0.1
      - 172.30.2.52
      - 9.9.9.9
    depends_on:
      - unbound
  # Monitoring
  diun:
    hostname: diun
    container_name: diun
    image: crazymax/diun:4
    command: serve
    env_file:
      - /etc/docker/infrastructure/.diun.env
    environment:
      TZ: 'Europe/Berlin'
      DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT: 'true'
      DIUN_WATCH_SCHEDULE: '0 2 * * *'
    volumes:
      - diun-storage:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - siz
      - outbound # internet
    dns:
      - 172.30.1.153
    labels:
      diun.watch_repo: 'true'
      diun.include_tags: '^[0-9]$$'
  healthmonitor:
    hostname: healthmonitor
    container_name: healthmonitor
    image: ghcr.io/rafhaanshah/container-mon:latest
    env_file:
      - /etc/docker/infrastructure/.healthmonitor.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - siz
      - outbound # internet
    dns:
      - 172.30.1.153
volumes:
  diun-storage:
networks:
  nginx:
    name: nginx
  siz:
    name: siz
    external: true
  outbound:
    name: outbound
    external: true