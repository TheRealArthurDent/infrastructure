# See https://yamllint.readthedocs.io/en/stable/configuration.html
# ansible-lint requires the comments, comments-indentation, braces and octal-values settings below.
---
extends: default

# Rendered output pinned by ansible/tests/unit/test_stack_golden.py, not hand-written YAML
ignore: |
  ansible/tests/unit/golden/

rules:
  document-start: disable
  line-length:
    max: 120
    allow-non-breakable-inline-mappings: true
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
  comments-indentation: false
  braces:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
