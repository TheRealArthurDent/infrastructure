# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 38.110.1
    hooks:
      - id: renovate-config-validator

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.3
    hooks:
      - id: actionlint-docker

  - repo: https://github.com/ansible/ansible-lint
    # Renovate updates rev and additional_dependencies together with requirements.txt (see renovate.json).
    rev: v26.10.1
    hooks:
      - id: ansible-lint
        # Renovate only updates additional_dependencies when the language is set explicitly.
        language: python
        additional_dependencies: ['ansible-core==2.21.5']
        entry: ansible-lint --strict bootstrap/
