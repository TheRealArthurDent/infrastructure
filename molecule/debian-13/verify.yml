---
# Verify that the Ansible playbook has been executed correctly

- name: Verify Debian 13 Bootstrap
  hosts: all
  gather_facts: true
  become: yes

  tasks:
    - name: Check if apt cache was updated
      stat:
        path: /var/lib/apt/periodic/update-success-stamp
      register: apt_update
      failed_when: not apt_update.stat.exists

    - name: Verify Docker is installed
      package_facts:
        manager: apt
      register: apt_packages

    - name: Assert docker.io is installed
      assert:
        that:
          - "'docker.io' in ansible_facts.packages"
        fail_msg: "Docker package is not installed"
        success_msg: "Docker package is installed"

    - name: Check Docker group exists
      group:
        name: docker
        state: present
      register: docker_group

    - name: Assert testuser is in docker group
      assert:
        that:
          - "'docker' in ansible_facts.groups"
        fail_msg: "Docker group does not exist"
        success_msg: "Docker group exists"

    - name: Verify Docker service is available
      command: which docker
      changed_when: false
      register: docker_path
      failed_when: docker_path.rc != 0

    - name: Print Docker version
      command: docker --version
      changed_when: false
      register: docker_version

    - name: Display test results
      debug:
        msg:
          - "✓ Docker installed at: {{ docker_path.stdout }}"
          - "✓ Docker version: {{ docker_version.stdout }}"
          - "✓ Apt cache has been updated"
