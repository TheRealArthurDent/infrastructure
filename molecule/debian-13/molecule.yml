---
dependency:
  name: galaxy

driver:
  name: docker
  options:
    managed: true
  platforms:
    - name: test-debian-13
      image: debian:trixie
      dockerfile: Dockerfile
      volumes:
        - /sys/fs/cgroup:/sys/fs/cgroup:rw
      cgroupns_mode: host
      privileged: true
      pre_build_image: false
      command: /lib/systemd/systemd
      environment:
        container: docker

provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
      force_handlers: true
      roles_path: ../../bootstrap/roles
  inventory:
    hosts:
      all:
        hosts:
          test-debian-13:
            ansible_connection: docker
  env:
    ANSIBLE_PIPELINING: "true"

verifier:
  name: ansible
  directory: .

scenario:
  name: debian-13
  test_sequence:
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
