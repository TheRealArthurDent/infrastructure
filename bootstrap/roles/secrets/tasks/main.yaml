- name: Install pykeepass
  pip:
    name: pykeepass
    state: present

- name: Create docker infrastructure directory
  file:
    path: /etc/docker/infrastructure
    state: directory
    mode: '0755'

- name: Extract password from keepass and create .env file
  block:
    - name: Read keepass file and extract password
      shell: |
        python3 << 'EOF'
        from pykeepass import PyKeePass
        kp = PyKeePass('{{ keepass_file_path }}', password='{{ keepass_password }}')
        entry = kp.find_entries_by_path('TestGroup/SubGroup/TopSecret')[0]
        print(entry.password)
        EOF
      register: keepass_password_output
      no_log: true
      vars:
        keepass_file_path: "{{ playbook_dir }}/../test/testdata/keepass.kdbx"
        keepass_password: "test1234"

    - name: Create .env file with password
      copy:
        content: "PASSWORD={{ keepass_password_output.stdout }}"
        dest: /etc/docker/infrastructure/.env
        mode: '0644'
