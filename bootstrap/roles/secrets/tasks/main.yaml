- name: Install pykeepass
  pip:
    name: pykeepass
    state: present

- name: Create docker infrastructure directory
  file:
    path: /etc/docker/infrastructure
    state: directory
    mode: '0755'

- name: Define secrets to extract
  set_fact:
    secrets_config:
      - dest: /etc/docker/infrastructure/.env
        entries:
          - env_var: PASSWORD
            keepass_path: TestGroup/SubGroup/TopSecret
            field: password
      - dest: /etc/docker/infrastructure/.env2
        entries:
          - env_var: DB_USER
            keepass_path: TestGroup/SubGroup/TopSecret2
            field: username
          - env_var: DB_PASSWORD
            keepass_path: TestGroup/SubGroup/TopSecret2
            field: password
          - env_var: DB_EXTRA_SECRET
            keepass_path: TestGroup/SubGroup/TopSecret2
            field: extraSecret
          - env_var: API_KEY
            keepass_path: TestGroup/SubGroup/TopSecret3
            field: password
      - dest: /etc/docker/infrastructure/.env3
        entries:
          - env_var: SERVICE_PASSWORD
            keepass_path: TestGroup/SubGroup/TopSecret3
            field: password
          - env_var: BACKUP_KEY
            keepass_path: TestGroup/SubGroup/TopSecret
            field: password

- name: Extract secrets from keepass and create files
  block:
    - name: Extract all secrets from keepass
      shell: |
        python3 << 'EOF'
        from pykeepass import PyKeePass
        import json
        kp = PyKeePass('{{ keepass_file_path }}', password='{{ keepass_password }}')
        secrets = {}
        {% for file_config in secrets_config %}
        {% for entry in file_config.entries %}
        keepass_entry = kp.find_entries_by_path('{{ entry.keepass_path }}')
        if keepass_entry:
          ke = keepass_entry[0]
          key = '{{ entry.keepass_path }}_{{ entry.field }}'
          if key not in secrets:
            if '{{ entry.field }}' == 'password':
              secrets[key] = ke.password
            elif '{{ entry.field }}' == 'username':
              secrets[key] = ke.username
            else:
              # Custom field
              custom_value = ke.custom_properties.get('{{ entry.field }}', '')
              secrets[key] = custom_value
        {% endfor %}
        {% endfor %}
        print(json.dumps(secrets))
        EOF
      register: keepass_secrets_output
      no_log: true
      vars:
        keepass_file_path: "{{ playbook_dir }}/../test/testdata/keepass.kdbx"
        keepass_password: "test1234"

    - name: Parse secrets
      set_fact:
        extracted_secrets: "{{ keepass_secrets_output.stdout | from_json }}"
      no_log: true

    - name: Create secret files
      copy:
        content: |
          {% for entry in item.entries %}
          {{ entry.env_var }}={{ extracted_secrets[entry.keepass_path + '_' + entry.field] }}
          {% endfor %}
        dest: "{{ item.dest }}"
        mode: '0644'
      loop: "{{ secrets_config }}"
      no_log: true
