- name: Create daemon.json
  copy:
    content: |
      {
        "dns": ["192.168.1.2"],
        "max-concurrent-uploads": 1,
        "max-concurrent-downloads": 1
      }
    dest: /etc/docker/daemon.json
    mode: '0644'

- name: Create secret files
  block:
    - name: Create Infrastructure .env
      block:
        - name: Ensure docker infrastructure directory
          ansible.builtin.file:
            path: /etc/docker/infrastructure
            state: directory
            mode: '0755'

        - name: Create .env file with secrets
          ansible.builtin.copy:
            content: |
              # pihole
              FTLCONF_webserver_api_password={{ pihole_password }}
              
              # ftlv5
              WEBPASSWORD={{ pihole_password }}
              VIRTUAL_HOST=pihole
            dest: /etc/docker/infrastructure/.env
            mode: '0600'
          no_log: true

    - name: Create Smarthome .env
      block:
        - name: Ensure docker smart-home directory
          ansible.builtin.file:
            path: /etc/docker/smart-home
            state: directory
            mode: '0755'

        - name: Create .env file with secrets
          ansible.builtin.copy:
            content: |
              IOBROKER_STATES_REDIS_PORT={{ iobroker_states_redis_port }}
              IOBROKER_OBJECTS_REDIS_PORT={{ iobroker_objects_redis_port }}
              
              INFLUXDB_ADMIN_PASSWORD={{ influxdb_admin_password }}
              INFLUXDB_READ_PASSWORD={{ influxdb_read_password }}
              INFLUXDB_WRITE_PASSWORD={{ influxdb_write_password }}
              
              GRAFANA_PASSWORD={{ grafana_password }}
              
              MOSQUITTO_PASSWD={{ mosquitto_password }}
              
              DECONZ_VNC_PASSWORD={{ deconz_vnc_password }}
              DECONZ_DEVICE_TYPE=ttyACM0
              
              GITHUB_USER={{ github_user }}
              GITHUB_EMAIL={{ github_email }}
            dest: /etc/docker/smart-home/.env
            mode: '0600'
          no_log: false # TODO
