- name: Create docker infrastructure directory
  file:
    path: /etc/docker/infrastructure
    state: directory
    mode: '0755'

- name: Define secrets to extract
  set_fact:
    secrets_config:
      - dest: /etc/docker/infrastructure/.env
        entries:
          - env_var: PASSWORD
            keepass_path: TestGroup/SubGroup/TopSecret
            field: password
      - dest: /etc/docker/infrastructure/.env2
        entries:
          - env_var: DB_USER
            keepass_path: TestGroup/SubGroup/TopSecret2
            field: username
          - env_var: DB_PASSWORD
            keepass_path: TestGroup/SubGroup/TopSecret2
            field: password
          - env_var: DB_EXTRA_SECRET
            keepass_path: TestGroup/SubGroup/TopSecret2
            field: extraSecret
          - env_var: API_KEY
            keepass_path: TestGroup/SubGroup/TopSecret3
            field: password
      - dest: /etc/docker/infrastructure/.env3
        entries:
          - env_var: SERVICE_PASSWORD
            keepass_path: TestGroup/SubGroup/TopSecret3
            field: password
          - env_var: BACKUP_KEY
            keepass_path: TestGroup/SubGroup/TopSecret
            field: password

- name: Extract secrets from keepass
  block:
    - name: Extract all secrets from keepass
      script: extract_secrets.py "{{ keepass_file_path }}" "{{ keepass_password }}" '{{ secrets_config | to_json }}'
      register: keepass_secrets_output
      no_log: false
      delegate_to: localhost
      run_once: true
      vars:
        keepass_file_path: "{{ playbook_dir }}/test/testdata/keepass.kdbx"
        keepass_password: "test1234"

    - name: Parse secrets
      set_fact:
        extracted_secrets: "{{ keepass_secrets_output.stdout | from_json }}"
      no_log: true

    - name: Create secret files
      copy:
        content: |
          {% for entry in item.entries %}
          {{ entry.env_var }}={{ extracted_secrets[item.keepass_path + '_' + entry.field] }}
          {% endfor %}
        dest: "{{ item.dest }}"
        mode: '0644'
      loop: "{{ secrets_config }}"
      no_log: true
