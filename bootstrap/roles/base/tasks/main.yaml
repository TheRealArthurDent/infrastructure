- name: Update apt
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    autoclean: true
    autoremove: true

- name: "Generate Diffie-Hellman parameters with {{ dhparameter_bits }} bits"
  community.crypto.openssl_dhparam:
    path: /etc/ssl/certs/dhparam.pem
    owner: root
    group: root
    mode: '0644'
    size: "{{ dhparameter_bits }}"

- name: Install base packages
  ansible.builtin.apt:
    name:
      - rsnapshot
    state: present

- name: Provision config files
  block:
    - name: Copy redis overcommit config
      ansible.builtin.copy:
        src: etc/sysctl.d/90-overcommit-memory.conf
        dest: /etc/sysctl.d/90-overcommit-memory.conf
        owner: root
        group: root
        mode: '0644'

    # A broken sudoers file locks out sudo, so it's checked before it's
    # put in place (#231).
    - name: Ensure sudoers entry for deploy user
      ansible.builtin.template:
        src: etc/sudoers.d/user.j2
        dest: /etc/sudoers.d/{{ ansible_user }}
        owner: root
        group: root
        mode: '0440'
        validate: 'visudo -cf %s'

    - name: Copy rsnapshot config
      ansible.builtin.copy:
        src: etc/rsnapshot.conf
        dest: /etc/rsnapshot.conf
        owner: root
        group: root
        mode: '0644'

    - name: Ensure cron job "rsnapshot daily" exists
      ansible.builtin.cron:
        name: "rsnapshot daily"
        minute: "0"
        hour: "2"
        job: "rsnapshot daily"
    - name: Ensure cron job "rsnapshot weekly" exists
      ansible.builtin.cron:
        name: "rsnapshot weekly"
        minute: "0"
        hour: "2"
        weekday: "0"
        job: "rsnapshot weekly"
