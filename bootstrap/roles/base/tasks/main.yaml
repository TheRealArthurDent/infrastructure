- name: Update apt
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist

- name: Install base packages
  apt:
    name:
      - rsnapshot
    state: present

- name: Provision config files
  block:
    - name: Copy redis overcommit config
      ansible.builtin.copy:
        src: templates/etc/sysctl.d/90-overcommit-memory.conf
        dest: /etc/sysctl.d/90-overcommit-memory.conf
        owner: root
        group: root
        mode: '0644'

    - name: Create sudoers file for user
      ansible.builtin.template:
        src: templates/etc/sudoers.d/user.j2
        dest: /etc/sudoers.d/{{ ansible_user }}
        owner: root
        group: root
        mode: '0440'

    - name: Copy redis overcommit config
      ansible.builtin.copy:
        src: templates/etc/sysctl.d/90-overcommit-memory.conf
        dest: /etc/sysctl.d/90-overcommit-memory.conf
        owner: root
        group: root
        mode: '0644'

