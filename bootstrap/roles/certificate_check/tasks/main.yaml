- name: Check certificate expiration and renew if needed
  block:
    - name: Set certificate directory
      set_fact:
        certificate_dir: /etc/docker/infrastructure/nginx

    - name: Create temporary certs directory
      ansible.builtin.tempfile:
        state: directory
      register: temp_dir
      delegate_to: localhost
      become: false

    - name: Set certificate renewal threshold (days)
      set_fact:
        cert_renewal_threshold_days: 30
        cert_validity_days: 365
        cert_key_size: 2048
        nginx_container_name: nginx
        root_ca_cert: "/etc/ssl/certs/rootCA.pem"
        root_ca_key: "/etc/ssl/private/rootCA.key"
        #temp_dir: "/tmp/keepass_exports"

    - name: Get root CA passphrase from KeePass
      set_fact:
        root_ca_passphrase_value: "{{ lookup('keepass', 
            db=keepass_db, 
            password=keepass_password, 
            key=keepass_key, 
            group='Domain', 
            title='rootCA') }}"
      delegate_to: localhost
      become: false
      run_once: true

    - name: List available attachments in rootCA entry
      debug:
        msg: "Available attachments: {{ lookup('keepass', 
            db=keepass_db, 
            password=keepass_password, 
            key=keepass_key, 
            group='Domain', 
            title='rootCA',
            attachment='list') }}"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Export rootCA.pem from KeePass (local)
      set_fact:
        temp_root_ca_pem: "{{ lookup('keepass', 
            db=keepass_db, 
            password=keepass_password, 
            key=keepass_key, 
            group='Domain', 
            title='rootCA',
            attachment='rootCA.pem',
            output_path=temp_dir.path + '/rootCA.pem') }}"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Check exported rootCA.pem on localhost
      ansible.builtin.stat:
        path: "{{ temp_dir.path }}/rootCA.pem"
      delegate_to: localhost
      become: false
      run_once: true
      register: pem_stat

    - name: Show rootCA.pem info
      debug:
        msg: "rootCA.pem size: {{ pem_stat.stat.size }} bytes"
      run_once: true

    - name: Export rootCA.key from KeePass (local)
      set_fact:
        temp_root_ca_key: "{{ lookup('keepass', 
            db=keepass_db, 
            password=keepass_password, 
            key=keepass_key, 
            group='Domain', 
            title='rootCA',
            attachment='rootCA.key',
            output_path=temp_dir.path + '/rootCA.key') }}"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Check exported rootCA.key on localhost
      ansible.builtin.stat:
        path: "{{ temp_dir.path }}/rootCA.key"
      delegate_to: localhost
      become: false
      run_once: true
      register: key_stat

    - name: Show rootCA.key info
      debug:
        msg: "rootCA.key size: {{ key_stat.stat.size }} bytes"
      run_once: true

    - name: Copy rootCA.pem to remote host
      ansible.builtin.copy:
        src: "{{ temp_dir.path }}/rootCA.pem"
        dest: "{{ root_ca_cert }}"
        owner: root
        group: root
        mode: '0644'
      ignore_errors: true

    - name: Copy rootCA.key to remote host
      ansible.builtin.copy:
        src: "{{ temp_dir.path }}/rootCA.key"
        dest: "{{ root_ca_key }}"
        owner: root
        group: root
        mode: '0600'
      ignore_errors: true

    #- name: Clean up temporary directory
    #  ansible.builtin.file:
    #    path: "{{ temp_dir.path }}"
    #    state: absent
    #  delegate_to: localhost
    #  become: true
    #  run_once: true

    - name: Read certificate info
      community.crypto.x509_certificate_info:
        path: "{{ certificate_dir }}/{{ inventory_hostname }}.pem"
      register: cert_info
      ignore_errors: true

    - name: Show expiration date
      debug:
        msg: "Certificate {{ inventory_hostname }}.pem expires on {{ cert_info.not_after | replace('Z','UTC') | to_datetime('%Y%m%d%H%M%S%Z') }} UTC"
      when: not cert_info.failed

    - name: Calculate days until expiration
      set_fact:
        days_until_expiration: "{{ (cert_info.not_after | replace('Z','UTC') | to_datetime('%Y%m%d%H%M%S%Z') - now()).days }}"
      when: not cert_info.failed

    - name: Show days until expiration
      debug:
        msg: "Certificate {{ inventory_hostname }}.pem expires in {{ days_until_expiration }} days"
      when: not cert_info.failed

    - name: Check if certificate is signed by root CA
      ansible.builtin.shell: openssl verify -CAfile "{{ root_ca_cert }}" "{{ certificate_dir }}/{{ inventory_hostname }}.pem" >/dev/null 2>&1 && echo "yes" || echo "no"
      register: signed_by_root
      when: not cert_info.failed

    - name: Renew certificate if needed
      block:
        - name: Certificate renewal needed
          debug:
            msg: "Certificate expires in {{ days_until_expiration }} days (threshold: {{ cert_renewal_threshold_days }} days) or is not signed by root CA. Starting renewal process..."

        - name: Generate private key for certificate
          community.crypto.openssl_privatekey:
            backup: true
            path: "{{ certificate_dir }}/{{ inventory_hostname }}.key"
            type: RSA
            size: "{{ cert_key_size }}"
            force: true

        - name: Generate CSR for certificate
          community.crypto.openssl_csr:
            backup: true
            path: "{{ certificate_dir }}/{{ inventory_hostname }}.csr"
            privatekey_path: "{{ certificate_dir }}/{{ inventory_hostname }}.key"
            common_name: "{{ inventory_hostname }}"
            country_name: DE
            state_or_province_name: BY
            organization_name: "{{ inventory_hostname }}"
            subject_alt_name:
              - "DNS:{{ inventory_hostname }}"
              - "DNS:pihole.{{ inventory_hostname }}"
              - "DNS:portainer.{{ inventory_hostname }}"
              - "DNS:nextcloud.{{ inventory_hostname }}"
              - "DNS:iobroker.{{ inventory_hostname }}"
              - "DNS:node-red.{{ inventory_hostname }}"
              - "DNS:grafana.{{ inventory_hostname }}"
              - "DNS:chronograf.{{ inventory_hostname }}"
              - "DNS:outbound.{{ inventory_hostname }}"
              - "DNS:deconz.{{ inventory_hostname }}"
              - "DNS:deconz-ui.{{ inventory_hostname }}"
              - "DNS:ui.{{ inventory_hostname }}"
            force: true

        - name: Generate certificate signed by root CA
          community.crypto.x509_certificate:
            backup: true
            path: "{{ certificate_dir }}/{{ inventory_hostname }}.pem"
            csr_path: "{{ certificate_dir }}/{{ inventory_hostname }}.csr"
            ownca_path: "{{ root_ca_cert }}"
            ownca_privatekey_path: "{{ root_ca_key }}"
            ownca_privatekey_passphrase: "{{ root_ca_passphrase_value }}"
            ownca_not_after: "+{{ cert_validity_days }}d"
            ownca_digest: sha256
            ownca_version: 3
            provider: ownca
            force: true
          register: cert_created

        - name: Set proper permissions on certificate and key
          ansible.builtin.file:
            path: "{{ item }}"
            mode: '0600'
            owner: root
            group: root
          loop:
            - "{{ certificate_dir }}/{{ inventory_hostname }}.pem"
            - "{{ certificate_dir }}/{{ inventory_hostname }}.key"

        - name: Append root CA to certificate for full chain
          ansible.builtin.shell: cat "{{ root_ca_cert }}" >> "{{ certificate_dir }}/{{ inventory_hostname }}.pem"
          when: cert_created.changed

        - name: Certificate renewal completed
          debug:
            msg: "Certificate successfully renewed. Valid for {{ cert_validity_days }} days."
          when: cert_created.changed

        - name: Restart nginx container to load new certificate
          community.docker.docker_container:
            name: "{{ nginx_container_name }}"
            state: started
            restart: true
          register: nginx_restart
          ignore_errors: true

        - name: Wait for nginx to be ready
          ansible.builtin.wait_for:
            port: 443
            delay: 2
            timeout: 30
          when: nginx_restart.changed
          ignore_errors: true

      when:
        - not cert_info.failed
        - days_until_expiration | int < cert_renewal_threshold_days | int or signed_by_root.stdout != "yes"

    - name: Certificate still valid
      debug:
        msg: "Certificate is valid for {{ days_until_expiration }} more days and signed by root CA. No renewal needed."
      when:
        - not cert_info.failed
        - days_until_expiration | int >= cert_renewal_threshold_days | int
        - signed_by_root.stdout == "yes"

    - name: Certificate file missing - generate new one
      block:
        - name: Warning - certificate file not found
          debug:
            msg: "WARNING: Certificate file not found at {{ certificate_dir }}/{{ inventory_hostname }}.pem. Creating new certificate."

        - name: Generate private key for certificate
          community.crypto.openssl_privatekey:
            path: "{{ certificate_dir }}/{{ inventory_hostname }}.key"
            type: RSA
            size: "{{ cert_key_size }}"
            force: true

        - name: Generate CSR for certificate
          community.crypto.openssl_csr:
            backup: true
            path: "{{ certificate_dir }}/{{ inventory_hostname }}.csr"
            privatekey_path: "{{ certificate_dir }}/{{ inventory_hostname }}.key"
            common_name: "{{ inventory_hostname }}"
            country_name: DE
            state_or_province_name: BY
            organization_name: "{{ inventory_hostname }}"
            subject_alt_name:
              - "DNS:{{ inventory_hostname }}"
              - "DNS:pihole.{{ inventory_hostname }}"
              - "DNS:portainer.{{ inventory_hostname }}"
              - "DNS:nextcloud.{{ inventory_hostname }}"
              - "DNS:iobroker.{{ inventory_hostname }}"
              - "DNS:node-red.{{ inventory_hostname }}"
              - "DNS:grafana.{{ inventory_hostname }}"
              - "DNS:chronograf.{{ inventory_hostname }}"
              - "DNS:outbound.{{ inventory_hostname }}"
              - "DNS:deconz.{{ inventory_hostname }}"
              - "DNS:deconz-ui.{{ inventory_hostname }}"
              - "DNS:ui.{{ inventory_hostname }}"
            force: true

        - name: Generate certificate signed by root CA
          community.crypto.x509_certificate:
            path: "{{ certificate_dir }}/{{ inventory_hostname }}.pem"
            csr_path: "{{ certificate_dir }}/{{ inventory_hostname }}.csr"
            ownca_path: "{{ root_ca_cert }}"
            ownca_privatekey_path: "{{ root_ca_key }}"
            ownca_privatekey_passphrase: "{{ root_ca_passphrase_value }}"
            ownca_not_after: "+{{ cert_validity_days }}d"
            ownca_digest: sha256
            ownca_version: 3
            provider: ownca
            force: true

        - name: Set proper permissions on certificate and key
          ansible.builtin.file:
            path: "{{ item }}"
            mode: '0600'
            owner: root
            group: root
          loop:
            - "{{ certificate_dir }}/{{ inventory_hostname }}.pem"
            - "{{ certificate_dir }}/{{ inventory_hostname }}.key"

        - name: Append root CA to certificate for full chain
          ansible.builtin.shell: cat "{{ root_ca_cert }}" >> "{{ certificate_dir }}/{{ inventory_hostname }}.pem"

        - name: Restart nginx container to load new certificate
          community.docker.docker_container:
            name: "{{ nginx_container_name }}"
            state: started
            restart: true
          register: nginx_restart
          ignore_errors: true

        - name: Wait for nginx to be ready
          ansible.builtin.wait_for:
            port: 443
            delay: 2
            timeout: 30
          when: nginx_restart.changed
          ignore_errors: true

      when: cert_info.failed

    - name: Check number of certificates in the chain
      ansible.builtin.shell: openssl crl2pkcs7 -nocrl -certfile "{{ certificate_dir }}/{{ inventory_hostname }}.pem" 2>/dev/null | openssl pkcs7 -print_certs -noout | grep -c "subject="
      register: cert_chain_count
      ignore_errors: true

    - name: Show certificate chain info
      debug:
        msg: "Certificate chain contains {{ cert_chain_count.stdout | default('unknown') }} certificates. Root CA is included if > 1."
      when: not cert_chain_count.failed
