---
# Copy to local.yaml in this directory and adjust. local.yaml is ignored by git (#267).
#
# Path to the KeePass database. Keep it on a local file system: with Google Drive for desktop, set the
# KeePass folder to "Mirror files", so the database is a normal file under /mnt/c instead of on the
# streamed drive (e.g. /mnt/h), whose WSL mount breaks regularly.
local_keepass_db: /mnt/c/Users/<you>/My Drive/KeePass/Raspberry.kdbx
# Key file of the database; leave empty if it has none.
local_keepass_key: ~/.keepass/raspberry.key
