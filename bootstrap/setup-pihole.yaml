---
- name: Configure Pi-hole via REST API
  hosts: testbed
  gather_facts: true
  vars:
    #pihole_host: "{{ pihole_ip | default('pihole.{{ inventory_hostname }}') }}"
    pihole_host: "{{ pihole_ip | default('pihole.testbed') }}"
    pihole_port: 443
    #keepass_db: "{{ lookup('env', 'KEEPASS_DB') }}"
    #keepass_key: "{{ lookup('env', 'KEEPASS_KEY') }}"
    keepass_db: "/mnt/h/Meine Ablage/SmartHome/KeePass/Raspberry.kdbx"
    keepass_key: "/home/mika/.keepass/raspberry.key"

  tasks:
    - name: Get KeePass password from environment variable
      set_fact:
        keepass_password: "{{ lookup('env', 'KEEPASS_PASSWORD') }}"

    - name: Prompt for KeePass password if not in environment
      pause:
        prompt: "KeePass master password"
        echo: no
      register: prompted_password
      when: not keepass_password

    - name: Use prompted password if env not set
      set_fact:
        keepass_password: "{{ prompted_password.user_input }}"
      when: not keepass_password
    - name: Get Pi-hole password from KeePass
      set_fact:
        pihole_password: "{{ lookup('keepass', 
            db=keepass_db, 
            password=keepass_password, 
            key=keepass_key, 
            group='smart-home', 
            title='pihole') }}"
      no_log: true

    - name: Authenticate with Pi-hole API
      ansible.builtin.uri:
        url: "https://{{ pihole_host }}:{{ pihole_port }}/api/auth"
        method: POST
        body_format: json
        body:
          password: "{{ pihole_password }}"
        status_code: 200
        validate_certs: false # TODO remove
      register: auth_response
      no_log: false # TODO true

    - name: Extract session token
      set_fact:
        pihole_session: "{{ auth_response.json.session.sid }}"
      no_log: false # TODO true

    - name: Define desired DNS A records
      set_fact:
        dns_a_records:
          - domain: "fritz.box"
            address: "192.168.1.1"
          - domain: "erdbeere"
            address: "192.168.1.3"

    - name: Define desired CNAME records
      set_fact:
        dns_cname_records:
          - domain: "pihole.erdbeere"
            target: "erdbeere"
          - domain: "test.erdbeere"
            target: "erdbeere"

    - name: Manage A records (hosts)
      include_tasks: tasks/manage_pihole_records.yaml
      vars:
        record_type: "hosts"
        api_endpoint: "/api/config/dns/hosts"
        desired_records: "{{ dns_a_records }}"
        record_format: "objects"
        value_attribute: "address"
        domain_first: false
        separator: " "
        url_separator: "%20"

    - name: Manage CNAME records
      include_tasks: tasks/manage_pihole_records.yaml
      vars:
        record_type: "cnameRecords"
        api_endpoint: "/api/config/dns/cnameRecords"
        desired_records: "{{ dns_cname_records }}"
        record_format: "objects"
        value_attribute: "target"
        domain_first: true
        separator: ","
        url_separator: "%2C"

    - name: Manage block lists
      include_tasks: tasks/manage_pihole_lists.yaml
      vars:
        list_type: "block"
        api_endpoint: "/api/lists"
        desired_records:
          - "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"
          - "https://raw.githubusercontent.com/BBcan177/minerchk/master/hosts.txt"
          - "https://raw.githubusercontent.com/anudeepND/blacklist/master/CoinMiner.txt"
          - "https://raw.githubusercontent.com/AssoEchap/stalkerware-indicators/master/hosts.txt"
          - "https://raw.githubusercontent.com/azet12/KADhosts/master/hosts.txt"
          - "https://raw.githubusercontent.com/betterwebleon/slovenian-list/master/hosts.txt"
          - "https://raw.githubusercontent.com/bigdargon/hostsVN/master/hosts.txt"
          - "https://raw.githubusercontent.com/bigdargon/hostsVN/master/hosts.txt2"
          - "https://raw.githubusercontent.com/bigdargon/hostsVN/master/hosts.txt4"
        record_format: "simple"

    - name: Logout from Pi-hole API
      ansible.builtin.uri:
        url: "https://{{ pihole_host }}:{{ pihole_port }}/api/auth"
        method: DELETE
        headers:
          X-FTL-SID: "{{ pihole_session }}"
        status_code: 204
        validate_certs: false # TODO remove
      ignore_errors: true
