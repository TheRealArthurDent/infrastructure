---
# Checks that the KeePass database is configured and gets its master password (#267).
# Import it before the first lookup('keepass', ...).
- name: Ensure the KeePass database is configured
  ansible.builtin.assert:
    that:
      - keepass_db | length > 0
      - keepass_db is file
      - not keepass_key or keepass_key is file
    fail_msg: >-
      KeePass database or key file not found (db: '{{ keepass_db }}', key: '{{ keepass_key }}').
      Copy inventory/group_vars/all/local.example.yaml to local.yaml and set the paths,
      or set KEEPASS_DB / KEEPASS_KEY.
    quiet: true
  run_once: true

# bin/with-keepass sets it from Windows Credential Manager.
- name: Get the KeePass master password from the environment
  ansible.builtin.set_fact:
    keepass_password: "{{ lookup('ansible.builtin.env', 'KEEPASS_PASSWORD') }}"
  no_log: true

- name: Prompt for the KeePass master password
  ansible.builtin.pause:
    prompt: "KeePass master password"
    echo: false
  register: keepass_prompted_password
  when: not keepass_password

- name: Use the prompted KeePass master password
  ansible.builtin.set_fact:
    keepass_password: "{{ keepass_prompted_password.user_input }}"
  when: not keepass_password
  no_log: true
