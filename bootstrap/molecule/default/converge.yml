- name: Converge
  hosts: all
  gather_facts: true
  vars:
    architecture: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
    # Dummy secrets instead of KeePass lookups. Every value containing LEAKCANARY is a secret;
    # verify.yml fails if one of them shows up in the Ansible log (#230).
    pihole_password: LEAKCANARY-pihole
    outbound_password: LEAKCANARY-outbound
    containermonitor_notification_url: discord://LEAKCANARY-webhook-token@id
    restic_passphrase: LEAKCANARY-restic
    dungeon_ssh_port: 2222
    iobroker_states_redis_port: 9000
    iobroker_objects_redis_port: 9001
    influxdb_admin_password: LEAKCANARY-influx-admin
    influxdb_read_password: LEAKCANARY-influx-read
    influxdb_write_password: LEAKCANARY-influx-write
    grafana_password: LEAKCANARY-grafana
    mosquitto_password: LEAKCANARY-mosquitto
    deconz_vnc_password: LEAKCANARY-vnc
    nodered_github_user: test-user
    nodered_github_email: test@example.com
    # No Docker daemon runs inside the test container.
    certificate_check_reload_nginx: false
    certificate_check_root_ca_passphrase: test-ca-passphrase
  pre_tasks:
    # Throwaway root CA on the control node, kept in the Molecule ephemeral directory so the
    # idempotence run signs with the same CA.
    - name: Create test root CA on the control node
      delegate_to: localhost
      become: false
      block:
        - name: Create test root CA private key
          community.crypto.openssl_privatekey:
            path: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/rootCA.key"
            passphrase: "{{ certificate_check_root_ca_passphrase }}"
            cipher: auto
            size: 2048
            mode: '0600'

        - name: Create test root CA CSR
          community.crypto.openssl_csr_pipe:
            privatekey_path: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/rootCA.key"
            privatekey_passphrase: "{{ certificate_check_root_ca_passphrase }}"
            common_name: Molecule Test Root CA
            basic_constraints: ['CA:TRUE']
            basic_constraints_critical: true
            key_usage: [keyCertSign, cRLSign]
            key_usage_critical: true
          register: test_ca_csr
          changed_when: false

        - name: Create test root CA certificate
          community.crypto.x509_certificate:
            path: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/rootCA.pem"
            csr_content: "{{ test_ca_csr.csr }}"
            privatekey_path: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/rootCA.key"
            privatekey_passphrase: "{{ certificate_check_root_ca_passphrase }}"
            provider: selfsigned
            mode: '0644'

    - name: Pass the test root CA to certificate_check
      ansible.builtin.set_fact:
        certificate_check_root_ca_cert: "{{ lookup('file', lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') ~ '/rootCA.pem') }}"
        certificate_check_root_ca_key: "{{ lookup('file', lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') ~ '/rootCA.key') }}"
      no_log: true
  roles:
    - base
    - docker
    - secrets
    - certificate_check
