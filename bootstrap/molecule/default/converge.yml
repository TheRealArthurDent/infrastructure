- name: Converge
  hosts: all
  gather_facts: true
  vars:
    architecture: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
    # Dummy secrets instead of KeePass lookups.
    pihole_password: test-pihole
    outbound_password: test-outbound
    containermonitor_notification_url: discord://token@id
    restic_passphrase: test-restic
    dungeon_ssh_port: 2222
    iobroker_states_redis_port: 9000
    iobroker_objects_redis_port: 9001
    influxdb_admin_password: test-influx-admin
    influxdb_read_password: test-influx-read
    influxdb_write_password: test-influx-write
    grafana_password: test-grafana
    mosquitto_password: test-mosquitto
    deconz_vnc_password: test-vnc
    nodered_github_user: test-user
    nodered_github_email: test@example.com
  roles:
    - base
    - docker
    - secrets
