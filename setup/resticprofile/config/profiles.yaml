# yaml-language-server: $schema=https://creativeprojects.github.io/resticprofile/jsonschema/config.json

version: "1"

global:
  scheduler: crond

default:
  password-file: /run/secrets/restic_passphrase
  repository: sftp:restic@dungeon:/media/backup/restic/raspi
  initialize: true
  prometheus-save-to-file: /metrics/backup.prom
  backup:
    source: '/source/'
    exclude-caches: true
    exclude-file: '/etc/resticprofile/excludes'
    exclude-if-present: DO_NOT_BACKUP
    one-file-system: false
    schedule: '*-*-* 03:00:00'
    schedule-permission: system
    schedule-priority: background
    check-before: true
    run-before:
      - rm -f /metrics/backup.prom
    extended-status: true
  retention:
    after-backup: true
    keep-within-daily: 7d12h
    keep-within-weekly: 1m12h
    keep-within-monthly: 1y12h
    keep-yearly: unlimited
    prune: true
    # TODO create very basic prom file like so:
    run-after:
      - # HELP resticprofile_forget_status Forget status: 0=fail, 1=warning, 2=success.
      - # TYPE resticprofile_forget_status gauge
      - resticprofile_forget_status{profile="default"} 2
    run-after-fail:
      - # HELP resticprofile_forget_status Forget status: 0=fail, 1=warning, 2=success.
      - # TYPE resticprofile_forget_status gauge
      - resticprofile_forget_status{profile="default"} 0
