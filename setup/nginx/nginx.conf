error_log /var/log/nginx-error.log warn;

events {
}

http {
    upstream php-handler {
        server 127.0.0.1:9001;
    }

    # Redirect all HTTP requests to HTTPS
    server {
        listen              80;
        server_name         %HOSTNAME% %HOSTNAME%.*;
        return              301 https://$host:$request_uri;
    }

    server {
        listen              443 ssl;
        server_name         iobroker.%HOSTNAME% iobroker.%HOSTNAME%.*;

        include             snippets/ssl-certificates.conf;
        include             snippets/ssl-params.conf;

        include             snippets/iobroker.conf;
    }

    server {
        listen              443 ssl;
        server_name         node-red.%HOSTNAME% node-red.%HOSTNAME%.*;

        include             snippets/ssl-certificates.conf;
        include             snippets/ssl-params.conf;

        include             snippets/node-red.conf;
    }

    server {
        listen              443 ssl;
        server_name         deconz.%HOSTNAME% deconz.%HOSTNAME%.*;

        include             snippets/ssl-certificates.conf;
        include             snippets/ssl-params.conf;

        include             snippets/deconz.conf;
    }
    server {
        listen              8443 ssl;

        server_name         deconz.%HOSTNAME% deconz.%HOSTNAME%.*;

        include             snippets/ssl-certificates.conf;
        include             snippets/ssl-params.conf;

        include             snippets/deconz-websocket.conf;
    }

    server {
        listen              443 ssl;
        server_name         grafana.%HOSTNAME% grafana.%HOSTNAME%.*;

        include             snippets/ssl-certificates.conf;
        include             snippets/ssl-params.conf;

        include             snippets/grafana.conf;
    }

    server {
        listen              443 ssl;
        server_name         chronograf.%HOSTNAME% chronograf.%HOSTNAME%.*;

        include             snippets/ssl-certificates.conf;
        include             snippets/ssl-params.conf;

        include             snippets/chronograf.conf;
    }

    server {
        listen              443 ssl;
        server_name         portainer.%HOSTNAME% portainer.%HOSTNAME%.*;

        include             snippets/ssl-certificates.conf;
        include             snippets/ssl-params.conf;

        include             snippets/portainer.conf;
    }

    server {
        listen              443 ssl;
        server_name         nextcloud.%HOSTNAME% nextcloud.%HOSTNAME%.*;

        include             snippets/ssl-certificates.conf;
        include             snippets/ssl-params.conf;

        include             snippets/nextcloud.conf;
    }

    server {
        listen              443 ssl;
        server_name         pihole.%HOSTNAME% pihole.%HOSTNAME%.*;

        include             snippets/ssl-certificates.conf;
        include             snippets/ssl-params.conf;

        include             snippets/pihole.conf;
    }

    server {
        listen              443 ssl;
        server_name         outbound.%HOSTNAME% outbound.%HOSTNAME%.*;

        include             snippets/ssl-certificates.conf;
        include             snippets/ssl-params.conf;

        include             snippets/pihole_outbound.conf;
    }

    # Do the real sh1t
    server {
        listen              443 ssl;
        server_name         %HOSTNAME% %HOSTNAME%.*;

        include             snippets/ssl-certificates.conf;
        include             snippets/ssl-params.conf;

        root                /usr/share/nginx/html;
        # TODO #5 create some sort of landing page
    }
}

stream {
    upstream dns_servers {
        server 172.30.2.53:53;
    }

    server {
        listen 53; # tcp
        listen 53 udp;

        proxy_pass dns_servers;
        error_log  /var/log/nginx/dns.log info;
    }
}
