error_log /var/log/nginx-error.log warn;

events {
}

http {
    # Redirect all HTTP requests to HTTPS
    server {
        listen              80;
        server_name         raspi.home;
        # TODO remove port 444 with https://github.com/TheRealArthurDent/raspberry/issues/8
        return              301 https://$host:444$request_uri;
    }

    server {
        listen              443 ssl;
        server_name         iobroker.raspi.home;

        include             snippets/ssl-certificates.conf;
        include             snippets/ssl-params.conf;

        include             snippets/iobroker.conf;
    }

    server {
        listen              443 ssl;
        server_name         node-red.raspi.home;

        include             snippets/ssl-certificates.conf;
        include             snippets/ssl-params.conf;

        include             snippets/node-red.conf;
    }

    server {
        listen              443 ssl;
        server_name         grafana.raspi.home;

        include             snippets/ssl-certificates.conf;
        include             snippets/ssl-params.conf;

        include             snippets/grafana.conf;
    }

    server {
        listen              443 ssl;
        server_name         chronograf.raspi.home;

        include             snippets/ssl-certificates.conf;
        include             snippets/ssl-params.conf;

        include             snippets/chronograf.conf;
    }

    server {
        listen              443 ssl;
        server_name         portainer.raspi.home;

        include             snippets/ssl-certificates.conf;
        include             snippets/ssl-params.conf;

        include             snippets/portainer.conf;
    }

    # Do the real sh1t
    server {
        listen              443 ssl;
        server_name         raspi.home;

        include             snippets/ssl-certificates.conf;
        include             snippets/ssl-params.conf;

        root                /usr/share/nginx/html;
        # TODO #5 create some sort of landing page
    }
}
