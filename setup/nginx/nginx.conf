error_log /var/log/nginx-error.log debug;

events {
}

http {
    # Redirect all HTTP requests to HTTPS
    server {
        listen              80;
        server_name         raspi.home;
        # TODO remove port 444 with https://github.com/TheRealArthurDent/raspberry/issues/8
        return              301 https://$host:444$request_uri;
    }

    server {
        listen              443 ssl;
        server_name         iobroker.raspi.home;

        ssl_certificate     /etc/nginx/raspi.crt;
        ssl_certificate_key /etc/nginx/raspi.key;
        include             snippets/ssl-params.conf;

        include             snippets/iobroker.conf;
    }

    # Do the real sh1t
    server {
        listen              443 ssl;
        server_name         raspi.home;

        ssl_certificate     /etc/nginx/raspi.crt;
        ssl_certificate_key /etc/nginx/raspi.key;
        include             snippets/ssl-params.conf;

        root                /usr/share/nginx/html;

        #location / {
        #    proxy_pass http://localhost:8081; # vis ?
        #}
        include             snippets/portainer.conf;
        include             snippets/grafana.conf;
        include             snippets/chronograf.conf;
        include             snippets/node-red.conf;
    }
}
