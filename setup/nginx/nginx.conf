error_log /var/log/nginx-error.log debug;

events {
}

http {
    # Redirect all HTTP requests to HTTPS
    server {
        listen              80;
        server_name         raspi;
        return              301 https://$host$request_uri;
    }

    # Do the real sh1t
    server {
        listen              443 ssl;
        server_name         raspi;

        ssl_certificate     /etc/nginx/raspi.crt;
        ssl_certificate_key /etc/nginx/raspi.key;
        include             snippets/ssl-params.conf;

        root                /usr/share/nginx/html;

        #location / {
        #    proxy_pass http://localhost:8081; # vis ?
        #}
        location /iobroker/ {
            rewrite    /iobroker/(.*) /$1 break;
            proxy_pass http://iobroker:8081;
            proxy_http_version 1.1;
            proxy_cache_bypass  $http_upgrade;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            #Forwards the real visitor remote IP address to the proxied server
            proxy_set_header X-Real-IP $remote_addr;
		    #A list containing the IP addresses of every server the client has been proxied through
		    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		    #When used inside an HTTPS server block, each HTTP response from the proxied server is rewritten to HTTPS.
		    proxy_set_header X-Forwarded-Proto $scheme;
		    #Defines the original host requested by the client.
		    proxy_set_header X-Forwarded-Host $host;
		    #Defines the original port requested by the client.
		    proxy_set_header X-Forwarded-Port $server_port;
 		    proxy_hide_header X-Frame-Options;
 		    add_header X-Frame-Options SAMEORIGIN;
        }
        # the next location (lib, adapter and socket.io) are wild hacks,
        # because iobroker isn't really built to run behind a reverse proxy
        location ~ ^/(lib|adapter|socket[.]io)/ {
            proxy_pass http://iobroker:8081;
            proxy_http_version 1.1;
            proxy_cache_bypass  $http_upgrade;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            #Forwards the real visitor remote IP address to the proxied server
            proxy_set_header X-Real-IP $remote_addr;
		    #A list containing the IP addresses of every server the client has been proxied through
		    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		    #When used inside an HTTPS server block, each HTTP response from the proxied server is rewritten to HTTPS.
		    proxy_set_header X-Forwarded-Proto $scheme;
		    #Defines the original host requested by the client.
		    proxy_set_header X-Forwarded-Host $host;
		    #Defines the original port requested by the client.
		    proxy_set_header X-Forwarded-Port $server_port;
 		    proxy_hide_header X-Frame-Options;
 		    add_header X-Frame-Options SAMEORIGIN;
        }
        location /web/ {
            rewrite    /web/(.*) /$1 break;
            proxy_pass http://iobroker:8082;
        }
        location /roomba {
            proxy_pass http://localhost:8082;
        }
        location /node-red {
            proxy_pass http://iobroker:1880;
            proxy_http_version 1.1;
            proxy_cache_bypass  $http_upgrade;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            #Forwards the real visitor remote IP address to the proxied server
            proxy_set_header X-Real-IP $remote_addr;
		    #A list containing the IP addresses of every server the client has been proxied through
		    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		    #When used inside an HTTPS server block, each HTTP response from the proxied server is rewritten to HTTPS.
		    proxy_set_header X-Forwarded-Proto $scheme;
		    #Defines the original host requested by the client.
		    proxy_set_header X-Forwarded-Host $host;
		    #Defines the original port requested by the client.
		    proxy_set_header X-Forwarded-Port $server_port;
        }
        location /grafana {
            resolver 127.0.0.11;
            set $grafana_host grafana:3000;
            proxy_pass http://$grafana_host;
            proxy_set_header Host $host;
        }
        include             snippets/chronograf.conf;
        location /portainer/ {
            proxy_pass http://portainer:9000;
            rewrite    /portainer/(.*) /$1 break;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
     }

    # Do the real sh1t
    server {
        listen              8081 ssl;
        server_name         raspi;

        ssl_certificate     /etc/nginx/raspi.crt;
        ssl_certificate_key /etc/nginx/raspi.key;
        include             snippets/ssl-params.conf;

        root                /usr/share/nginx/html;

        location / {
            proxy_pass http://iobroker:8081;
            proxy_http_version 1.1;
            proxy_cache_bypass  $http_upgrade;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            #Forwards the real visitor remote IP address to the proxied server
            proxy_set_header X-Real-IP $remote_addr;
		    #A list containing the IP addresses of every server the client has been proxied through
		    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		    #When used inside an HTTPS server block, each HTTP response from the proxied server is rewritten to HTTPS.
		    proxy_set_header X-Forwarded-Proto $scheme;
		    #Defines the original host requested by the client.
		    proxy_set_header X-Forwarded-Host $host;
		    #Defines the original port requested by the client.
		    proxy_set_header X-Forwarded-Port $server_port;
		    proxy_hide_header X-Frame-Options;
		    add_header X-Frame-Options SAMEORIGIN;
        }
    }
}