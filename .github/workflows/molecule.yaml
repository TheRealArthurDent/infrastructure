name: Molecule Tests

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'bootstrap/**'
      - 'molecule/**'
      - 'requirements.txt'
      - '.github/workflows/molecule.yaml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'bootstrap/**'
      - 'molecule/**'

jobs:
  molecule:
    name: Molecule Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - debian-13
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Molecule tests
        run: |
          cd bootstrap
          molecule test -s ${{ matrix.scenario }}
        env:
          ANSIBLE_VERBOSITY: 1
