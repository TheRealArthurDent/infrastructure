name: Review dog

on:
  pull_request:
    branches:
      - main

# A new push to a PR cancels the run for the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# reviewdog posts its findings as PR review comments. Set explicitly: a repo created after 2023 gives the
# GITHUB_TOKEN read-only access by default, and the comments then fail with 403.
permissions:
  contents: read
  pull-requests: write

jobs:
  reviewdog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Spellcheck
        uses: reviewdog/action-misspell@c846b6b0996029d2d39540c8ffebebbd957072db # v1.31.0
        with:
          reporter: github-pr-review
          # MQTT broker name, not a typo of "mosquito"
          ignore: mosquitto

      - name: Action lint
        uses: reviewdog/action-actionlint@v1.84.1
        with:
          reporter: github-pr-review

      - name: YAML lint
        uses: reviewdog/action-yamllint@020fba38ce9fed550c704d933aeeb7d6360f7d47 # v1.26.0
        with:
          reporter: github-pr-review

      - name: Markdown lint
        uses: reviewdog/action-markdownlint@v0.33.1
        with:
          reporter: github-pr-review
