name: Review dog

on:
  pull_request:
    branches:
      - main

jobs:
  reviewdog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Spellcheck
        uses: reviewdog/action-misspell@v1.27.0
        with:
          reporter: github-pr-review

      - name: Action lint
        uses: reviewdog/action-actionlint@v1.72.0
        with:
          reporter: github-pr-review

      - name: YAML lint
        uses: reviewdog/action-yamllint@v1.22.0
        with:
          reporter: github-pr-review

      - name: Markdown lint
        uses: reviewdog/action-markdownlint@v0.27.0
        with:
          reporter: github-pr-review
