name: Review dog

on:
  pull_request:
    branches:
      - main

# A new push to a PR cancels the run for the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# reviewdog posts its findings as PR review comments. Set explicitly: a repo created after 2023 gives the
# GITHUB_TOKEN read-only access by default, and the comments then fail with 403.
permissions:
  contents: read
  pull-requests: write

jobs:
  reviewdog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Spellcheck
        uses: reviewdog/action-misspell@v1.30.2
        with:
          reporter: github-pr-review
          # MQTT broker name, not a typo of "mosquito"
          ignore: mosquitto

      - name: Action lint
        uses: reviewdog/action-actionlint@v1.80.1
        with:
          reporter: github-pr-review

      - name: YAML lint
        uses: reviewdog/action-yamllint@v1.25.1
        with:
          reporter: github-pr-review

      - name: Markdown lint
        uses: reviewdog/action-markdownlint@v0.31.4
        with:
          reporter: github-pr-review
