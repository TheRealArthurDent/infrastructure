---
name: Ansible Lint

on:
  push:
    branches:
      - main
    paths:
      - 'ansible/**'
      - '.ansible-lint'
      - '.yamllint.yaml'
      - 'requirements.txt'
      - '.pre-commit-config.yaml'
      - '.github/workflows/ansible-lint.yaml'
  # Every PR, whatever its base branch.
  pull_request:
    paths:
      - 'ansible/**'
      - '.ansible-lint'
      - '.yamllint.yaml'
      - 'requirements.txt'
      - '.github/workflows/ansible-lint.yaml'

jobs:
  lint:
    name: Lint Ansible Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      # Same pinned versions as local runs and pre-commit, so results match.
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Without the collections, syntax-check can't resolve community.* modules.
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yaml

      - name: Run ansible-lint
        run: |
          ansible-lint --strict ansible/
