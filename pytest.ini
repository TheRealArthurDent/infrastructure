[pytest]
# Pytest configuration for Ansible testing

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Verbosity
addopts =
    -v
    --strict-markers
    --tb=short

# Markers for test organization
markers =
    unit: Unit tests
    integration: Integration tests
    molecule: Molecule tests
    slow: Slow tests
