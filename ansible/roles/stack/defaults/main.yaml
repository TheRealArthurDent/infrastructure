---
# Config and data of the infrastructure stack live below this directory. The secrets role writes the
# .env files and secrets/ here.
stack_dir: /etc/docker/infrastructure
# The running containers belong to the Compose project "infrastructure". Keep the name, or Compose would start a
# second stack whose fixed container names collide.
stack_project_name: infrastructure
# Not stack_dir itself: Compose reads a .env next to the compose file for variable interpolation.
stack_compose_dir: "{{ stack_dir }}/compose"
# Resolved on the host at every run, so its IP isn't configured anywhere.
# Set stack_dungeon_ip to skip the lookup.
stack_dungeon_host: dungeon
stack_nginx_container: nginx
# Networks, compose up and the nginx reload need a running Docker daemon (false in Molecule).
stack_manage_containers: true

# Clean-slate restore of restore_items before the stack starts on a fresh host (raspberry#287): tasks/restore.yaml.
# resticprofile backs up the whole host, so the restore helper is a host service and every stack restores its own
# items with it. -e skip_infrastructure_restore=true (a new host with nothing to restore) only writes this stack's
# marker; -e infrastructure_restore_snapshot=<id> restores another snapshot than the latest.
stack_skip_restore: "{{ skip_infrastructure_restore | default(false) }}"
stack_restore_snapshot: "{{ infrastructure_restore_snapshot | default('latest') }}"
# <stack>.done markers, written once a stack's restore is done or skipped
stack_restore_state_dir: /var/lib/restic-restore
# resticprofile only schedules backups once each of these stacks has its marker, so a fresh host never backs up a
# half-restored state as the latest snapshot. Add a stack here once its deployment runs restic-restore clean-slate.
stack_backup_stacks:
  - "{{ stack_project_name }}"
# Host path -> path inside the resticprofile container, as mounted in docker-compose.yaml.j2
stack_restore_source_mounts:
  /home: /source/home
  /etc: /source/etc
  /var/lib/docker/volumes: /source/docker-volumes
# Where the helper stages a restore: on the host and inside the resticprofile container
stack_restore_staging:
  host: /var/restore
  restic: /restore-target
# The local rsnapshot copy (base role's rsnapshot.conf) for restic-restore --from rsnapshot: <root>/<snapshot>/<host>
stack_restore_rsnapshot:
  root: /var/cache/backup
  host: localhost
# Monthly restore drill (raspberry#288): restic check reads one of `parts` parts of the data (all of it over `parts`
# months), then every item of every stack is staged and removed again. The result goes to the resticprofile container's
# metrics dir, where its healthcheck reads it. Runs from root's crontab on the host, away from the 03:00 backup.
# false removes the cron job and the last result, e.g. on a host that is often switched off
stack_restore_drill_enabled: true
stack_restore_drill:
  metrics: /var/lib/resticprofile/metrics/restore_drill.prom
  parts: 12
  day: "1"
  hour: "12"
  minute: "0"
# How the helper runs restic: in the running container (exec) or, before the stack is up, in a one-off one
stack_restore_runners:
  exec: [docker, exec, resticprofile, resticprofile]
  oneoff:
    - docker
    - compose
    - --file
    - "{{ stack_compose_dir }}/docker-compose.yaml"
    - --project-name
    - "{{ stack_project_name }}"
    - run
    - --rm
    - --no-deps
    - --no-TTY
    - --entrypoint
    - resticprofile
    - resticprofile
