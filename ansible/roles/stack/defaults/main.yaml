---
# Config and data of the infrastructure stack live below this directory. The secrets role writes the
# .env files and secrets/ here.
stack_dir: /etc/docker/infrastructure
# The running containers belong to the Compose project "infrastructure". Keep the name, or Compose would start a
# second stack whose fixed container names collide.
stack_project_name: infrastructure
# Not stack_dir itself: Compose reads a .env next to the compose file for variable interpolation.
stack_compose_dir: "{{ stack_dir }}/compose"
# Networks, compose up and the nginx reload need a running Docker daemon (false in Molecule).
stack_manage_containers: true

# The components of the stack (#14): each one is a role with its own compose fragment
# (roles/<component>/templates/docker-compose.yaml.j2) and the config it needs. The stack role imports the roles
# listed here and merges their fragments into one Compose project.
stack_components:
  - reverse_proxy
  - portainer
  - unbound
  - pihole
  - outbound
  - resticprofile
  - healthmonitor

# The stack's own part of the compose file: the networks it creates in tasks/main.yaml, external for Compose, and
# nginx, which unbound and resticprofile attach to even on a host without the reverse proxy component.
stack_compose_networks:
  networks:
    nginx:
      name: nginx
    siz:
      name: siz
      external: true
    outbound:
      name: outbound
      external: true

# State that doesn't come from IaC and gets restored from the resticprofile backup (raspberry#284, raspberry#285). The
# targeted restore helper (raspberry#286) and the clean-slate restore (raspberry#287) both work from this list:
# the <component>_restore_items of the enabled components (portainer, pihole), merged.
#
# Scope is this repo's stack. Other repos (smart-home, Nextcloud, ...) restore their own state, and nothing
# else under /etc or /home is needed: Ansible renders the configs, certificates and .env files, the restic SSH
# key is created anew and registered with init-restic.sh, and the OS installer sets up users, network and
# authorized_keys. resticprofile itself must come up without a backup, so it is not listed either.
#
# Each item:
#   paths:      host directories to restore, all of them in the backup (ansible/tests/unit/test_restore_items.py)
#   containers: stopped while the item is restored, started again afterwards
#   preserve:   files inside paths (globs, relative to the path) the backup excludes; a restore that mirrors the
#               snapshot must keep them. Each exclude pattern in excludes.j2 that lies inside an item is
#               listed here, which the test checks.
#   note:       why the item is here
#
# Owner and mode aren't listed: restic restores them along with the files.
stack_restore_items: >-
  {{ query('ansible.builtin.vars',
           *(stack_components | map('ansible.builtin.regex_replace', '^(.+)$', '\1_restore_items')),
           default={})
     | ansible.builtin.combine }}
