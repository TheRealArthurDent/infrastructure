---
# Clean-slate restore (raspberry#287): on a fresh host, this stack's restore_items come back from the latest snapshot
# before the stack starts. resticprofile backs up the whole host, so the helper is a host service: other stacks put
# their own items into /etc/restic-restore/stacks/ and call it themselves. The helper decides and works
# (ansible/tests/unit/test_restic_restore.py); a marker makes every later run a no-op. A host that already has
# data (raspi, testbed) only gets the marker.

- name: Ensure the restore helper is present
  ansible.builtin.copy:
    src: restic-restore
    dest: /usr/local/bin/restic-restore
    owner: root
    group: root
    mode: '0755'
  register: stack_restore_helper_file

- name: Ensure the restore helper config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /etc/restic-restore
    - /etc/restic-restore/stacks

# No secrets: restic gets the passphrase from the resticprofile container.
- name: Ensure the restore helper host config is present
  ansible.builtin.copy:
    content: "{{ stack_restore_config | to_nice_json }}\n"
    dest: /etc/restic-restore/config.json
    owner: root
    group: root
    mode: '0644'
  vars:
    stack_restore_config:
      stacks_dir: /etc/restic-restore/stacks
      state_dir: "{{ stack_restore_state_dir }}"
      source_mounts: "{{ stack_restore_source_mounts }}"
      staging: "{{ stack_restore_staging }}"
      runners: "{{ stack_restore_runners }}"
      rsnapshot: "{{ stack_restore_rsnapshot }}"
      # One expression, so parts stays a number in the JSON
      drill: >-
        {{ {'metrics': stack_restore_drill.metrics, 'parts': stack_restore_drill.parts | int,
            'enabled': stack_restore_drill_enabled | bool} }}
  register: stack_restore_config_file

- name: Ensure the restore items of this stack are listed for the helper
  ansible.builtin.copy:
    content: "{{ {'items': restore_items} | to_nice_json }}\n"
    dest: /etc/restic-restore/stacks/{{ stack_project_name }}.json
    owner: root
    group: root
    mode: '0644'
  register: stack_restore_items_file

# Monthly restore drill (raspberry#288): its result goes to the resticprofile healthcheck, so healthmonitor alerts on a
# failed or missed drill. The log goes to the journal (journalctl -t restic-restore-drill).
- name: Ensure cron job "restore drill" is {{ stack_restore_drill_enabled | bool | ternary('present', 'absent') }}
  ansible.builtin.cron:
    name: restore drill
    state: "{{ stack_restore_drill_enabled | bool | ternary('present', 'absent') }}"
    user: root
    day: "{{ stack_restore_drill.day }}"
    hour: "{{ stack_restore_drill.hour }}"
    minute: "{{ stack_restore_drill.minute }}"
    job: /usr/local/bin/restic-restore drill 2>&1 | logger -t restic-restore-drill

# A stale result of a disabled drill would turn the healthcheck red after 35 days
- name: Ensure no restore drill result is left when the drill is disabled
  ansible.builtin.file:
    path: "{{ stack_restore_drill.metrics }}"
    state: absent
  when: not stack_restore_drill_enabled | bool

# In check mode the files above and the compose file and resticprofile config (main.yaml) aren't written: on a
# fresh host the helper doesn't exist yet, and where one of them is due for an update, the dry run would run the old
# helper, config or one-off container (it did on testbed, and on raspi with an old IPv6 address for dungeon).
- name: Check whether the dry run can use the deployed helper
  ansible.builtin.set_fact:
    stack_restore_dry_run_possible: >-
      {{ not ansible_check_mode
         or not (stack_restore_helper_file is changed
                 or stack_restore_config_file is changed
                 or stack_restore_items_file is changed
                 or stack_compose_file is changed
                 or stack_resticprofile_config_files is changed) }}

- name: Ensure restore_items are restored on a fresh host
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/local/bin/restic-restore', '--runner', 'oneoff', 'clean-slate', stack_project_name,
          '--snapshot', stack_restore_snapshot]
         + (['--skip'] if stack_skip_restore | bool else [])
         + (['--dry-run'] if ansible_check_mode else []) }}
  register: stack_restore
  changed_when: stack_restore.rc == 0 and (stack_restore.stdout | from_json).changed
  # Fails in the next task, with the next step for the user
  failed_when: false
  # Read-only with --dry-run, so it also reports in check mode what a real run would do
  check_mode: false
  when: stack_restore_dry_run_possible | bool

- name: Ensure the restore succeeded
  ansible.builtin.fail:
    msg: "{{ stack_restore.stderr }}\n{{ stack_restore_hints[stack_restore.rc] | default('') }}"
  vars:
    stack_restore_hints:
      10: >-
        Check that the backup host accepts this host's restic SSH key: run sudo {{ stack_dir }}/init-restic.sh
        on the host, then run the playbook again.
      11: >-
        If this is a new host with nothing to restore, run the playbook again with
        -e skip_infrastructure_restore=true.
  when: stack_restore is not skipped and stack_restore.rc != 0

- name: Report the restore
  ansible.builtin.debug:
    msg: "{{ (stack_restore.stdout | from_json).msg }}"
  when: stack_restore is not skipped

- name: Report the restore in check mode before the helper is up to date
  ansible.builtin.debug:
    msg: >-
      restic-restore, its config or the compose file isn't installed or up to date yet, so no dry run: a real run
      restores {{ restore_items | list | join(', ') }} from snapshot {{ stack_restore_snapshot }} unless the marker
      exists, the host has data already or skip_infrastructure_restore is set.
  when: stack_restore is skipped
