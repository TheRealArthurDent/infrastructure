---
# Clean-slate restore (#287): on a fresh host, restore_items come back from the latest snapshot before the stack
# starts. The helper decides and works (ansible/tests/unit/test_restic_restore.py); a marker makes every later run
# a no-op. A host that already has data (raspi, testbed) only gets the marker.

- name: Ensure the restore helper is present
  ansible.builtin.copy:
    src: restic-restore
    dest: /usr/local/bin/restic-restore
    owner: root
    group: root
    mode: '0755'

- name: Ensure the restore helper config directory exists
  ansible.builtin.file:
    path: /etc/restic-restore
    state: directory
    owner: root
    group: root
    mode: '0755'

# No secrets: restic gets the passphrase from the resticprofile container.
- name: Ensure the restore helper config is present
  ansible.builtin.copy:
    content: "{{ stack_restore_config | to_nice_json }}\n"
    dest: /etc/restic-restore/config.json
    owner: root
    group: root
    mode: '0644'
  vars:
    stack_restore_config:
      items: "{{ restore_items }}"
      source_mounts: "{{ stack_restore_source_mounts }}"
      staging: "{{ stack_restore_staging }}"
      runners: "{{ stack_restore_runners }}"

# In check mode on a fresh host the helper isn't installed yet, and the compose file the one-off container needs
# doesn't exist either.
- name: Stat the restore helper
  ansible.builtin.stat:
    path: /usr/local/bin/restic-restore
  register: stack_restore_helper

- name: Ensure restore_items are restored on a fresh host
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/local/bin/restic-restore', '--runner', 'oneoff', 'clean-slate',
          '--marker', stack_restore_marker, '--snapshot', stack_restore_snapshot]
         + (['--skip'] if stack_skip_restore | bool else [])
         + (['--dry-run'] if ansible_check_mode else []) }}
  register: stack_restore
  changed_when: stack_restore.rc == 0 and (stack_restore.stdout | from_json).changed
  # Read-only with --dry-run, so it also reports in check mode what a real run would do
  check_mode: false
  when: stack_restore_helper.stat.exists

- name: Report the restore
  ansible.builtin.debug:
    msg: "{{ (stack_restore.stdout | from_json).msg }}"
  when: stack_restore is not skipped

- name: Report the restore in check mode on a fresh host
  ansible.builtin.debug:
    msg: >-
      restic-restore isn't installed yet: a real run restores {{ restore_items | list | join(', ') }} from
      snapshot {{ stack_restore_snapshot }}, unless the host has data already or skip_restore is set.
  when: stack_restore is skipped
