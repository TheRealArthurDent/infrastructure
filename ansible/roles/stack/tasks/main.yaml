---
# Deploys the infrastructure stack (raspberry#238) as one Compose project from its components (#14): every role in
# stack_components brings its compose fragment and the config it needs; this role merges the fragments, restores a
# fresh host and starts the project. Needs the files the secrets role writes (.env files, secrets/restic_passphrase),
# the DH params from the base role and the certificate from check-certificates.yaml.

# requests for the community.docker modules, yaml for docker_compose_v2 with definition
- name: Ensure Python libraries for the Docker modules are installed
  ansible.builtin.apt:
    name:
      - python3-requests
      - python3-yaml
    state: present

- name: Check the components of this host
  ansible.builtin.import_tasks: components.yaml

# Static imports, so the stack tag from bootstrap.yaml reaches the components' tasks.
- name: Set up the reverse proxy
  ansible.builtin.import_role:
    name: reverse_proxy
    tasks_from: main
  when: "'reverse_proxy' in stack_components"

- name: Set up portainer
  ansible.builtin.import_role:
    name: portainer
    tasks_from: main
  when: "'portainer' in stack_components"

- name: Set up unbound
  ansible.builtin.import_role:
    name: unbound
    tasks_from: main
  when: "'unbound' in stack_components"

- name: Set up Pi-hole
  ansible.builtin.import_role:
    name: pihole
    tasks_from: main
  when: "'pihole' in stack_components"

- name: Set up the outbound Pi-hole
  ansible.builtin.import_role:
    name: outbound
    tasks_from: main
  when: "'outbound' in stack_components"

- name: Set up resticprofile
  ansible.builtin.import_role:
    name: resticprofile
    tasks_from: main
  when: "'resticprofile' in stack_components"

- name: Set up healthmonitor
  ansible.builtin.import_role:
    name: healthmonitor
    tasks_from: main
  when: "'healthmonitor' in stack_components"

- name: Ensure the compose directory exists
  ansible.builtin.file:
    path: "{{ stack_compose_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

# The components' fragments (roles/<component>/templates/docker-compose.yaml.j2) are siblings of this role. Rendered
# after the components' tasks, which set what the fragments need (resticprofile_backup_host_ip).
- name: Merge the compose fragments of the components
  ansible.builtin.set_fact:
    stack_compose_definition: >-
      {{ (query('ansible.builtin.template', *stack_compose_fragments) | map('ansible.builtin.from_yaml') | list
          + [stack_compose_networks])
         | compose_merge }}
  vars:
    stack_compose_fragments: >-
      {{ stack_components
         | map('ansible.builtin.regex_replace', '^(.+)$',
               role_path | dirname ~ '/\1/templates/docker-compose.yaml.j2')
         | list }}

# Kept for manual docker compose commands and the one-off restore runner. Compose up below uses the definition, so
# --check can compare it with the running containers even before this file exists: check mode doesn't write it.
- name: Ensure the compose file is present
  ansible.builtin.copy:
    content: |-
      # Merged by the stack role from the components' compose fragments (#14). Don't edit, run the playbook.
      {{ stack_compose_definition | ansible.builtin.to_nice_yaml(indent=2) }}
    dest: "{{ stack_compose_dir }}/docker-compose.yaml"
    owner: root
    group: root
    mode: '0644'
  register: stack_compose_file

- name: Restore the stack's restore items on a fresh host
  ansible.builtin.import_role:
    name: resticprofile
    tasks_from: restore
  when: "'resticprofile' in stack_components"

- name: Deploy containers
  when: stack_manage_containers | bool
  block:
    # Both are external in the compose file.
    - name: Ensure the internal network siz exists
      community.docker.docker_network:
        name: siz
        internal: true
        ipam_config:
          - subnet: 172.30.2.0/24
      register: stack_network_siz

    - name: Ensure the network outbound exists
      community.docker.docker_network:
        name: outbound
        ipam_config:
          - subnet: 172.30.1.128/25
            iprange: 172.30.1.192/26
      register: stack_network_outbound

    # Images are pinned (Renovate), so the default pull policy "missing" pulls exactly when a version changes.
    - name: Ensure the stack is up
      community.docker.docker_compose_v2:
        definition: "{{ stack_compose_definition }}"
        project_name: "{{ stack_project_name }}"
        state: present
        pull: policy
      # In check mode a missing network isn't created, and Compose would fail on the external network.
      when: not (ansible_check_mode and (stack_network_siz is changed or stack_network_outbound is changed))
