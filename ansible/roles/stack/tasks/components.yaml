---
# Checks of the host's stack_components (#14), imported first by main.yaml so nothing is deployed for a wrong list.

# Both Pi-holes use unbound as their only upstream (FTLCONF_dns_upstreams) and depend on it in their fragments.
- name: Ensure unbound is a component wherever pihole or outbound is
  ansible.builtin.assert:
    that: "'unbound' in stack_components or not (['pihole', 'outbound'] | intersect(stack_components))"
    fail_msg: "pihole and outbound need unbound: add unbound to stack_components or leave them out too"
    quiet: true

# healthmonitor's fragment sets dns: to the outbound Pi-hole's address.
- name: Ensure outbound is a component wherever healthmonitor is
  ansible.builtin.assert:
    that: "'outbound' in stack_components or 'healthmonitor' not in stack_components"
    fail_msg: "healthmonitor needs outbound (its dns): add outbound to stack_components or leave healthmonitor out too"
    quiet: true

# Both read the Docker API from the proxy, not from the socket (DOCKER_HOST, Telegraf's endpoint).
- name: Ensure docker_socket_proxy is a component wherever a client of the Docker API is
  ansible.builtin.assert:
    that: "'docker_socket_proxy' in stack_components or item not in stack_components"
    fail_msg: "{{ item }} needs docker_socket_proxy: add it to stack_components or leave {{ item }} out too"
    quiet: true
  loop:
    - healthmonitor
    - monitoring_agent

# The landing page is served by nginx at https://<host>/.
- name: Ensure reverse_proxy is a component wherever landing_page is
  ansible.builtin.assert:
    that: "'reverse_proxy' in stack_components or 'landing_page' not in stack_components"
    fail_msg: "landing_page needs reverse_proxy: add reverse_proxy to stack_components or leave landing_page out too"
    quiet: true

# The agents write to the central part through nginx (the metrics vhost, #39).
- name: Ensure the write path of the monitoring is served wherever its central part runs
  ansible.builtin.assert:
    that: >-
      'monitoring' not in stack_components
      or ('reverse_proxy' in stack_components and 'metrics' in reverse_proxy_vhosts)
    fail_msg: >-
      monitoring needs reverse_proxy with the vhost metrics: add reverse_proxy to stack_components and metrics to
      reverse_proxy_vhosts (and certificate_check_subdomains), or leave monitoring out too
    quiet: true
