---
# Docker's apt repository, from facts (raspberry#237). Docker names the architectures like Debian does: the Pi's aarch64
# is arm64, CI's x86_64 is amd64.
docker_apt_distribution: "{{ ansible_facts['distribution'] | lower }}"
docker_apt_release: "{{ ansible_facts['distribution_release'] }}"
docker_apt_architecture: >-
  {{ {'aarch64': 'arm64', 'x86_64': 'amd64', 'armv7l': 'armhf'}[ansible_facts['architecture']]
     | default(ansible_facts['architecture']) }}

# DNS servers for the containers: the Pi-hole on the host itself.
docker_daemon_dns:
  - "{{ ansible_facts['default_ipv4']['address'] }}"

# Container logs: capped and rotated, so one container printing in a loop can't fill the disk (#70). The local driver
# compresses its rotated files; docker logs reads it as before. dockerd wants every log-opt as a string, the template
# quotes them. Only containers created after the change get it: recreate them after the daemon restart.
docker_daemon_log_driver: local
docker_daemon_log_opts:
  max-size: 10m
  max-file: "3"

# Restart the daemon when its config changes. Molecule turns this off: no Docker daemon runs in the test container.
docker_restart_daemon: true
