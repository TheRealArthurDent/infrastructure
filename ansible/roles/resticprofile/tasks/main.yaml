---
# resticprofile backs up the whole host to resticprofile_repository (default: the backup host dungeon, over sftp).
# Needs secrets/restic_passphrase from the secrets role.
# tasks/restore.yaml (imported by the stack role once the compose file is written) restores a fresh host.

- name: Resolve the backup host
  when: resticprofile_repository_is_sftp | bool and resticprofile_backup_host_ip is not defined
  block:
    # IPv4 only: the resticprofile container has no IPv6 network, and the Fritzbox answers with IPv6 first while
    # Pi-hole isn't up yet.
    - name: Look up the backup host on the Pi
      ansible.builtin.command: getent ahostsv4 {{ resticprofile_backup_host }}
      register: resticprofile_backup_host_getent
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Ensure the backup host resolves
      ansible.builtin.assert:
        that: resticprofile_backup_host_getent.rc == 0
        fail_msg: >-
          {{ resticprofile_backup_host }} does not resolve on {{ inventory_hostname }}; resticprofile needs its IP.
        quiet: true

    # The first address of a STREAM line
    - name: Remember the IP of the backup host
      ansible.builtin.set_fact:
        resticprofile_backup_host_ip: >-
          {{ (resticprofile_backup_host_getent.stdout_lines | select('search', 'STREAM') | first).split() | first }}

- name: Ensure the resticprofile config directory exists
  ansible.builtin.file:
    path: "{{ stack_dir }}/resticprofile/config"
    state: directory
    owner: root
    group: root
    mode: '0755'

# resticprofile reads these on every scheduled run; a change doesn't restart the container. setup.sh made every
# resticprofile file 0600; the container reads them as root.
- name: Ensure resticprofile config is present
  ansible.builtin.template:
    src: resticprofile/{{ item }}.j2
    dest: "{{ stack_dir }}/resticprofile/{{ item }}"
    owner: root
    group: root
    mode: '0600'
  loop: >-
    {{ ['config/profiles.yaml', 'config/excludes']
       + (['ssh_config'] if resticprofile_repository_is_sftp | bool else []) }}
  register: resticprofile_config_files

# A fresh host has no known_hosts, and the backup leaves out resticprofile/.ssh: without it, ssh in the container
# refuses the backup host and the clean-slate restore fails with "Host key verification failed". Ansible owns the file,
# so a changed key of the backup host is fixed in the inventory, never by accepting it blindly.
- name: Ensure the backup host's ssh host key is configured
  ansible.builtin.assert:
    that: resticprofile_backup_host_keys | length > 0
    fail_msg: >-
      resticprofile_backup_host_keys is empty: put {{ resticprofile_backup_host }}'s public ssh host key into
      inventory/group_vars/all/backup.yaml.
    quiet: true
  when: resticprofile_repository_is_sftp | bool

# ssh looks up a host on a port other than 22 as [host]:port
- name: Ensure the backup host is in resticprofile's known_hosts
  ansible.builtin.copy:
    content: |
      {% for key in resticprofile_backup_host_keys %}
      [{{ resticprofile_backup_host }}]:{{ dungeon_ssh_port }} {{ key | trim }}
      {% endfor %}
    dest: "{{ stack_dir }}/resticprofile/.ssh/known_hosts"
    owner: root
    group: root
    mode: '0644'
  register: resticprofile_known_hosts_file
  when: resticprofile_repository_is_sftp | bool
