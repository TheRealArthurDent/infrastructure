---
# The backup host. Resolved on the host at every run, so its IP isn't configured anywhere.
# Set resticprofile_backup_host_ip to skip the lookup.
resticprofile_backup_host: dungeon

# The restic repository. An sftp one needs the backup host (resolved above), the restic ssh key pair and ssh_config;
# a local one lives on a disk of this host that is bind-mounted into the container (dungeon: its backup SSD, where
# resticprofile_repository is local:/backup/restic/dungeon, see resticprofile_backup_mount).
resticprofile_repository: sftp:restic@{{ resticprofile_backup_host }}:/media/backup/restic/{{ inventory_hostname }}
# Derived. bootstrap.yaml and the secrets role use it to look up and write the ssh key pair only when it is needed.
resticprofile_repository_is_sftp: "{{ resticprofile_repository is match('sftp:') }}"
# The backup host's public ssh host keys ("ssh-ed25519 AAAA..."), written to the container's known_hosts for an sftp
# repository: ssh in the container accepts no other key ("Host key verification failed"). Set in
# inventory/group_vars/all/backup.yaml.
resticprofile_backup_host_keys: []
# The host path mounted at /backup in the container ('' mounts nothing). A bind mount is always a mount point inside
# the container, so the backup SSD's presence is checked by its marker file, which the backup_target component creates
# only while the SSD is mounted: the backup fails and the restore stops without it, instead of using the empty
# directory of the system disk.
resticprofile_backup_mount: ''
resticprofile_backup_marker: "{{ resticprofile_backup_mount }}/.backup-ssd"

# resticprofile schedules backups only once each of these stacks has its marker, so a fresh host never backs up a
# half-restored state as the latest snapshot. Add a stack here once its deployment runs restic-restore clean-slate.
resticprofile_backup_stacks:
  - "{{ stack_project_name }}"

# Clean-slate restore of stack_restore_items before the stack starts on a fresh host (raspberry#287):
# tasks/restore.yaml. resticprofile backs up the whole host, so the restore helper is a host service and every stack
# restores its own items with it. -e skip_infrastructure_restore=true (a new host with nothing to restore) only
# writes this stack's marker; -e infrastructure_restore_snapshot=<id> restores another snapshot than the latest.
resticprofile_restore_skip: "{{ skip_infrastructure_restore | default(false) }}"
resticprofile_restore_snapshot: "{{ infrastructure_restore_snapshot | default('latest') }}"
# <stack>.done markers, written once a stack's restore is done or skipped
resticprofile_restore_state_dir: /var/lib/restic-restore
# Host path -> path inside the resticprofile container, as mounted in templates/docker-compose.yaml.j2
resticprofile_restore_source_mounts:
  /home: /source/home
  /etc: /source/etc
  /var/lib/docker/volumes: /source/docker-volumes
# Where the helper stages a restore: on the host and inside the resticprofile container
resticprofile_restore_staging:
  host: /var/restore
  restic: /restore-target
# The local rsnapshot copy (base role's rsnapshot.conf) for restic-restore --from rsnapshot: <root>/<snapshot>/<host>
resticprofile_restore_rsnapshot:
  root: /var/cache/backup
  host: localhost
# Monthly restore drill (raspberry#288): restic check reads one of `parts` parts of the data (all of it over `parts`
# months), then every item of every stack is staged and removed again. The result goes to the resticprofile container's
# metrics dir, where its healthcheck reads it. Runs from root's crontab on the host, away from the 03:00 backup.
# false removes the cron job and the last result, e.g. on a host that is often switched off
resticprofile_restore_drill_enabled: true
resticprofile_restore_drill:
  metrics: /var/lib/resticprofile/metrics/restore_drill.prom
  parts: 12
  day: "1"
  hour: "12"
  minute: "0"
# How the helper runs restic: in the running container (exec) or, before the stack is up, in a one-off one
resticprofile_restore_runners:
  exec: [docker, exec, resticprofile, resticprofile]
  oneoff:
    - docker
    - compose
    - --file
    - "{{ stack_compose_dir }}/docker-compose.yaml"
    - --project-name
    - "{{ stack_project_name }}"
    - run
    - --rm
    - --no-deps
    - --no-TTY
    - --entrypoint
    - resticprofile
    - resticprofile
