---
# Hosts without the smart-home stack (dungeon) set this to false: no smart-home .env, and bootstrap.yaml doesn't look up
# its secrets.
secrets_smart_home_env: true

# Hosts running private-cloud's OpenCloud (dungeon, testbench) set this to true: /etc/docker/opencloud/.env, and
# bootstrap.yaml looks up its admin password (opencloud_admin_title below).
secrets_opencloud_env: false

# Hosts running private-cloud's Paperless-ngx (dungeon, testbench) set this to true: the Compose secret files in
# /etc/docker/paperless/secrets/, and bootstrap.yaml looks up its secrets (paperless_*_title below).
secrets_paperless: false
# Owners of those files: the users the containers run as in private-cloud's paperless/docker-compose.yaml (the
# Paperless image's user paperless, and postgres on Alpine). Change them together with the compose file.
secrets_paperless_uid: 1000
secrets_paperless_postgres_uid: 70

# The users the monitoring's containers read their files as: Telegraf's image user telegraf (metrics_writer_password)
# and the group of nginx' workers in the nginx image (metrics.htpasswd).
secrets_monitoring_agent_uid: 100
secrets_nginx_gid: 101

# KeePass entries of the host (bootstrap.yaml reads them from the host's own database, keepass_database), with the
# same titles on every host. A host sharing another host's database would set its own titles here, so a Discord
# message and a backup key show which host they belong to.
# Webhook: group Discord, fields id and token.
discord_docker_webhook_title: Docker Webhook  # noqa: var-naming[no-role-prefix]
# Webhook of Grafana's alerts on the host running the monitoring component (setup-grafana.yaml): group Discord, fields
# id and token.
discord_monitoring_webhook_title: Monitoring Webhook  # noqa: var-naming[no-role-prefix]
# Restic key pair for the sftp backup target: group Backup, attachments id_ed25519 and id_ed25519.pub.
resticprofile_ssh_key_title: Resticprofile SSH  # noqa: var-naming[no-role-prefix]
# Passphrase of the host's restic repository: group Backup, the entry's password.
resticprofile_passphrase_title: Resticprofile  # noqa: var-naming[no-role-prefix]
# The offsite target of the restic copy (#60): group Backup, the entry's user name, its URL (the bare host name) and the
# attachments id_ed25519 and id_ed25519.pub (the key pair the target accepts).
resticprofile_offsite_title: Offsite  # noqa: var-naming[no-role-prefix]
# Passphrase of the offsite restic repositories: group Backup, the entry's password.
resticprofile_offsite_passphrase_title: Resticprofile Offsite  # noqa: var-naming[no-role-prefix]
# Password of Grafana's user admin (monitoring component): group Monitoring, the entry's password.
monitoring_grafana_admin_title: Grafana admin  # noqa: var-naming[no-role-prefix]
# Initial password of OpenCloud's user admin: group OpenCloud, the entry's password.
opencloud_admin_title: admin  # noqa: var-naming[no-role-prefix]
# Paperless-ngx, group Paperless, each the entry's password: Django's secret key, the password of the database user
# paperless and the initial password of the user admin.
paperless_secret_key_title: secret key  # noqa: var-naming[no-role-prefix]
paperless_db_title: database  # noqa: var-naming[no-role-prefix]
paperless_admin_title: admin  # noqa: var-naming[no-role-prefix]
# Passwords of the monitoring's write path (#39), group Monitoring, each the entry's password, titled
# "<this> <host>": each agent host reads its own from its database ("Metrics writer raspi" in raspi's), the central
# host one for every host in monitoring_writers, the same passwords copied into its database.
monitoring_writer_title: Metrics writer  # noqa: var-naming[no-role-prefix]
