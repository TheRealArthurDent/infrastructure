---
# Hosts without the smart-home stack (dungeon) set this to false: no smart-home .env, and bootstrap.yaml doesn't look up
# its secrets.
secrets_smart_home_env: true

# Hosts running private-cloud's OpenCloud (dungeon, testbed) set this to true: /etc/docker/opencloud/.env, and
# bootstrap.yaml looks up its admin password (opencloud_admin_title below).
secrets_opencloud_env: false

# KeePass entries of the host (bootstrap.yaml reads them). Defaults are raspi's; a host sharing raspi's database
# (testbed) or having its own one (dungeon) gets its own entry here, so a Discord message and a backup key show which
# host they belong to.
# Webhook: group Discord, fields id and token.
discord_docker_webhook_title: Docker Webhook  # noqa: var-naming[no-role-prefix]
# Restic key pair for the sftp backup target: group Backup, attachments id_ed25519 and id_ed25519.pub.
resticprofile_ssh_key_title: Resticprofile SSH  # noqa: var-naming[no-role-prefix]
# Passphrase of the host's restic repository: group Backup, the entry's password.
resticprofile_passphrase_title: Resticprofile  # noqa: var-naming[no-role-prefix]
# Initial password of OpenCloud's user admin: group OpenCloud, the entry's password.
opencloud_admin_title: admin  # noqa: var-naming[no-role-prefix]
