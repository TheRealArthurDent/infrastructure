- name: Create secret files
  block:
    - name: Create Infrastructure .env
      block:
        - name: Ensure docker infrastructure directory
          ansible.builtin.file:
            path: /etc/docker/infrastructure
            state: directory
            mode: '0755'

        - name: Create .env file with secrets
          ansible.builtin.copy:
            content: |
              # pihole
              FTLCONF_webserver_api_password={{ pihole_password }}

              # ftlv5
              WEBPASSWORD={{ pihole_password }}
              VIRTUAL_HOST=pihole
            dest: /etc/docker/infrastructure/.env
            mode: '0600'
          when: "'pihole' in stack_components"
          no_log: true

        - name: Create .outbound.env file with secrets
          ansible.builtin.copy:
            content: |
              # pihole
              FTLCONF_webserver_api_password={{ outbound_password }}

              # ftlv5
              WEBPASSWORD={{ outbound_password }}
              VIRTUAL_HOST=outbound
            dest: /etc/docker/infrastructure/.outbound.env
            mode: '0600'
          when: "'outbound' in stack_components"
          no_log: true

        - name: Create .healthmonitor.env file with secrets
          ansible.builtin.copy:
            content: |
              # https://containrrr.dev/shoutrrr/v0.8/services/overview/
              CONTAINERMON_NOTIFICATION_URL={{ containermonitor_notification_url }}
            dest: /etc/docker/infrastructure/.healthmonitor.env
            mode: '0600'
          when: "'healthmonitor' in stack_components"
          no_log: true

        - name: Ensure docker infrastructure secrets directory
          ansible.builtin.file:
            path: /etc/docker/infrastructure/secrets
            state: directory
            mode: '0755'
          when: "'resticprofile' in stack_components"

        - name: Create restic_passphrase
          ansible.builtin.copy:
            content: |
              {{ restic_passphrase }}
            dest: /etc/docker/infrastructure/secrets/restic_passphrase
            mode: '0600'
          when: "'resticprofile' in stack_components"
          no_log: true

        - name: Ensure docker infrastructure resticprofile directory
          ansible.builtin.file:
            path: /etc/docker/infrastructure/resticprofile
            state: directory
            mode: '0755'
          when: "'resticprofile' in stack_components"

        - name: Ensure docker infrastructure resticprofile ssh directory
          ansible.builtin.file:
            path: /etc/docker/infrastructure/resticprofile/.ssh
            state: directory
            mode: '0700'
          when: "'resticprofile' in stack_components and resticprofile_repository_is_sftp"

        # The key pair of this host's KeePass entry (bootstrap.yaml). The backup host authorises the public key
        # (backup_target_clients), so a rebuilt host keeps the key and the backup host never changes. Each file
        # ends with exactly one newline, whatever the attachment ends with.
        - name: Write the restic SSH private key
          ansible.builtin.copy:
            content: "{{ resticprofile_ssh_private_key | trim }}\n"
            dest: /etc/docker/infrastructure/resticprofile/.ssh/id_ed25519
            owner: root
            group: root
            mode: '0600'
          when: "'resticprofile' in stack_components and resticprofile_repository_is_sftp"
          no_log: true

        - name: Write the restic SSH public key
          ansible.builtin.copy:
            content: "{{ resticprofile_ssh_public_key | trim }}\n"
            dest: /etc/docker/infrastructure/resticprofile/.ssh/id_ed25519.pub
            owner: root
            group: root
            mode: '0644'
          when: "'resticprofile' in stack_components and resticprofile_repository_is_sftp"
          no_log: true

        # Hosts set up before the key pair came from KeePass still have the script (ssh-copy-id needed a password login)
        - name: Remove the old restic init script
          ansible.builtin.file:
            path: /etc/docker/infrastructure/init-restic.sh
            state: absent

    - name: Create Smarthome .env
      when: secrets_smart_home_env | bool
      block:
        - name: Ensure docker smart-home directory
          ansible.builtin.file:
            path: /etc/docker/smart-home
            state: directory
            mode: '0755'

        - name: Create .env file with secrets
          ansible.builtin.copy:
            content: |
              IOBROKER_STATES_REDIS_PORT={{ iobroker_states_redis_port }}
              IOBROKER_OBJECTS_REDIS_PORT={{ iobroker_objects_redis_port }}

              INFLUXDB_ADMIN_PASSWORD={{ influxdb_admin_password }}
              INFLUXDB_READ_PASSWORD={{ influxdb_read_password }}
              INFLUXDB_WRITE_PASSWORD={{ influxdb_write_password }}

              GRAFANA_PASSWORD={{ grafana_password }}

              MOSQUITTO_PASSWD={{ mosquitto_password }}

              DECONZ_VNC_PASSWORD={{ deconz_vnc_password }}
              DECONZ_DEVICE_TYPE=ttyACM0

              GITHUB_USER={{ nodered_github_user }}
              GITHUB_EMAIL={{ nodered_github_email }}
            dest: /etc/docker/smart-home/.env
            mode: '0600'
          no_log: true
