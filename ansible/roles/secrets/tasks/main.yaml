# KeePass may hold any character. The .env files below quote every value (dotenv_quote), so Compose passes it on
# unchanged; these checks stop values a consumer still can't take, before any file is written. Their messages name
# the entry, never the value.
- name: Ensure the secret values have no control characters
  ansible.builtin.assert:
    that: >-
      [pihole_password, outbound_password, containermonitor_notification_url, restic_passphrase,
       iobroker_states_redis_port, iobroker_objects_redis_port, influxdb_admin_password, influxdb_read_password,
       influxdb_write_password, grafana_password, mosquitto_password, deconz_vnc_password, nodered_github_user,
       nodered_github_email, opencloud_admin_password]
      | map('default', '') | map('string') | select('search', '[\\x00-\\x1f\\x7f]') | length == 0
    fail_msg: >-
      A KeePass secret contains a line break or another control character, which no .env file can hold. Check the
      entries this host reads (bootstrap.yaml, "Read secrets from KeePass").
    quiet: true

# The influxdb image's init script creates the users with InfluxQL like WITH PASSWORD '<password>', unescaped.
- name: Ensure the InfluxDB secret passwords have no quote or backslash
  ansible.builtin.assert:
    that: >-
      [influxdb_admin_password, influxdb_read_password, influxdb_write_password]
      | map('default', '') | map('string') | select('search', "['\\\\]") | length == 0
    fail_msg: >-
      An InfluxDB password in KeePass (group smart-home/Influx DB) contains ' or \, which the influxdb image's init
      script can't handle: the user isn't created. Choose a password without them.
    quiet: true
  when: secrets_smart_home_env | bool

# deCONZ' start script writes the VNC password with dash's echo, which turns \t, \n and the like into control
# characters.
- name: Ensure the deCONZ VNC secret password has no backslash
  ansible.builtin.assert:
    that: "'\\\\' not in (deconz_vnc_password | default('') | string)"
    fail_msg: >-
      The deCONZ VNC password in KeePass (smart-home/deconz - Phoscon-GW, Deconz VNC) contains \, which deCONZ'
      start script changes. Choose a password without it.
    quiet: true
  when: secrets_smart_home_env | bool

- name: Create secret files
  block:
    - name: Create Infrastructure .env
      block:
        - name: Ensure docker infrastructure directory
          ansible.builtin.file:
            path: /etc/docker/infrastructure
            state: directory
            mode: '0755'

        - name: Create .env file with secrets
          ansible.builtin.copy:
            content: |
              # pihole
              FTLCONF_webserver_api_password={{ pihole_password | dotenv_quote }}

              # ftlv5
              WEBPASSWORD={{ pihole_password | dotenv_quote }}
              VIRTUAL_HOST=pihole
            dest: /etc/docker/infrastructure/.env
            mode: '0600'
          when: "'pihole' in stack_components"
          no_log: true

        - name: Create .outbound.env file with secrets
          ansible.builtin.copy:
            content: |
              # pihole
              FTLCONF_webserver_api_password={{ outbound_password | dotenv_quote }}

              # ftlv5
              WEBPASSWORD={{ outbound_password | dotenv_quote }}
              VIRTUAL_HOST=outbound
            dest: /etc/docker/infrastructure/.outbound.env
            mode: '0600'
          when: "'outbound' in stack_components"
          no_log: true

        - name: Create .healthmonitor.env file with secrets
          ansible.builtin.copy:
            content: |
              # https://containrrr.dev/shoutrrr/v0.8/services/overview/
              CONTAINERMON_NOTIFICATION_URL={{ containermonitor_notification_url | dotenv_quote }}
            dest: /etc/docker/infrastructure/.healthmonitor.env
            mode: '0600'
          when: "'healthmonitor' in stack_components"
          no_log: true

        - name: Ensure docker infrastructure secrets directory
          ansible.builtin.file:
            path: /etc/docker/infrastructure/secrets
            state: directory
            mode: '0755'
          when: "'resticprofile' in stack_components"

        - name: Create restic_passphrase
          ansible.builtin.copy:
            content: |
              {{ restic_passphrase }}
            dest: /etc/docker/infrastructure/secrets/restic_passphrase
            mode: '0600'
          when: "'resticprofile' in stack_components"
          no_log: true

        - name: Ensure docker infrastructure resticprofile directory
          ansible.builtin.file:
            path: /etc/docker/infrastructure/resticprofile
            state: directory
            mode: '0755'
          when: "'resticprofile' in stack_components"

        - name: Ensure docker infrastructure resticprofile ssh directory
          ansible.builtin.file:
            path: /etc/docker/infrastructure/resticprofile/.ssh
            state: directory
            mode: '0700'
          when: "'resticprofile' in stack_components and resticprofile_repository_is_sftp"

        # raspi's working key is replaced below: stop when the KeePass key isn't the one the backup host accepts (a
        # wrong attachment, such as testbench's pair, would break the backups unnoticed until healthmonitor alerts).
        # Public keys only (type and key, not the comment), so nothing secret is compared or printed. Skipped where the
        # backup host's inventory doesn't list this host (Molecule).
        - name: Ensure the restic SSH key in KeePass is the one the backup host accepts
          ansible.builtin.assert:
            that:
              - >-
                (resticprofile_ssh_public_key | trim).split()[:2]
                == hostvars[resticprofile_backup_host].backup_target_clients[inventory_hostname].split()[:2]
            fail_msg: >-
              The restic key in KeePass ({{ resticprofile_ssh_key_title }}) isn't the one
              {{ resticprofile_backup_host }} accepts (backup_target_clients.{{ inventory_hostname }} in
              host_vars/{{ resticprofile_backup_host }}.yaml). Replace the attachments id_ed25519 and id_ed25519.pub
              of that KeePass entry with this host's existing key
              pair (/etc/docker/infrastructure/resticprofile/.ssh/), or put the entry's public key into
              backup_target_clients and run bootstrap.yaml --limit {{ resticprofile_backup_host }} first.
            quiet: true
          when:
            - "'resticprofile' in stack_components and resticprofile_repository_is_sftp"
            - resticprofile_backup_host in hostvars
            - inventory_hostname in hostvars[resticprofile_backup_host].backup_target_clients | default({})

        # The key pair of this host's KeePass entry (bootstrap.yaml). The backup host authorises the public key
        # (backup_target_clients), so a rebuilt host keeps the key and the backup host never changes. Each file
        # ends with exactly one newline, whatever the attachment ends with.
        - name: Write the restic SSH private key
          ansible.builtin.copy:
            content: "{{ resticprofile_ssh_private_key | trim }}\n"
            dest: /etc/docker/infrastructure/resticprofile/.ssh/id_ed25519
            owner: root
            group: root
            mode: '0600'
          when: "'resticprofile' in stack_components and resticprofile_repository_is_sftp"
          no_log: true

        - name: Write the restic SSH public key
          ansible.builtin.copy:
            content: "{{ resticprofile_ssh_public_key | trim }}\n"
            dest: /etc/docker/infrastructure/resticprofile/.ssh/id_ed25519.pub
            owner: root
            group: root
            mode: '0644'
          when: "'resticprofile' in stack_components and resticprofile_repository_is_sftp"
          no_log: true

        # Hosts set up before the key pair came from KeePass still have the script (ssh-copy-id needed a password login)
        - name: Remove the old restic init script
          ansible.builtin.file:
            path: /etc/docker/infrastructure/init-restic.sh
            state: absent

    - name: Create Smarthome .env
      when: secrets_smart_home_env | bool
      block:
        - name: Ensure docker smart-home directory
          ansible.builtin.file:
            path: /etc/docker/smart-home
            state: directory
            mode: '0755'

        - name: Create .env file with secrets
          ansible.builtin.copy:
            content: |
              IOBROKER_STATES_REDIS_PORT={{ iobroker_states_redis_port | dotenv_quote }}
              IOBROKER_OBJECTS_REDIS_PORT={{ iobroker_objects_redis_port | dotenv_quote }}

              INFLUXDB_ADMIN_PASSWORD={{ influxdb_admin_password | dotenv_quote }}
              INFLUXDB_READ_PASSWORD={{ influxdb_read_password | dotenv_quote }}
              INFLUXDB_WRITE_PASSWORD={{ influxdb_write_password | dotenv_quote }}

              GRAFANA_PASSWORD={{ grafana_password | dotenv_quote }}

              MOSQUITTO_PASSWD={{ mosquitto_password | dotenv_quote }}

              DECONZ_VNC_PASSWORD={{ deconz_vnc_password | dotenv_quote }}
              DECONZ_DEVICE_TYPE=ttyACM0

              GITHUB_USER={{ nodered_github_user | dotenv_quote }}
              GITHUB_EMAIL={{ nodered_github_email | dotenv_quote }}
            dest: /etc/docker/smart-home/.env
            mode: '0600'
          no_log: true

    # Read by private-cloud's opencloud role; keys in its opencloud/.env.example
    - name: Create OpenCloud .env
      when: secrets_opencloud_env | bool
      block:
        - name: Ensure docker opencloud directory
          ansible.builtin.file:
            path: /etc/docker/opencloud
            state: directory
            owner: root
            group: root
            mode: '0755'

        - name: Create OpenCloud .env file with secrets
          ansible.builtin.copy:
            content: |
              OPENCLOUD_ADMIN_PASSWORD={{ opencloud_admin_password | dotenv_quote }}
            dest: /etc/docker/opencloud/.env
            owner: root
            group: root
            mode: '0600'
          no_log: true
