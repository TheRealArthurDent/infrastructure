# Before anything changes on the host: one without swap thrashes under memory pressure (#50). The facts come from
# the ssh role's deferred setup.
- name: Ensure the host has enough swap
  ansible.builtin.assert:
    that: ansible_facts['swaptotal_mb'] | int >= base_swap_min_mb | int
    fail_msg: >-
      {{ inventory_hostname }} has {{ ansible_facts['swaptotal_mb'] }} MB of swap, base_swap_min_mb asks for
      {{ base_swap_min_mb }} MB. On Raspberry Pi OS trixie, install rpi-swap (a fresh install has it; an in-place
      upgrade from bookworm may leave dphys-swapfile disabled and no swap at all), or run
      `systemctl enable --now dphys-swapfile`; check with `swapon --show`.
    quiet: true
  when: base_swap_min_mb | int > 0

# Before anything downloads: on a freshly installed Pi, the network's DNS server (Pi-hole on this very host) doesn't
# exist yet, and apt couldn't resolve deb.debian.org.
- name: Ensure the host falls back to another DNS server while Pi-hole is down
  ansible.builtin.template:
    src: etc/NetworkManager/conf.d/90-dns-fallback.conf.j2
    dest: /etc/NetworkManager/conf.d/90-dns-fallback.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload NetworkManager

- name: Flush handlers so apt resolves through the new DNS config
  ansible.builtin.meta: flush_handlers

- name: Ensure the kernel command line enables the memory cgroup
  ansible.builtin.import_tasks: kernel_cmdline.yaml

# 4096-bit Diffie-Hellman parameters take about an hour on a Pi, minutes on the control node. So the host only checks
# whether its file is missing or has the wrong size, and the control node generates new ones and copies them over.
# Generating them on the Pi failed twice: a silent ssh connection was dropped and Ansible waited forever, and the
# async run that replaced it failed at its very end because the module's payload below /tmp on the Pi was gone.
# In check mode, the check reports the change. On a host that needs new parameters, the check and the copy report
# changed in a real run.
- name: "Check Diffie-Hellman parameters with bit size {{ dhparameter_bits }}"
  community.crypto.openssl_dhparam:
    path: /etc/ssl/certs/dhparam.pem
    owner: root
    group: root
    mode: '0644'
    size: "{{ dhparameter_bits }}"
  check_mode: true
  register: base_dhparam_check

- name: "Generate Diffie-Hellman parameters on the control node with bit size {{ dhparameter_bits }}"
  when:
    - base_dhparam_check.changed
    - not ansible_check_mode
  block:
    - name: Create a temporary file for the Diffie-Hellman parameters on the control node
      ansible.builtin.tempfile:
        state: file
        suffix: .dhparam.pem
      register: base_dhparam_tmp
      delegate_to: localhost
      become: false

    - name: Generate the Diffie-Hellman parameters on the control node
      community.crypto.openssl_dhparam:
        path: "{{ base_dhparam_tmp.path }}"
        size: "{{ dhparameter_bits }}"
        force: true
      delegate_to: localhost
      become: false

    - name: Ensure the Diffie-Hellman parameters are on the host
      ansible.builtin.copy:
        src: "{{ base_dhparam_tmp.path }}"
        dest: /etc/ssl/certs/dhparam.pem
        owner: root
        group: root
        mode: '0644'

  always:
    - name: Remove the temporary Diffie-Hellman parameters on the control node
      ansible.builtin.file:
        path: "{{ base_dhparam_tmp.path }}"
        state: absent
      delegate_to: localhost
      become: false
      when: base_dhparam_tmp.path is defined

# Package upgrades are update.yaml's job: here they'd change something on every run once Debian has published
# updates (raspberry#237). The cache is only refreshed when it's older than a day. Every host refreshes it, because
# the roles after this one install packages (docker, stack, restore) and dungeon has no rsnapshot to do it.
- name: Ensure the apt cache is fresh
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 86400

- name: Install rsnapshot
  ansible.builtin.apt:
    name:
      - rsnapshot
    state: present
  when: base_rsnapshot_enabled | bool

# A recorder that doesn't depend on the monitoring stack: when the host dies under load, the monitoring dies with
# it, and atop's local log still shows which process caused it.
- name: Ensure atop records the load of the host
  when: base_atop_enabled | bool
  block:
    - name: Ensure atop is installed
      ansible.builtin.apt:
        name: atop
        state: present
      register: base_atop_package

    # atop.service reads both from /etc/default/atop (EnvironmentFile).
    - name: Ensure atop's sampling interval and log retention are set
      ansible.builtin.lineinfile:
        path: /etc/default/atop
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
        owner: root
        group: root
        mode: '0644'
        create: true
      loop:
        - { key: LOGINTERVAL, value: "{{ base_atop_interval }}" }
        - { key: LOGGENERATIONS, value: "{{ base_atop_generations }}" }
      loop_control:
        label: "{{ item.key }}"
      notify: Restart atop

    - name: Ensure atop is running and starts at boot
      ansible.builtin.systemd_service:
        name: atop
        state: started
        enabled: true
      # A dry run on a host without atop can't start a service that isn't installed yet.
      when: base_atop_manage_service | bool and not (ansible_check_mode and base_atop_package is changed)

- name: Provision config files
  block:
    # Writes the setting and applies it right away, not only after the next reboot (raspberry#237).
    - name: Ensure redis may overcommit memory
      ansible.posix.sysctl:
        name: vm.overcommit_memory
        value: '1'
        sysctl_file: /etc/sysctl.d/90-overcommit-memory.conf
        reload: "{{ base_sysctl_reload }}"

    # A broken sudoers file locks out sudo, so it's checked before it's
    # put in place (raspberry#231).
    - name: Ensure sudoers entry for deploy user
      ansible.builtin.template:
        src: etc/sudoers.d/user.j2
        dest: /etc/sudoers.d/{{ ansible_user }}
        owner: root
        group: root
        mode: '0440'
        validate: 'visudo -cf %s'

    - name: Copy rsnapshot config
      ansible.builtin.copy:
        src: etc/rsnapshot.conf
        dest: /etc/rsnapshot.conf
        owner: root
        group: root
        mode: '0644'
      when: base_rsnapshot_enabled | bool

    # weekly runs before daily so the two never overlap on Sundays (rsnapshot shares one lockfile, raspberry#232)
    - name: Ensure cron job "rsnapshot daily" exists
      ansible.builtin.cron:
        name: "rsnapshot daily"
        minute: "0"
        hour: "2"
        job: "rsnapshot daily"
      when: base_rsnapshot_enabled | bool
    - name: Ensure cron job "rsnapshot weekly" exists
      ansible.builtin.cron:
        name: "rsnapshot weekly"
        minute: "30"
        hour: "1"
        weekday: "0"
        job: "rsnapshot weekly"
      when: base_rsnapshot_enabled | bool
