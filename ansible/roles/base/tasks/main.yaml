# Before anything downloads: on a freshly installed Pi, the network's DNS server (Pi-hole on this very host) doesn't
# exist yet, and apt couldn't resolve deb.debian.org.
- name: Ensure the host falls back to another DNS server while Pi-hole is down
  ansible.builtin.template:
    src: etc/NetworkManager/conf.d/90-dns-fallback.conf.j2
    dest: /etc/NetworkManager/conf.d/90-dns-fallback.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload NetworkManager

- name: Flush handlers so apt resolves through the new DNS config
  ansible.builtin.meta: flush_handlers

- name: Ensure the kernel command line enables the memory cgroup
  ansible.builtin.import_tasks: kernel_cmdline.yaml

# 4096 bits take about an hour on a Pi. Run in the background and poll, so the ssh connection isn't silent for an
# hour: a dropped connection made Ansible wait forever although the task had finished on the host.
- name: "Generate Diffie-Hellman parameters with bit size {{ dhparameter_bits }}"
  community.crypto.openssl_dhparam:
    path: /etc/ssl/certs/dhparam.pem
    owner: root
    group: root
    mode: '0644'
    size: "{{ dhparameter_bits }}"
  async: 7200
  poll: 30

# Package upgrades are update.yaml's job: here they'd change something on every run once Debian has published
# updates (raspberry#237). The cache is only refreshed when it's older than a day. Every host refreshes it, because
# the roles after this one install packages (docker, stack, restore) and dungeon has no rsnapshot to do it.
- name: Ensure the apt cache is fresh
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 86400

- name: Install rsnapshot
  ansible.builtin.apt:
    name:
      - rsnapshot
    state: present
  when: base_rsnapshot_enabled | bool

- name: Provision config files
  block:
    # Writes the setting and applies it right away, not only after the next reboot (raspberry#237).
    - name: Ensure redis may overcommit memory
      ansible.posix.sysctl:
        name: vm.overcommit_memory
        value: '1'
        sysctl_file: /etc/sysctl.d/90-overcommit-memory.conf
        reload: "{{ base_sysctl_reload }}"

    # A broken sudoers file locks out sudo, so it's checked before it's
    # put in place (raspberry#231).
    - name: Ensure sudoers entry for deploy user
      ansible.builtin.template:
        src: etc/sudoers.d/user.j2
        dest: /etc/sudoers.d/{{ ansible_user }}
        owner: root
        group: root
        mode: '0440'
        validate: 'visudo -cf %s'

    - name: Copy rsnapshot config
      ansible.builtin.copy:
        src: etc/rsnapshot.conf
        dest: /etc/rsnapshot.conf
        owner: root
        group: root
        mode: '0644'
      when: base_rsnapshot_enabled | bool

    # weekly runs before daily so the two never overlap on Sundays (rsnapshot shares one lockfile, raspberry#232)
    - name: Ensure cron job "rsnapshot daily" exists
      ansible.builtin.cron:
        name: "rsnapshot daily"
        minute: "0"
        hour: "2"
        job: "rsnapshot daily"
      when: base_rsnapshot_enabled | bool
    - name: Ensure cron job "rsnapshot weekly" exists
      ansible.builtin.cron:
        name: "rsnapshot weekly"
        minute: "30"
        hour: "1"
        weekday: "0"
        job: "rsnapshot weekly"
      when: base_rsnapshot_enabled | bool
