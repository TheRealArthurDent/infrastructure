---
# SIGHUP: NetworkManager rereads its config and rewrites /etc/resolv.conf, without touching the connections.
- name: Reload NetworkManager
  ansible.builtin.systemd_service:
    name: NetworkManager
    state: reloaded
  when: base_networkmanager_reload

# The role doesn't reboot: a reboot of raspi stops the smart home (raspberry#313).
- name: Report that the kernel command line takes effect after a reboot
  ansible.builtin.debug:
    msg: >-
      {{ base_kernel_cmdline_file }} changed. Reboot {{ inventory_hostname }} when it suits you, so the kernel
      enables the memory cgroup and Docker applies the containers' memory limits.
