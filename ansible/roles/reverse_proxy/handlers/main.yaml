---
- name: Read nginx container state
  community.docker.docker_container_info:
    name: "{{ reverse_proxy_container }}"
  register: reverse_proxy_nginx_info
  listen: Reload reverse proxy nginx
  when: stack_manage_containers | bool

# nginx -s reload keeps the old config if the new one is broken, but only logs that. nginx -t fails the run.
- name: Test nginx configuration
  community.docker.docker_container_exec:
    container: "{{ reverse_proxy_container }}"
    command: nginx -t
  changed_when: false
  listen: Reload reverse proxy nginx
  when:
    - stack_manage_containers | bool
    - reverse_proxy_nginx_info.exists
    - reverse_proxy_nginx_info.container.State.Running

- name: Reload nginx configuration
  community.docker.docker_container_exec:
    container: "{{ reverse_proxy_container }}"
    command: nginx -s reload
  listen: Reload reverse proxy nginx
  when:
    - stack_manage_containers | bool
    - reverse_proxy_nginx_info.exists
    - reverse_proxy_nginx_info.container.State.Running
