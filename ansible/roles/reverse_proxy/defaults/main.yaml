---
# The nginx container the reload handler talks to
reverse_proxy_container: nginx

# The vhosts of the host (one server block each, "deconz" covers both of its blocks). The host's own vhosts and the
# health endpoint always render; pihole and outbound also need their component in stack_components. opencloud
# and paperless (private-cloud) aren't in the default: only hosts running them list them.
reverse_proxy_vhosts:
  - iobroker
  - ui
  - node-red
  - deconz
  - deconz-ui
  - grafana
  - portainer
  - nextcloud
  - pihole
  - outbound

# The vhosts containers in siz reach nginx by (network aliases): private-cloud's OpenCloud, and the write path of the
# monitoring (metrics, #39) on the host running its central part.
reverse_proxy_siz_aliases: >-
  {%- set names = ['opencloud'] | intersect(reverse_proxy_vhosts) -%}
  {%- if 'monitoring' in stack_components -%}
  {%-   set names = names + ['metrics'] | intersect(reverse_proxy_vhosts) -%}
  {%- endif -%}
  {{ names | product([inventory_hostname]) | map('join', '.') | list }}
