[defaults]
inventory = inventory/hosts.yaml
retry_files_enabled = False
interpreter_python = auto_silent
# The stack role imports its component roles (#14). Playbooks find them next to themselves; ansible-lint's syntax
# check of a role on its own only through this path (run from the repo root, ../ansible.cfg does the same).
roles_path = roles

[ssh_connection]
# Accept the host key of a host we've never seen (first bootstrap, or the port switch in the ssh role,
# since known_hosts stores [host]:port), but refuse a changed key (raspberry#231).
# The first three options are Ansible's defaults, which ssh_args replaces.
# ServerAlive*: notice a dead connection after 2 minutes instead of waiting forever on a silent one, e.g. when a NAT
# on the way (WSL2, the router) drops it during a long-running task. Keep it on one line: Ansible ignores continuation
# lines.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=4
