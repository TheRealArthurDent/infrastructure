---
# Test Pi. Smaller DH parameters, so a fresh testbed doesn't spend an hour generating them.
dhparameter_bits: 2048
# Often switched off on the 1st: a missed monthly restore drill would turn resticprofile unhealthy (raspberry#288)
resticprofile_restore_drill_enabled: false
# Its own entries in raspi's database, so a Discord message and a backup key show which host they belong to, and its
# throwaway repository has a passphrase of its own
discord_docker_webhook_title: Docker Webhook testbed
resticprofile_ssh_key_title: Resticprofile SSH testbed
resticprofile_passphrase_title: Resticprofile testbed
