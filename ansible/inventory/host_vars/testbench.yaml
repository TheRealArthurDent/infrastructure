---
# Test Pi. Smaller DH parameters, so a fresh testbench doesn't spend an hour generating them.
dhparameter_bits: 2048
# Often switched off on the 1st: a missed monthly restore drill would turn resticprofile unhealthy (raspberry#288)
resticprofile_restore_drill_enabled: false
# Its own KeePass database (testbench) with raspi's entry names, so a Discord message and a backup key show which host
# they belong to, and its throwaway repository has a passphrase of its own. The root CA still comes from raspberry.
keepass_database: testbench

# private-cloud's OpenCloud and Paperless, for their integration runs: their .env files, and the default vhosts and
# SANs plus opencloud and paperless (not in the roles' defaults, raspi doesn't run them)
secrets_opencloud_env: true
secrets_paperless: true
reverse_proxy_vhosts: [iobroker, ui, node-red, deconz, deconz-ui, grafana, portainer, nextcloud,
                       pihole, outbound, opencloud, paperless]
certificate_check_subdomains: [pihole, portainer, nextcloud, iobroker, node-red, grafana, outbound, deconz,
                               deconz-ui, ui, opencloud, paperless]

# The stack's default components plus the monitoring agent (#39), which writes to the central host
# (monitoring_agent_central_host). raspi gets it too once it is set up again (roles/stack/defaults/main.yaml).
stack_components:
  - reverse_proxy
  - portainer
  - unbound
  - pihole
  - outbound
  - resticprofile
  - docker_socket_proxy
  - healthmonitor
  - landing_page
  - monitoring_agent
