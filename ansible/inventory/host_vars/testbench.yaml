---
# Test Pi. Smaller DH parameters, so a fresh testbench doesn't spend an hour generating them.
dhparameter_bits: 2048
# Often switched off on the 1st: a missed monthly restore drill would turn resticprofile unhealthy (raspberry#288)
resticprofile_restore_drill_enabled: false
# Its own KeePass database (testbench) with raspi's entry names, so a Discord message and a backup key show which host
# they belong to, and its throwaway repository has a passphrase of its own. The root CA still comes from raspberry.
keepass_database: testbench

# private-cloud's OpenCloud, for its integration runs: its .env, and the default vhosts and SANs plus opencloud
# (opencloud isn't in the roles' defaults, raspi doesn't run it)
secrets_opencloud_env: true
reverse_proxy_vhosts: [iobroker, ui, node-red, deconz, deconz-ui, roomba, grafana, chronograf, portainer, nextcloud,
                       pihole, outbound, opencloud]
certificate_check_subdomains: [pihole, portainer, nextcloud, iobroker, node-red, grafana, chronograf, outbound, deconz,
                               deconz-ui, ui, opencloud]
