---
# resticprofile schedules backups only once each of these stacks has its marker (resticprofile role defaults).
# smart-home runs restic-restore clean-slate before it starts (TheRealArthurDent/smart-home#1), and both hosts run it.
# The restore items of this repo's stack come from its components' defaults (stack_restore_items, #14).
resticprofile_backup_stacks:
  - "{{ stack_project_name }}"
  - smart-home

# The ssh host key of the backup host (dungeon), for known_hosts of the sftp clients' resticprofile container. Public,
# nothing secret. After reinstalling dungeon, replace it with the output of
# ssh-keyscan -p <ssh port> -t ed25519 192.168.1.5 (compare its fingerprint with ssh-keygen -lf
# /etc/ssh/ssh_host_ed25519_key.pub on dungeon first).
resticprofile_backup_host_keys:
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMwoOx91BPOyMYT0DW2eReS6Zcipw19ZBqFNM/rPLTSe
