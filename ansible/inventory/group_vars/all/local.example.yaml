---
# Copy to local.yaml in this directory and adjust. local.yaml is ignored by git (raspberry#267).
#
# Path to the KeePass database. Use a path under /mnt/c, not a Google Drive drive letter such as /mnt/h,
# whose WSL mount breaks regularly (see README.md, section KeePass).
local_keepass_db: /mnt/c/Users/<you>/My Drive/KeePass/Raspberry.kdbx
# Key file of the database; leave empty if it has none.
local_keepass_key: ~/.keepass/raspberry.key
