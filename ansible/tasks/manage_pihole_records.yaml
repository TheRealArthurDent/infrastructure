---
# Modular task to manage Pi-hole DNS records (hosts, cnames, upstreams, etc.)
# Parameters:
#   - record_type: "hosts", "cnameRecords", "upstreams"
#   - api_endpoint: API endpoint path (e.g., /api/config/dns/hosts)
#   - desired_records: Array of objects or strings
#   - record_format: "objects" for {domain, address/target}, "simple" for plain strings
#   - value_attribute: Attribute name for value ("address" for hosts, "target" for cnames)
#   - domain_first: true for "domain,target", false for "address,domain" (default: true)
#   - separator: Separator for joining records (" " for hosts, "," for cnames, "" for upstreams)

- name: Get existing records from API for {{ record_type }}
  ansible.builtin.uri:
    url: "https://{{ pihole_host }}:{{ pihole_port }}{{ api_endpoint }}"
    method: GET
    headers:
      X-FTL-SID: "{{ pihole_session }}"
    status_code: 200
    ca_path: "{{ pihole_ca_file.path }}"
  register: api_response
  until: api_response.status not in pihole_api_unavailable
  retries: "{{ pihole_api_retries }}"
  delay: "{{ pihole_api_delay }}"

- name: Extract existing records for {{ record_type }}
  ansible.builtin.set_fact:
    existing_records_extracted: "{{ api_response.json.config.dns[record_type] | default([]) }}"

- name: Show existing records for {{ record_type }}
  ansible.builtin.debug:
    msg: "Existing {{ record_type }}: {{ existing_records_extracted }}"

- name: Format desired records with domain first for {{ record_type }}
  ansible.builtin.set_fact:
    desired_records_formatted: >-
      {{ desired_records | map(attribute='domain')
         | zip(desired_records | map(attribute=value_attribute))
         | map('join', separator) | list }}
  when: record_format == "objects" and separator != "" and domain_first | default(true)

- name: Format desired records with value first for {{ record_type }}
  ansible.builtin.set_fact:
    desired_records_formatted: >-
      {{ desired_records | map(attribute=value_attribute)
         | zip(desired_records | map(attribute='domain'))
         | map('join', separator) | list }}
  when: record_format == "objects" and separator != "" and not (domain_first | default(true))

- name: Format desired records as simple list for {{ record_type }}
  ansible.builtin.set_fact:
    desired_records_formatted: "{{ desired_records }}"
  when: record_format == "simple"

- name: Identify records to delete for {{ record_type }}
  ansible.builtin.set_fact:
    records_to_delete: >-
      {{ existing_records_extracted
         | difference(desired_records_formatted | default(desired_records)) }}

- name: Identify records to add for {{ record_type }}
  ansible.builtin.set_fact:
    records_to_add: >-
      {{ (desired_records_formatted | default(desired_records))
         | difference(existing_records_extracted) }}

- name: Show records to delete for {{ record_type }}
  ansible.builtin.debug:
    msg: "{{ record_type | capitalize }} to delete: {{ records_to_delete }}"
  when: records_to_delete | length > 0

- name: Show records to add for {{ record_type }}
  ansible.builtin.debug:
    msg: "{{ record_type | capitalize }} to add: {{ records_to_add }}"
  when: records_to_add | length > 0

# The record is a path segment, so everything in it is encoded, including '/' (#234).
- name: Delete old records for {{ record_type }}
  ansible.builtin.uri:
    url: "https://{{ pihole_host }}:{{ pihole_port }}{{ api_endpoint }}/{{ encoded_item }}"
    method: DELETE
    headers:
      X-FTL-SID: "{{ pihole_session }}"
    status_code: 204
    ca_path: "{{ pihole_ca_file.path }}"
  vars:
    encoded_item: "{{ item | urlencode | replace('/', '%2F') }}"
  loop: "{{ records_to_delete }}"
  changed_when: true
  register: delete_result
  until: delete_result.status not in pihole_api_unavailable
  retries: "{{ pihole_api_retries }}"
  delay: "{{ pihole_api_delay }}"

- name: Add records for {{ record_type }}
  ansible.builtin.uri:
    url: "https://{{ pihole_host }}:{{ pihole_port }}{{ api_endpoint }}/{{ encoded_item }}"
    method: PUT
    headers:
      X-FTL-SID: "{{ pihole_session }}"
    status_code: 201
    ca_path: "{{ pihole_ca_file.path }}"
  vars:
    encoded_item: "{{ item | urlencode | replace('/', '%2F') }}"
  loop: "{{ records_to_add }}"
  changed_when: true
  register: add_result
  until: add_result.status not in pihole_api_unavailable
  retries: "{{ pihole_api_retries }}"
  delay: "{{ pihole_api_delay }}"

- name: Show records summary for {{ record_type }}
  ansible.builtin.debug:
    msg: |
      {{ record_type | capitalize }} Configuration:
      - Records to delete: {{ records_to_delete | length }}
      - Records to add: {{ records_to_add | length }}
