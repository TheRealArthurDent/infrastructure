---
# Modular task to manage Pi-hole adlists (block or allow lists)
# Parameters:
#   - api_endpoint: API endpoint path (/api/lists)
#   - list_type: Type of list to manage ("block" or "allow")
#   - desired_records: List of list URLs
#   - record_format: "simple" (plain strings)
# Expects pihole_host, pihole_port, pihole_session and pihole_ca_file from setup-pihole.yaml.

- name: Get existing lists from API for type {{ list_type }}
  ansible.builtin.uri:
    url: "https://{{ pihole_host }}:{{ pihole_port }}{{ api_endpoint }}?type={{ list_type }}"
    method: GET
    headers:
      X-FTL-SID: "{{ pihole_session }}"
    status_code: 200
    ca_path: "{{ pihole_ca_file.path }}"
  check_mode: false
  register: api_response
  until: >-
    api_response.status not in pihole_api_unavailable
    and api_response.json.error.key | default('') not in pihole_api_busy_errors
  retries: "{{ pihole_api_retries }}"
  delay: "{{ pihole_api_delay }}"

- name: Extract existing list records
  ansible.builtin.set_fact:
    existing_lists_extracted: >-
      {{ api_response.json.lists
         | map(attribute='address')
         | list }}

- name: Show existing lists
  ansible.builtin.debug:
    msg: "Existing lists: {{ existing_lists_extracted }}"

- name: Format desired lists (simple list)
  ansible.builtin.set_fact:
    desired_records_formatted: "{{ desired_records }}"
  when: record_format == "simple"

- name: Show desired lists
  ansible.builtin.debug:
    msg: "Desired lists: {{ desired_records_formatted }}"

- name: Identify lists to delete
  ansible.builtin.set_fact:
    records_to_delete: >-
      {{ existing_lists_extracted
         | difference(desired_records_formatted | default(desired_records)) }}

- name: Identify lists to add
  ansible.builtin.set_fact:
    records_to_add: >-
      {{ (desired_records_formatted | default(desired_records))
         | difference(existing_lists_extracted) }}

- name: Show lists to delete
  ansible.builtin.debug:
    msg: "Lists to delete: {{ records_to_delete }}"
  when: records_to_delete | length > 0

- name: Show lists to add
  ansible.builtin.debug:
    msg: "Lists to add: {{ records_to_add }}"
  when: records_to_add | length > 0

# The list URL is a path segment, so everything in it is encoded, including '/' (raspberry#234).
- name: Delete old lists of type {{ list_type }}
  ansible.builtin.uri:
    url: "https://{{ pihole_host }}:{{ pihole_port }}{{ api_endpoint }}/{{ encoded_item }}?type={{ list_type }}"
    method: DELETE
    headers:
      X-FTL-SID: "{{ pihole_session }}"
    status_code: 204
    ca_path: "{{ pihole_ca_file.path }}"
  vars:
    encoded_item: "{{ item | urlencode | replace('/', '%2F') }}"
  loop: "{{ records_to_delete }}"
  changed_when: true
  register: delete_result
  until: >-
    delete_result.status not in pihole_api_unavailable
    and delete_result.json.error.key | default('') not in pihole_api_busy_errors
  retries: "{{ pihole_api_retries }}"
  delay: "{{ pihole_api_delay }}"

- name: Add lists of type {{ list_type }}
  ansible.builtin.uri:
    url: "https://{{ pihole_host }}:{{ pihole_port }}{{ api_endpoint }}?type={{ list_type }}"
    method: POST
    headers:
      X-FTL-SID: "{{ pihole_session }}"
    body_format: json
    body:
      address: "{{ item }}"
      comment: "Added by Ansible on {{ now(utc=true).isoformat(timespec='seconds') }}Z"
      groups: [0]
      enabled: true
    status_code: 201
    ca_path: "{{ pihole_ca_file.path }}"
  loop: "{{ records_to_add }}"
  changed_when: true
  register: add_result
  until: >-
    add_result.status not in pihole_api_unavailable
    and add_result.json.error.key | default('') not in pihole_api_busy_errors
  retries: "{{ pihole_api_retries }}"
  delay: "{{ pihole_api_delay }}"

# New or removed lists only take effect once gravity has been rebuilt (raspberry#234).
- name: Update gravity after list changes
  ansible.builtin.uri:
    url: "https://{{ pihole_host }}:{{ pihole_port }}/api/action/gravity"
    method: POST
    headers:
      X-FTL-SID: "{{ pihole_session }}"
    status_code: 200
    ca_path: "{{ pihole_ca_file.path }}"
    # Downloading all lists takes a while on a Pi.
    timeout: 600
  when: records_to_delete | length > 0 or records_to_add | length > 0
  changed_when: true
  register: pihole_api_result
  until: >-
    pihole_api_result.status not in pihole_api_unavailable
    and pihole_api_result.json.error.key | default('') not in pihole_api_busy_errors
  retries: "{{ pihole_api_retries }}"
  delay: "{{ pihole_api_delay }}"

- name: Show lists summary for type {{ list_type }}
  ansible.builtin.debug:
    msg: |
      {{ list_type | capitalize }} lists Configuration:
      - Lists to delete: {{ records_to_delete | length }}
      - Lists to add: {{ records_to_add | length }}
