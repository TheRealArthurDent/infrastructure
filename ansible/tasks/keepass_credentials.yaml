---
# Checks that the KeePass databases are configured and gets their master passwords (raspberry#267).
# Import it before the first lookup('keepass', ...).
#
# keepass_credentials_databases: names of the databases to open (default: the host's keepass_database).
# Sets keepass_passwords (name -> password), keepass_password (the host's database) and keepass_ca_password
# (keepass_ca_database), when those names are in the list.
- name: Ensure the KeePass database names are valid environment variable suffixes
  ansible.builtin.assert:
    that: item is match('^[a-z0-9_]+$')
    fail_msg: >-
      Invalid KeePass database name '{{ item }}': it becomes part of the environment variable
      KEEPASS_PASSWORD_<NAME>, so use only a-z, 0-9 and _.
    quiet: true
  loop: "{{ keepass_credentials_databases | default([keepass_database]) }}"
  run_once: true

- name: Ensure the KeePass databases are configured
  ansible.builtin.assert:
    that:
      - (keepass_databases[item] | default({})).db | default('') | length > 0
      - (keepass_databases[item] | default({})).db | default('') is file
      - not (keepass_databases[item] | default({})).key | default('') or (keepass_databases[item]).key is file
    fail_msg: >-
      KeePass database or key file of '{{ item }}' not found
      (db: '{{ (keepass_databases[item] | default({})).db | default('') }}',
      key: '{{ (keepass_databases[item] | default({})).key | default('') }}').
      Copy inventory/group_vars/all/local.example.yaml to local.yaml and set the paths
      (for raspberry, KEEPASS_DB / KEEPASS_KEY work too).
    quiet: true
  loop: "{{ keepass_credentials_databases | default([keepass_database]) }}"
  run_once: true

# bin/with-keepass sets them from Windows Credential Manager: KEEPASS_PASSWORD for raspberry,
# KEEPASS_PASSWORD_<NAME> for the others.
- name: Get the KeePass master passwords from the environment
  ansible.builtin.set_fact:
    keepass_passwords: >-
      {{ keepass_passwords | default({}) | combine({item: lookup('ansible.builtin.env',
         'KEEPASS_PASSWORD' ~ ('' if item == 'raspberry' else '_' ~ (item | upper)))}) }}
  loop: "{{ keepass_credentials_databases | default([keepass_database]) }}"
  no_log: true

- name: Prompt for the missing KeePass master passwords
  ansible.builtin.pause:
    prompt: "KeePass master password ({{ item }})"
    echo: false
  register: keepass_prompted_passwords
  loop: "{{ keepass_credentials_databases | default([keepass_database]) }}"
  loop_control:
    label: "KeePass master password ({{ item }})"
  when: not keepass_passwords[item]

- name: Use the prompted KeePass master passwords
  ansible.builtin.set_fact:
    keepass_passwords: "{{ keepass_passwords | combine({item.item: item.user_input}) }}"
  loop: "{{ keepass_prompted_passwords.results }}"
  when: item.user_input is defined
  no_log: true

- name: Set the master password of the host's database
  ansible.builtin.set_fact:
    keepass_password: "{{ keepass_passwords[keepass_database] }}"
  when: keepass_database in keepass_passwords
  no_log: true

- name: Set the master password of the root CA database
  ansible.builtin.set_fact:
    keepass_ca_password: "{{ keepass_passwords[keepass_ca_database] }}"
  when: keepass_ca_database in keepass_passwords
  no_log: true
