- name: Require --limit
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Ensure the run is limited to explicit hosts
      ansible.builtin.assert:
        that: ansible_limit is defined
        fail_msg: "Run with --limit <host>"
        quiet: true
      tags: always

# With --limit, the play above matches no host and is skipped. This one stops a limit that selects several hosts
# (all, *, a list or a group), so a run never reaches production by accident. assert needs no connection.
- name: Require --limit to select exactly one host
  hosts: all
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Ensure the run is limited to one host
      ansible.builtin.assert:
        that: ansible_play_hosts_all | length == 1
        fail_msg: "Run with --limit <one host>"
        quiet: true
      tags: always

- name: Check and renew host certificates
  hosts: all
  become: true

  gather_facts: true

  pre_tasks:
    - name: Get the KeePass credentials
      ansible.builtin.import_tasks: tasks/keepass_credentials.yaml

    # Resolved once into memory on the control node; nothing is exported to disk (raspberry#229).
    - name: Read root CA from KeePass
      ansible.builtin.set_fact:
        certificate_check_root_ca_passphrase: >-
          {{ lookup('keepass', db=keepass_db, password=keepass_password, key=keepass_key,
                    group='Domain', title='rootCA') }}
        certificate_check_root_ca_cert: >-
          {{ lookup('keepass', db=keepass_db, password=keepass_password, key=keepass_key,
                    group='Domain', title='rootCA', attachment='rootCA.pem') }}
        certificate_check_root_ca_key: >-
          {{ lookup('keepass', db=keepass_db, password=keepass_password, key=keepass_key,
                    group='Domain', title='rootCA', attachment='rootCA.key') }}
      no_log: true

  roles:
    - certificate_check
