# Merged by the stack role from the components' compose fragments (#14). Don't edit, run the playbook.
networks:
  docker-api:
    internal: true
    name: docker-api
  nginx:
    name: nginx
  outbound:
    external: true
    name: outbound
  siz:
    external: true
    name: siz
secrets:
  grafana_admin_password:
    file: /etc/docker/infrastructure/secrets/grafana_admin_password
  metrics_writer_password:
    file: /etc/docker/infrastructure/secrets/metrics_writer_password
  restic_offsite_passphrase:
    file: /etc/docker/infrastructure/secrets/restic_offsite_passphrase
  restic_passphrase:
    file: /etc/docker/infrastructure/secrets/restic_passphrase
services:
  docker-socket-proxy:
    cap_drop:
    - ALL
    container_name: docker-socket-proxy
    deploy:
      resources:
        limits:
          memory: 64m
    environment:
      CONTAINERS: '1'
      DISABLE_IPV6: '1'
      INFO: '1'
      POST: '0'
    hostname: docker-socket-proxy
    image: linuxserver/socket-proxy:3.4.7-r0-ls103@sha256:e5d819de59b343c01b2fe7adc7fad3c7a60e5dba08e45f1ac317352bc08599b5
    networks:
    - docker-api
    read_only: true
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /run
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
  grafana:
    container_name: grafana
    depends_on:
    - victoriametrics
    deploy:
      resources:
        limits:
          memory: 512m
    environment:
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SERVER_ROOT_URL: https://grafana.dungeon
    healthcheck:
      interval: 1m
      start_interval: 5s
      start_period: 2m
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://localhost:3000/api/health
    hostname: grafana
    image: grafana/grafana:13.3.1
    networks:
    - siz
    restart: unless-stopped
    secrets:
    - grafana_admin_password
    volumes:
    - /etc/docker/infrastructure/grafana/data:/var/lib/grafana
  healthmonitor:
    container_name: healthmonitor
    depends_on:
    - docker-socket-proxy
    dns:
    - 172.30.1.153
    env_file:
    - /etc/docker/infrastructure/.healthmonitor.env
    environment:
    - CONTAINERMON_CHECK_STOPPED=false
    - DOCKER_API_VERSION=1.44
    - DOCKER_HOST=tcp://docker-socket-proxy:2375
    hostname: healthmonitor
    image: ghcr.io/rafhaanshah/container-mon:v1.1.1
    networks:
    - outbound
    - docker-api
    restart: unless-stopped
  homepage:
    cap_drop:
    - ALL
    container_name: homepage
    deploy:
      resources:
        limits:
          memory: 256m
    environment:
      HOMEPAGE_ALLOWED_HOSTS: dungeon
      LOG_TARGETS: stdout
    hostname: homepage
    image: ghcr.io/gethomepage/homepage:v2.8.0
    networks:
    - siz
    read_only: true
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp
    user: 1000:1000
    volumes:
    - /etc/docker/infrastructure/homepage:/app/config:ro
    - bind:
        propagation: rslave
      read_only: true
      source: /media/backup
      target: /media/backup
      type: bind
  nginx:
    container_name: nginx
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://127.0.0.1:8080/health
    hostname: raspberry
    image: nginx:1.31-alpine
    networks:
      nginx: null
      siz:
        aliases:
        - opencloud.dungeon
        - metrics.dungeon
    ports:
    - 80:80
    - 443:443
    - 8443:8443
    restart: unless-stopped
    volumes:
    - /etc/ssl/certs/dhparam.pem:/etc/ssl/certs/dhparam.pem:ro
    - /etc/docker/infrastructure/nginx:/etc/nginx:ro
    - /etc/docker/infrastructure/nginx/dungeon.pem:/etc/nginx/dungeon.pem:ro
    - /etc/docker/infrastructure/nginx/dungeon.key:/etc/nginx/dungeon.key:ro
  outbound:
    container_name: outbound
    depends_on:
    - unbound
    dns:
    - 127.0.0.1
    - 172.30.2.52
    - 9.9.9.9
    env_file:
    - /etc/docker/infrastructure/.outbound.env
    environment:
      FTLCONF_dns_dnssec: 'true'
      FTLCONF_dns_listeningMode: ALL
      FTLCONF_dns_upstreams: 172.30.2.52
      FTLCONF_misc_dnsmasq_lines: edns-packet-max=1232
      TZ: Europe/Berlin
    hostname: outbound
    image: pihole/pihole:2026.11.0
    networks:
      outbound:
        ipv4_address: 172.30.1.153
      siz: {}
    restart: unless-stopped
    volumes:
    - outbound_pihole:/etc/pihole
  portainer:
    container_name: portainer
    environment:
    - TRUSTED_ORIGINS=https://portainer.dungeon
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - --no-check-certificate
      - http://localhost:9000
    hostname: portainer
    image: portainer/portainer-ce:2.45.4-alpine
    networks:
    - siz
    restart: unless-stopped
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - /etc/docker/infrastructure/portainer/data:/data
  resticprofile:
    command:
    - -c
    - "# No backups before every stack's clean-slate restore is done or skipped, or
      a fresh host's empty or\n# half-restored state would become the latest snapshot
      (raspberry#287). restic-restore clean-slate writes the\n# markers.\nfor stack
      in infrastructure opencloud paperless; do\n  [ -f /restore-state/$$stack.done
      ] ||\n    echo \"Waiting for /var/lib/restic-restore/$$stack.done to schedule
      backups\"\n  while [ ! -f /restore-state/$$stack.done ]; do sleep 60; done\ndone\nresticprofile
      schedule --all || exit 1\ncrond -f &\ncrond_pid=$$!\n# crond doesn't pass SIGTERM
      on to its jobs: stop the running job (resticprofile) first and wait for it\nstop_job()
      {\n  pkill -TERM -P $$crond_pid\n  while pgrep -P $$crond_pid >/dev/null; do
      sleep 1; done\n  kill $$crond_pid\n}\ntrap stop_job TERM INT\nwait $$crond_pid\n"
    container_name: resticprofile
    deploy:
      resources:
        limits:
          cpus: '0.50'
    entrypoint: /bin/sh
    environment:
      RESTICPROFILE_OFFSITE_SOURCES: raspi dungeon
      TZ: Europe/Berlin
    healthcheck:
      interval: 10m
      start_interval: 10s
      start_period: 1m
      test:
      - CMD-SHELL
      - awk -v now=$$(date +%s) '/^resticprofile_backup_last_success_timestamp_seconds/
        { ok = now - $$2 < 26 * 3600 } END { exit !ok }' /metrics/backup_last_success.prom
        && { [ ! -f /metrics/restore_drill.prom ] || awk -v now=$$(date +%s) '$$1
        == "restic_restore_drill_success" { ok = $$2 == 1 } $$1 == "restic_restore_drill_last_success_timestamp_seconds"
        { last = $$2 } END { exit !(ok && now - last < 35 * 86400) }' /metrics/restore_drill.prom;
        } && for source in $${RESTICPROFILE_OFFSITE_SOURCES:-}; do awk -v now=$$(date
        +%s) '/^resticprofile_offsite_last_success_timestamp_seconds/ { ok = now -
        $$2 < 36 * 3600 } END { exit !ok }' /metrics/offsite_$${source}_last_success.prom
        && { [ ! -f /metrics/offsite_$${source}_check.prom ] || awk -v now=$$(date
        +%s) '/^resticprofile_offsite_check_last_success_timestamp_seconds/ { ok =
        now - $$2 < 35 * 86400 } END { exit !ok }' /metrics/offsite_$${source}_check.prom;
        } || exit 1; done
    hostname: resticprofile
    image: creativeprojects/resticprofile:0.33.1
    init: true
    networks:
    - nginx
    restart: unless-stopped
    secrets:
    - restic_passphrase
    - restic_offsite_passphrase
    stop_grace_period: 2m
    volumes:
    - /etc/docker/infrastructure/resticprofile/.ssh:/root/.ssh
    - /etc/docker/infrastructure/resticprofile/ssh_config:/etc/ssh/ssh_config:ro
    - /etc/docker/infrastructure/resticprofile/config:/etc/resticprofile:ro
    - /home:/source/home:ro
    - /etc:/source/etc:ro
    - /var/lib/docker/volumes:/source/docker-volumes:ro
    - /var/restore:/restore-target:rw
    - /var/lib/restic-restore:/restore-state:ro
    - /var/lib/resticprofile/metrics:/metrics
    - bind:
        propagation: rslave
      source: /media/backup
      target: /backup
      type: bind
  telegraf-agent:
    command:
    - telegraf
    - --watch-config
    - poll
    container_name: telegraf-agent
    depends_on:
    - docker-socket-proxy
    deploy:
      resources:
        limits:
          memory: 256m
    environment:
      HOST_ETC: /hostfs/etc
      HOST_MOUNT_PREFIX: /hostfs
      HOST_PROC: /hostfs/proc
      HOST_SYS: /hostfs/sys
    healthcheck:
      interval: 1m
      retries: 3
      start_interval: 5s
      start_period: 1m
      test:
      - CMD-SHELL
      - SSL_CERT_FILE=/hostfs/etc/ssl/certs/rootCA.pem wget -q -O /dev/null https://metrics.dungeon/health
      timeout: 10s
    hostname: telegraf-agent
    image: telegraf:1.40.3-alpine
    networks:
    - siz
    - docker-api
    restart: unless-stopped
    secrets:
    - metrics_writer_password
    user: telegraf
    volumes:
    - /etc/docker/infrastructure/telegraf:/etc/telegraf:ro
    - bind:
        propagation: rslave
      read_only: true
      source: /
      target: /hostfs
      type: bind
  unbound:
    container_name: unbound
    dns:
    - 127.0.0.1
    - 9.9.9.9
    healthcheck:
      test:
      - CMD
      - dig
      - www.heise.de
      - '@127.0.0.1'
    hostname: unbound
    image: klutchell/unbound:v1.26.2
    networks:
      nginx: {}
      siz:
        ipv4_address: 172.30.2.52
    restart: unless-stopped
  victoriametrics:
    command:
    - -storageDataPath=/storage
    - -retentionPeriod=12M
    - -httpListenAddr=:8428
    container_name: victoriametrics
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      interval: 1m
      start_interval: 5s
      start_period: 1m
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://127.0.0.1:8428/health
    hostname: victoriametrics
    image: victoriametrics/victoria-metrics:v1.156.0
    networks:
    - siz
    restart: unless-stopped
    volumes:
    - victoriametrics_data:/storage
volumes:
  outbound_pihole:
    name: outbound_pihole
  victoriametrics_data:
    name: victoriametrics_data
