error_log /var/log/nginx-error.log warn;

events {
}

http {
    server {
        listen 127.0.0.1:8080;

        location /health {
            access_log off;
            return 200 "ok\n";
        }
    }

    # Redirect all HTTP requests to HTTPS
    server {
        listen              80;
        server_name         dungeon dungeon.*;
        return              301 https://$host$request_uri;
    }

    # Do the real sh1t
    server {
        listen              443 ssl;
        listen              [::]:443 ssl;
        server_name         dungeon dungeon.*;

        include             snippets/ssl-certificates.conf;
        include             snippets/ssl-params.conf;

        root                /usr/share/nginx/html;
        # TODO #4 create some sort of landing page
    }








    server {
        listen              443 ssl;
        listen              [::]:443 ssl;
        server_name         portainer.dungeon portainer.dungeon.*;

        include             snippets/ssl-certificates.conf;
        include             snippets/ssl-params.conf;

        include             snippets/portainer.conf;
    }



    server {
        listen              443 ssl;
        listen              [::]:443 ssl;
        server_name         outbound.dungeon outbound.dungeon.*;

        include             snippets/ssl-certificates.conf;
        include             snippets/ssl-params.conf;

        include             snippets/pihole_outbound.conf;
    }
}
