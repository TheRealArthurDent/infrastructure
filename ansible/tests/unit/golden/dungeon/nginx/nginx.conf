error_log /var/log/nginx-error.log warn;

events {
}

http {
    server {
        listen 127.0.0.1:8080;

        location /health {
            access_log off;
            return 200 "ok\n";
        }
    }

    # Redirect all HTTP requests to HTTPS
    server {
        listen              80;
        server_name         dungeon dungeon.*;
        return              301 https://$host$request_uri;
    }

    # Do the real sh1t
    server {
        listen              443 ssl;
        listen              [::]:443 ssl;
        server_name         dungeon dungeon.*;

        include             snippets/ssl-certificates.conf;
        include             snippets/ssl-params.conf;

        # The landing page (#4)
        include             snippets/landing-page.conf;
    }





    server {
        listen              443 ssl;
        listen              [::]:443 ssl;
        server_name         grafana.dungeon grafana.dungeon.*;

        include             snippets/ssl-certificates.conf;
        include             snippets/ssl-params.conf;

        include             snippets/grafana.conf;
    }

    # The agents' write path to the central part of the monitoring (#39)
    server {
        listen              443 ssl;
        listen              [::]:443 ssl;
        server_name         metrics.dungeon metrics.dungeon.*;

        include             snippets/ssl-certificates.conf;
        include             snippets/ssl-params.conf;

        include             snippets/metrics.conf;
    }

    server {
        listen              443 ssl;
        listen              [::]:443 ssl;
        server_name         portainer.dungeon portainer.dungeon.*;

        include             snippets/ssl-certificates.conf;
        include             snippets/ssl-params.conf;

        include             snippets/portainer.conf;
    }

    # private-cloud's OpenCloud (opencloud/docker-compose.yaml there)
    server {
        listen              443 ssl;
        listen              [::]:443 ssl;
        server_name         opencloud.dungeon opencloud.dungeon.*;

        include             snippets/ssl-certificates.conf;
        include             snippets/ssl-params.conf;

        include             snippets/opencloud.conf;
    }

    # private-cloud's Paperless-ngx (paperless/docker-compose.yaml there)
    server {
        listen              443 ssl;
        listen              [::]:443 ssl;
        server_name         paperless.dungeon paperless.dungeon.*;

        include             snippets/ssl-certificates.conf;
        include             snippets/ssl-params.conf;

        include             snippets/paperless.conf;
    }



    server {
        listen              443 ssl;
        listen              [::]:443 ssl;
        server_name         outbound.dungeon outbound.dungeon.*;

        include             snippets/ssl-certificates.conf;
        include             snippets/ssl-params.conf;

        include             snippets/pihole_outbound.conf;
    }
}
