# The write path of the monitoring (#39): the agents of every host send their metrics here (InfluxDB line protocol),
# each signed in as its host. Nothing else of VictoriaMetrics is served.
location = /write {
    auth_basic "metrics";
    # Written by the secrets role: one line per host in monitoring_writers
    auth_basic_user_file /etc/nginx/metrics.htpasswd;
    # A batch of an agent that was cut off for a while
    client_max_body_size 16m;
    resolver 127.0.0.11;
    set $victoriametrics victoriametrics:8428;
    proxy_pass http://$victoriametrics;
}

# For the agents' healthcheck: reachable means the central host and its nginx are up
location = /health {
    access_log off;
    return 200 "ok\n";
}

location / {
    return 404;
}
