# OpenCloud from private-cloud: plain HTTP on port 9200 in the network siz, it publishes no port.
# Its README lists what it needs from this proxy.
location / {
    resolver 127.0.0.11;
    set $opencloud opencloud:9200;
    proxy_pass http://$opencloud;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # Websockets of the web UI
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Uploads of any size, streamed instead of buffered by nginx
    client_max_body_size 0;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
