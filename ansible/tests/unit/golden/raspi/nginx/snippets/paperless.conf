# Paperless-ngx from private-cloud: plain HTTP on port 8000 in the network siz, it publishes no port.
# Its README lists what it needs from this proxy.
location / {
    resolver 127.0.0.11;
    set $paperless paperless-webserver:8000;
    proxy_pass http://$paperless;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # Websockets for the status updates of the web UI
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Uploads of scans with many pages; OCR runs in the background, so no long timeouts
    client_max_body_size 100M;
    proxy_read_timeout 300s;
}
