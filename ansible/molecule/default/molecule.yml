# Container-based tests for the roles that don't depend on Pi hardware or a real sshd.
# Run from ansible/: molecule test
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_PROJECT_DIRECTORY}/requirements.yaml

driver:
  name: docker

platforms:
  - name: raspi-trixie
    image: debian:trixie
    dockerfile: Dockerfile.j2
    pre_build_image: false
    command: sleep infinity
    # The resticprofile role resolves the backup host on the Pi (getent).
    etc_hosts:
      dungeon: 192.0.2.10
  # dungeon's profile: the stack components without Pi-hole, a local restic repository on the backup SSD and the
  # backup_target role (host_vars below mirror inventory/host_vars/dungeon.yaml).
  - name: dungeon-trixie
    image: debian:trixie
    dockerfile: Dockerfile.j2
    pre_build_image: false
    command: sleep infinity
    # A tmpfs is a mount point of its own, which the backup_target role checks (mountpoint -q) with
    # backup_target_manage_mount: false, where a real host mounts the backup SSD.
    tmpfs:
      - /media/backup

provisioner:
  name: ansible
  # Molecule defaults to *.yml; this repo uses .yaml (molecule.yml itself is a fixed name).
  playbooks:
    prepare: prepare.yaml
    converge: converge.yaml
    verify: verify.yaml
  env:
    # ansible-lint doesn't see this; it finds the roles through the roles symlink next to converge.yaml.
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/roles
    # JUnit XML per playbook run (create, converge, idempotence, verify, ...) in <repo>/test-results/molecule
    ANSIBLE_CALLBACKS_ENABLED: ansible.builtin.junit
    JUNIT_OUTPUT_DIR: ${MOLECULE_PROJECT_DIRECTORY}/../test-results/molecule
    JUNIT_TASK_CLASS: "true"
    JUNIT_HIDE_TASK_ARGUMENTS: "true"
    # Leak test (raspberry#230): log every run at -v with --diff;
    # verify.yaml checks the log for secrets.
    ANSIBLE_VERBOSITY: "1"
    ANSIBLE_DIFF_ALWAYS: "true"
    ANSIBLE_LOG_PATH: ${MOLECULE_EPHEMERAL_DIRECTORY}/ansible.log
  inventory:
    host_vars:
      raspi-trixie:
        # Connect as the unprivileged deploy user, like on the real Pi.
        ansible_user: smarthome
        ansible_become: true
        # Fast DH params for tests; production uses inventory values.
        dhparameter_bits: 1024
        # Like host_vars/raspi.yaml: only hosts in the Argon case run the fan role.
        argon_fan_enabled: true
      dungeon-trixie:
        ansible_user: smarthome
        ansible_become: true
        dhparameter_bits: 1024
        base_rsnapshot_enabled: false
        secrets_smart_home_env: false
        secrets_opencloud_env: true
        backup_target_enabled: true
        # No SSD and no device to mount: the tmpfs from the platform stands in for the mounted SSD.
        backup_target_manage_mount: false
        backup_target_mount: /media/backup
        backup_target_uuid: eeeb6563-1a18-4941-a7bd-72ec86622fa7
        # Public keys, nothing secret
        backup_target_clients:
          raspi: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICc/eKct+1gtT9eqDeH8IBIi8XMjArF5mpxWommghE55
          testbench: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDhOThOZGl1G7FFAY2HUFIrMzi/wK+bcoVarIiZLnsDk
        stack_components:
          - reverse_proxy
          - portainer
          - unbound
          - outbound
          - resticprofile
          - healthmonitor
        resticprofile_repository: local:/backup/restic/dungeon
        resticprofile_backup_mount: /media/backup
        resticprofile_backup_stacks: ["{{ stack_project_name }}"]
        reverse_proxy_vhosts: [portainer, outbound, opencloud]
        certificate_check_subdomains: [portainer, outbound, opencloud]

verifier:
  name: ansible
