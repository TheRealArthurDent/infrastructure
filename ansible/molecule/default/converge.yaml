- name: Converge
  hosts: all
  gather_facts: true
  # Dummy secrets instead of KeePass lookups
  vars_files:
    - vars/secrets.yaml
  vars:
    dungeon_ssh_port: 2222
    iobroker_states_redis_port: 9000
    iobroker_objects_redis_port: 9001
    nodered_github_user: test-user
    nodered_github_email: test@example.com
    # No Docker daemon runs inside the test container.
    certificate_check_reload_nginx: false
    docker_restart_daemon: false
    # A container can't change the host's kernel settings.
    base_sysctl_reload: false
    # No NetworkManager runs in the test container.
    base_networkmanager_reload: false
    stack_manage_containers: false
    # No systemd and no I2C in the test container
    argon_fan_manage_service: false
    certificate_check_root_ca_passphrase: test-ca-passphrase
    # restic directly instead of the resticprofile container, on the repository from prepare.yaml
    resticprofile_restore_runners:
      exec: &test_restic [restic, -r, /srv/restic-repo, --password-file, /srv/restic-password]
      oneoff: *test_restic
    resticprofile_restore_staging:
      host: /var/restore
      restic: /var/restore
  pre_tasks:
    # The real resticprofile_backup_stacks (Molecule doesn't read the repo's inventory). The restore items come from
    # the components' defaults. Not for dungeon, which sets its own in the platform's host_vars (include_vars would
    # override them).
    - name: Load the shared backup variables
      ansible.builtin.include_vars:
        file: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}/inventory/group_vars/all/backup.yaml"
      when: not (backup_target_enabled | default(false) | bool)

    # Throwaway root CA on the control node, kept in the Molecule ephemeral directory so the
    # idempotence run signs with the same CA.
    - name: Create test root CA on the control node
      delegate_to: localhost
      become: false
      block:
        - name: Create test root CA private key
          community.crypto.openssl_privatekey:
            path: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/rootCA.key"
            passphrase: "{{ certificate_check_root_ca_passphrase }}"
            cipher: auto
            size: 2048
            mode: '0600'

        - name: Create test root CA CSR
          community.crypto.openssl_csr_pipe:
            privatekey_path: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/rootCA.key"
            privatekey_passphrase: "{{ certificate_check_root_ca_passphrase }}"
            common_name: Molecule Test Root CA
            basic_constraints: ['CA:TRUE']
            basic_constraints_critical: true
            key_usage: [keyCertSign, cRLSign]
            key_usage_critical: true
          register: test_ca_csr
          changed_when: false

        - name: Create test root CA certificate
          community.crypto.x509_certificate:
            path: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/rootCA.pem"
            csr_content: "{{ test_ca_csr.csr }}"
            privatekey_path: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/rootCA.key"
            privatekey_passphrase: "{{ certificate_check_root_ca_passphrase }}"
            provider: selfsigned
            mode: '0644'

    - name: Pass the test root CA to certificate_check
      ansible.builtin.set_fact:
        certificate_check_root_ca_cert: >-
          {{ lookup('file', lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') ~ '/rootCA.pem') }}
        certificate_check_root_ca_key: >-
          {{ lookup('file', lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') ~ '/rootCA.key') }}
      no_log: true
  roles:
    - base
    - docker
    - role: backup_target
      when: backup_target_enabled | default(false) | bool
    - secrets
    - certificate_check
    - role: argon_fan
      when: argon_fan_enabled | default(false) | bool
    - stack
