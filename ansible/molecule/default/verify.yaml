- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Check no secret was printed (-v and --diff, see molecule.yml)
      vars:
        # Read inside the assert so the log itself is never printed.
        log_path: "{{ lookup('ansible.builtin.env', 'ANSIBLE_LOG_PATH') }}"
        run_log: "{{ lookup('ansible.builtin.file', log_path) }}"
        leaked: "{{ run_log | regex_findall('LEAKCANARY[\\w-]*') | unique }}"
      ansible.builtin.assert:
        that: run_log is not search('LEAKCANARY')
        fail_msg: >-
          Secrets leaked into the Ansible output: {{ leaked | join(', ') }}.
          Find the task printing them and add no_log: true.
        success_msg: No secrets in the Ansible log

    - name: Gather package facts
      ansible.builtin.package_facts:

    - name: Check required packages are installed
      ansible.builtin.assert:
        that: item in ansible_facts.packages
        fail_msg: "{{ item }} is not installed"
      loop:
        - rsnapshot
        - docker-ce
        - docker-compose-plugin

    - name: Validate the deployed sudoers file
      ansible.builtin.command: visudo -cf /etc/sudoers.d/smarthome
      changed_when: false

    - name: Stat the deployed sudoers file
      ansible.builtin.stat:
        path: /etc/sudoers.d/smarthome
      register: sudoers_file

    - name: Check sudoers file is owned by root and read-only
      ansible.builtin.assert:
        that:
          - sudoers_file.stat.exists
          - sudoers_file.stat.pw_name == 'root'
          - sudoers_file.stat.mode == '0440'
        fail_msg: /etc/sudoers.d/smarthome is missing or has wrong ownership/mode

    - name: Stat Docker apt key files
      ansible.builtin.stat:
        path: "{{ item }}"
      register: docker_apt_files
      loop:
        - /etc/apt/keyrings/docker.asc
        - /etc/apt/trusted.gpg.d/docker.gpg
        - /etc/apt/sources.list.d/docker.list
        - /etc/apt/sources.list.d/docker.sources

    - name: Check Docker key is only in its own keyring, not trusted for every repo (raspberry#231)
      vars:
        stats: "{{ docker_apt_files.results | items2dict(key_name='item', value_name='stat') }}"
      ansible.builtin.assert:
        that:
          - stats['/etc/apt/keyrings/docker.asc'].exists
          - stats['/etc/apt/keyrings/docker.asc'].pw_name == 'root'
          - stats['/etc/apt/keyrings/docker.asc'].mode == '0644'
          - not stats['/etc/apt/trusted.gpg.d/docker.gpg'].exists
          - not stats['/etc/apt/sources.list.d/docker.list'].exists
          - stats['/etc/apt/sources.list.d/docker.sources'].exists
        fail_msg: >-
          Expected the Docker key at /etc/apt/keyrings/docker.asc and the repository in docker.sources,
          with the old trusted.gpg.d/docker.gpg and docker.list removed

    - name: Read Docker apt repository
      ansible.builtin.slurp:
        src: /etc/apt/sources.list.d/docker.sources
      register: docker_sources

    - name: Check Docker repository is signed by its own keyring
      ansible.builtin.assert:
        that: "'Signed-By: /etc/apt/keyrings/docker.asc' in (docker_sources.content | b64decode)"
        fail_msg: docker.sources does not pin Signed-By to /etc/apt/keyrings/docker.asc

    - name: Gather distribution and network facts
      ansible.builtin.setup:
        gather_subset: [distribution, network]

    # Molecule passes no distribution vars, so these come from facts (raspberry#237).
    - name: Check Docker repository matches the host's release and architecture
      vars:
        sources: "{{ docker_sources.content | b64decode }}"
        expected_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
      ansible.builtin.assert:
        that:
          - "'URIs: https://download.docker.com/linux/debian' in sources"
          - "'Suites: ' ~ ansible_facts['distribution_release'] in sources"
          - "'Architectures: ' ~ expected_arch in sources"
        fail_msg: "docker.sources doesn't match this host: {{ sources }}"

    - name: Stat the NetworkManager DNS fallback
      ansible.builtin.stat:
        path: /etc/NetworkManager/conf.d/90-dns-fallback.conf
      register: dns_fallback_file

    - name: Read the NetworkManager DNS fallback
      ansible.builtin.slurp:
        src: /etc/NetworkManager/conf.d/90-dns-fallback.conf
      register: dns_fallback_config

    # Pi-hole on this host first, the Fritzbox only when Pi-hole doesn't answer, e.g. before it exists.
    - name: Check the host resolves through its own Pi-hole and falls back to the router
      vars:
        config: "{{ dns_fallback_config.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - dns_fallback_file.stat.pw_name == 'root'
          - dns_fallback_file.stat.mode == '0644'
          - "'servers=' ~ ansible_facts['default_ipv4']['address'] ~ ',192.168.1.1' in config.splitlines()"
          - "'options=timeout:1' in config.splitlines()"
          - "'[global-dns-domain-*]' in config.splitlines()"
        fail_msg: "Unexpected DNS fallback config: {{ config }}"

    - name: Stat Docker daemon config
      ansible.builtin.stat:
        path: /etc/docker/daemon.json
      register: docker_daemon_file

    - name: Read Docker daemon config
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: docker_daemon_config

    # The containers resolve through this host's own Pi-hole, not a hard-coded raspi address (raspberry#237).
    - name: Check Docker daemon uses this host as DNS server
      vars:
        config: "{{ docker_daemon_config.content | b64decode | from_json }}"
      ansible.builtin.assert:
        that:
          - docker_daemon_file.stat.pw_name == 'root'
          - docker_daemon_file.stat.mode == '0644'
          - config.dns == [ansible_facts['default_ipv4']['address']]
          - config['max-concurrent-uploads'] == 1
          - config['max-concurrent-downloads'] == 1
        fail_msg: "Expected dns [{{ ansible_facts['default_ipv4']['address'] }}], got {{ config }}"

    - name: Read deploy user groups
      ansible.builtin.command: id -nG smarthome
      register: user_groups
      changed_when: false

    - name: Check deploy user is in the docker group
      ansible.builtin.assert:
        that: "'docker' in user_groups.stdout.split()"

    - name: Read root crontab
      ansible.builtin.command: crontab -l -u root
      register: crontab
      changed_when: false

    # weekly must run before daily, otherwise both start at once on Sundays and one fails on the lockfile
    # (raspberry#232)
    - name: Check rsnapshot cron jobs run weekly before daily
      ansible.builtin.assert:
        that:
          - "'30 1 * * 0 rsnapshot weekly' in crontab.stdout_lines"
          - "'0 2 * * * rsnapshot daily' in crontab.stdout_lines"
        fail_msg: "rsnapshot cron schedule is wrong: {{ crontab.stdout_lines | select('search', 'rsnapshot') | list }}"

    - name: Stat secret files
      ansible.builtin.stat:
        path: "{{ item }}"
      register: secret_files
      loop:
        - /etc/docker/infrastructure/.env
        - /etc/docker/infrastructure/.outbound.env
        - /etc/docker/infrastructure/.healthmonitor.env
        - /etc/docker/infrastructure/secrets/restic_passphrase
        - /etc/docker/infrastructure/resticprofile/.ssh/id_ed25519
        - /etc/docker/smart-home/.env

    - name: Check secret files exist, are owned by root and are not world-readable
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.pw_name == 'root'
          - item.stat.mode == '0600'
        fail_msg: "{{ item.item }} is missing or has wrong ownership/mode"
      loop: "{{ secret_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read the restic SSH key pair
      ansible.builtin.slurp:
        src: "/etc/docker/infrastructure/resticprofile/.ssh/{{ item }}"
      register: restic_key_pair
      loop:
        - id_ed25519
        - id_ed25519.pub
      no_log: true

    - name: Stat the restic SSH public key and the old init script
      ansible.builtin.stat:
        path: "{{ item }}"
      register: restic_key_stats
      loop:
        - /etc/docker/infrastructure/resticprofile/.ssh/id_ed25519.pub
        - /etc/docker/infrastructure/init-restic.sh

    - name: Check the restic key pair is the one from KeePass, and the init script is gone
      ansible.builtin.assert:
        that:
          - restic_key_pair.results[0].content | b64decode == 'LEAKCANARY-ssh-key\n'
          - restic_key_pair.results[1].content | b64decode == 'ssh-ed25519 LEAKCANARY-ssh-key-pub molecule@test\n'
          - restic_key_stats.results[0].stat.pw_name == 'root'
          - restic_key_stats.results[0].stat.mode == '0644'
          - not restic_key_stats.results[1].stat.exists
        fail_msg: The restic key pair doesn't match the KeePass values, or init-restic.sh still exists
      no_log: true

    - name: Read infrastructure .env
      ansible.builtin.slurp:
        src: /etc/docker/infrastructure/.env
      register: infra_env

    - name: Check pihole password is rendered
      ansible.builtin.assert:
        that: "'FTLCONF_webserver_api_password=LEAKCANARY-pihole' in (infra_env.content | b64decode)"

    - name: Read the kernel command line
      ansible.builtin.slurp:
        src: /boot/firmware/cmdline.txt
      register: cmdline

    # prepare.yaml planted it with cgroup_enable=cpuset already present (raspberry#313)
    - name: Check the memory cgroup is enabled once each and the rest of the line is kept
      ansible.builtin.assert:
        that:
          - cmdline_text.endswith('\n')
          - cmdline_text.splitlines() | length == 1
          - cmdline_text.startswith('console=serial0,115200 console=tty1 root=PARTUUID=0a1b2c3d-02 rootfstype=ext4 '
                                    'fsck.repair=yes rootwait cfg80211.ieee80211_regdom=DE cgroup_enable=cpuset')
          - cmdline_words | select('eq', 'cgroup_enable=cpuset') | list | length == 1
          - cmdline_words | select('eq', 'cgroup_enable=memory') | list | length == 1
          - cmdline_words | select('eq', 'cgroup_memory=1') | list | length == 1
        fail_msg: "Unexpected kernel command line: {{ cmdline_text }}"
      vars:
        cmdline_text: "{{ cmdline.content | b64decode }}"
        cmdline_words: "{{ cmdline_text.split() }}"

    - name: Read the boot config
      ansible.builtin.slurp:
        src: /boot/firmware/config.txt
      register: boot_config

    - name: Check I2C is enabled once and the rest of the boot config is kept (raspberry#325)
      ansible.builtin.assert:
        that:
          - boot_lines | select('match', '^#?\\s*dtparam=i2c_arm=') | list == ['dtparam=i2c_arm=on']
          - "'#dtparam=spi=on' in boot_lines"
          - "'dtparam=audio=on' in boot_lines"
        fail_msg: "Unexpected boot config: {{ boot_lines }}"
      vars:
        boot_lines: "{{ (boot_config.content | b64decode).splitlines() }}"

    - name: Stat the fan control files
      ansible.builtin.stat:
        path: "{{ item.path }}"
      register: argon_fan_files
      loop:
        - {path: /usr/local/bin/argon-fan, mode: '0755'}
        - {path: /etc/argon-fan.json, mode: '0644'}
        - {path: /etc/systemd/system/argon-fan.service, mode: '0644'}
        - {path: /etc/modules-load.d/i2c-dev.conf, mode: '0644'}

    - name: Check the fan control files exist, owned by root
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.pw_name == 'root'
          - item.stat.mode == item.item.mode
        fail_msg: "{{ item.item.path }} is missing or has the wrong owner or mode"
      loop: "{{ argon_fan_files.results }}"
      loop_control:
        label: "{{ item.item.path }}"

    - name: Read the fan config
      ansible.builtin.slurp:
        src: /etc/argon-fan.json
      register: argon_fan_config

    - name: Check the fan config has raspi's thresholds
      ansible.builtin.assert:
        that:
          - "fan_config.thresholds == {'55': 10, '60': 55, '65': 100}"
          - fan_config.interval == 30
          - fan_config.bus == 1
      vars:
        fan_config: "{{ argon_fan_config.content | b64decode | from_json }}"

    # Loads its config and the I2C library on the target, short of opening the bus
    - name: Check the fan daemon runs with the deployed Python and its config
      ansible.builtin.command: >-
        python3 -c "import runpy, smbus;
        d = runpy.run_path('/usr/local/bin/argon-fan', run_name='argon_fan');
        print(d['load_config']('/etc/argon-fan.json')['thresholds'])"
      register: argon_fan_run
      changed_when: false
      failed_when: "argon_fan_run.stdout != '[(55.0, 10), (60.0, 55), (65.0, 100)]'"

    - name: Stat DH parameters
      ansible.builtin.stat:
        path: /etc/ssl/certs/dhparam.pem
      register: dhparam

    - name: Check DH parameters exist
      ansible.builtin.assert:
        that: dhparam.stat.exists

    - name: Stat root CA private key on the host
      ansible.builtin.stat:
        path: /etc/ssl/private/rootCA.key
      register: root_ca_key

    - name: Check root CA private key is not on the host
      ansible.builtin.assert:
        that: not root_ca_key.stat.exists
        fail_msg: /etc/ssl/private/rootCA.key must not exist on the host (raspberry#229)

    - name: Stat host certificate files
      ansible.builtin.stat:
        path: "/etc/docker/infrastructure/nginx/{{ inventory_hostname }}.{{ item.ext }}"
      register: cert_files
      loop:
        - {ext: key, mode: '0600'}
        - {ext: crt, mode: '0644'}
        - {ext: pem, mode: '0644'}

    - name: Check host certificate files exist with owner and mode
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.pw_name == 'root'
          - item.stat.mode == item.item.mode
        fail_msg: "{{ item.item.ext }} file is missing or has wrong ownership/mode"
      loop: "{{ cert_files.results }}"
      loop_control:
        label: "{{ item.item.ext }}"

    - name: Verify host certificate against the root CA
      ansible.builtin.command: >-
        openssl verify -CAfile /etc/ssl/certs/rootCA.pem
        /etc/docker/infrastructure/nginx/{{ inventory_hostname }}.crt
      changed_when: false

    - name: Read public key of the host certificate
      ansible.builtin.command: >-
        openssl x509 -noout -pubkey -in /etc/docker/infrastructure/nginx/{{ inventory_hostname }}.crt
      register: cert_pubkey
      changed_when: false

    - name: Read public key of the host private key
      ansible.builtin.command: openssl pkey -pubout -in /etc/docker/infrastructure/nginx/{{ inventory_hostname }}.key
      register: key_pubkey
      changed_when: false

    - name: Check host certificate matches its private key
      ansible.builtin.assert:
        that: cert_pubkey.stdout == key_pubkey.stdout

    - name: Read SANs of the host certificate
      ansible.builtin.command: >-
        openssl x509 -noout -ext subjectAltName
        -in /etc/docker/infrastructure/nginx/{{ inventory_hostname }}.crt
      register: cert_san
      changed_when: false

    - name: Check host certificate covers the host and its subdomains
      ansible.builtin.assert:
        that:
          - "'DNS:' ~ inventory_hostname in cert_san.stdout"
          - "'DNS:pihole.' ~ inventory_hostname in cert_san.stdout"

    - name: Count certificates in the nginx full chain
      ansible.builtin.command: grep -c 'BEGIN CERTIFICATE' /etc/docker/infrastructure/nginx/{{ inventory_hostname }}.pem
      register: chain_count
      changed_when: false

    - name: Check full chain holds leaf and root CA exactly once
      ansible.builtin.assert:
        that: chain_count.stdout == '2'

    # stack role (raspberry#238)
    - name: Stat stack config files
      ansible.builtin.stat:
        path: "/etc/docker/infrastructure/{{ item }}"
      loop:
        - nginx/nginx.conf
        - nginx/snippets/pihole.conf
        - nginx/snippets/ssl-certificates.conf
        - resticprofile/config/profiles.yaml
        - resticprofile/config/excludes
        - resticprofile/ssh_config
      register: stack_files

    - name: Check stack config files exist, are owned by root and only readable by root
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.pw_name == 'root'
          - item.stat.mode == '0600'
        fail_msg: "{{ item.item }} is missing or has wrong owner/mode"
      loop: "{{ stack_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Find leftover placeholders in the stack config
      ansible.builtin.command: grep -rlE '%HOSTNAME%|\{\{|\$\{(HOSTNAME|DUNGEON_IP)\}' /etc/docker/infrastructure/nginx
        /etc/docker/infrastructure/resticprofile /etc/docker/infrastructure/compose
      register: stack_placeholders
      changed_when: false
      failed_when: stack_placeholders.rc not in [0, 1]

    - name: Check every placeholder is rendered
      ansible.builtin.assert:
        that: stack_placeholders.stdout_lines | length == 0
        fail_msg: "Unrendered placeholders in {{ stack_placeholders.stdout_lines }}"

    - name: Read rendered stack config
      ansible.builtin.slurp:
        src: "/etc/docker/infrastructure/{{ item }}"
      loop:
        - nginx/nginx.conf
        - nginx/snippets/ssl-certificates.conf
        - resticprofile/config/profiles.yaml
        - resticprofile/ssh_config
        - compose/docker-compose.yaml
      register: stack_rendered

    - name: Check the stack config is rendered for this host
      vars:
        rendered: "{{ stack_rendered.results | items2dict(key_name='item', value_name='content') }}"
        nginx_conf: "{{ rendered['nginx/nginx.conf'] | b64decode }}"
        ssl_conf: "{{ rendered['nginx/snippets/ssl-certificates.conf'] | b64decode }}"
        profiles: "{{ rendered['resticprofile/config/profiles.yaml'] | b64decode }}"
        ssh_config: "{{ rendered['resticprofile/ssh_config'] | b64decode }}"
        compose: "{{ rendered['compose/docker-compose.yaml'] | b64decode | from_yaml }}"
        nginx_cert_mount: >-
          /etc/docker/infrastructure/nginx/{{ inventory_hostname }}.pem:/etc/nginx/{{ inventory_hostname }}.pem:ro
      ansible.builtin.assert:
        that:
          - "'server_name         pihole.' ~ inventory_hostname ~ ' pihole.' ~ inventory_hostname ~ '.*;' in nginx_conf"
          - "'ssl_certificate     /etc/nginx/' ~ inventory_hostname ~ '.pem;' in ssl_conf"
          - "'restic@dungeon:/media/backup/restic/' ~ inventory_hostname in profiles"
          # dungeon_ssh_port from converge.yaml (KeePass in production), no longer hard-coded (raspberry#233)
          - "'Port 2222' in ssh_config.splitlines()"
          # Resolved through the etc_hosts entry in molecule.yml
          - compose.services.resticprofile.extra_hosts.dungeon == '192.0.2.10'
          - "nginx_cert_mount in compose.services.nginx.volumes"

    - name: Stat stack directories
      ansible.builtin.stat:
        path: "/etc/docker/infrastructure/{{ item }}"
      loop:
        - portainer/data
        - compose
      register: stack_dirs

    - name: Check stack directories exist
      ansible.builtin.assert:
        that:
          - item.stat.isdir
          - item.stat.pw_name == 'root'
      loop: "{{ stack_dirs.results }}"
      loop_control:
        label: "{{ item.item }}"

    # Validates the compose file against the files it references (.env files, secrets), no daemon needed.
    - name: Validate the compose file
      ansible.builtin.command: docker compose --project-directory /etc/docker/infrastructure/compose config --quiet
      changed_when: false

    - name: Stat the restored item data
      ansible.builtin.stat:
        path: "/etc/docker/infrastructure/{{ item }}"
      loop:
        - portainer/data/portainer.db
        - pihole/pihole/gravity.db
      register: restored

    - name: Check the clean-slate restore brought the data back with owner and mode (raspberry#287)
      ansible.builtin.assert:
        that:
          - item.stat.isreg
          - item.stat.uid == 1234
          - item.stat.mode == '0600'
        fail_msg: "{{ item.item }} wasn't restored from the snapshot made in prepare.yaml"
      loop: "{{ restored.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Read the restored Portainer data
      ansible.builtin.slurp:
        src: /etc/docker/infrastructure/portainer/data/portainer.db
      register: restored_portainer

    - name: Read the latest test snapshot
      ansible.builtin.command: restic -r /srv/restic-repo --password-file /srv/restic-password snapshots --json latest
      register: test_snapshot
      changed_when: false

    - name: Read the restore marker
      ansible.builtin.slurp:
        src: /var/lib/restic-restore/infrastructure.done
      register: restore_marker

    - name: Check the restore marker names the restored snapshot and no backup was taken meanwhile
      ansible.builtin.assert:
        that:
          - restored_portainer.content | b64decode == 'portainer from backup\n'
          - restore_marker.content | b64decode | trim == (test_snapshot.stdout | from_json | first).id
          - test_snapshot.stdout | from_json | length == 1

    - name: Find leftover staging directories
      ansible.builtin.find:
        paths: /var/restore
        file_type: any
      register: restore_staging

    - name: Check the restore cleaned up its staging directories
      ansible.builtin.assert:
        that: restore_staging.matched == 0

    - name: Stat the restore helper
      ansible.builtin.stat:
        path: /usr/local/bin/restic-restore
      register: restore_helper

    - name: Read the restore items of this stack
      ansible.builtin.slurp:
        src: /etc/restic-restore/stacks/infrastructure.json
      register: restore_stack_items

    - name: Check this stack's items are listed for the helper
      ansible.builtin.assert:
        that: (restore_stack_items.content | b64decode | from_json)['items'].keys() | sort == ['pihole', 'portainer']

    - name: Check the restore helper is installed and executable
      ansible.builtin.assert:
        that:
          - restore_helper.stat.isreg
          - restore_helper.stat.mode == '0755'

    # Targeted restore on a running host (raspberry#286): break the Portainer data, then bring it back with the helper.
    # No Docker daemon runs here, so apply finds no running container to stop.
    - name: Change and add Portainer data, as if it went wrong
      ansible.builtin.copy:
        content: "{{ item.content }}\n"
        dest: "/etc/docker/infrastructure/portainer/data/{{ item.name }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - {name: portainer.db, content: broken}
        - {name: stray.db, content: not in the backup}
      loop_control:
        label: "{{ item.name }}"

    - name: List the snapshots with the restore helper
      ansible.builtin.command: restic-restore snapshots
      register: helper_snapshots
      changed_when: false

    - name: Stage the Portainer data
      ansible.builtin.command: restic-restore stage infrastructure/portainer
      register: helper_stage
      changed_when: true

    - name: Show what applying it would change
      ansible.builtin.command:
        argv: [restic-restore, diff, "{{ helper_stage.stdout }}"]
      register: helper_diff
      changed_when: false

    - name: Apply the staged Portainer data
      ansible.builtin.command:
        argv: [restic-restore, apply, "{{ helper_stage.stdout }}"]
      changed_when: true

    - name: Stat the Portainer data after the targeted restore
      ansible.builtin.stat:
        path: "/etc/docker/infrastructure/portainer/data/{{ item }}"
      loop: [portainer.db, stray.db]
      register: targeted

    - name: Read the Portainer data after the targeted restore
      ansible.builtin.slurp:
        src: /etc/docker/infrastructure/portainer/data/portainer.db
      register: targeted_portainer

    - name: Check the targeted restore brought the data back with owner and mode
      ansible.builtin.assert:
        that:
          - (test_snapshot.stdout | from_json | first).short_id in helper_snapshots.stdout
          - "'portainer.db' in helper_diff.stdout"
          - "'deleting' in helper_diff.stdout and 'stray.db' in helper_diff.stdout"
          - targeted_portainer.content | b64decode == 'portainer from backup\n'
          - targeted.results[0].stat.uid == 1234
          - targeted.results[0].stat.mode == '0600'
          - not targeted.results[1].stat.exists
        fail_msg: "snapshots: {{ helper_snapshots.stdout }} diff: {{ helper_diff.stdout }}"

    - name: Remove the staging directories
      ansible.builtin.command: restic-restore clean --all
      register: helper_clean
      changed_when: helper_clean.stdout | length > 0

    - name: Find staging directories left after clean
      ansible.builtin.find:
        paths: /var/restore
        file_type: any
      register: targeted_staging

    - name: Check clean removed the staging directory
      ansible.builtin.assert:
        that:
          - targeted_staging.matched == 0
          - helper_stage.stdout in helper_clean.stdout

    # Restore drill (raspberry#288): monthly from root's crontab, result for the resticprofile healthcheck
    # Without --read-data-subset: this month's part, from the parts in the host config
    - name: Run the restore drill
      ansible.builtin.command: restic-restore drill
      register: helper_drill
      changed_when: false

    - name: Read the restore drill result
      ansible.builtin.slurp:
        src: /var/lib/resticprofile/metrics/restore_drill.prom
      register: drill_metrics

    - name: Read root crontab after the stack role
      ansible.builtin.command: crontab -l -u root
      register: drill_crontab
      changed_when: false

    - name: Find staging directories left by the drill
      ansible.builtin.find:
        paths: /var/restore
        file_type: any
      register: drill_staging

    - name: Check the drill passed, cleaned up and is scheduled monthly
      ansible.builtin.assert:
        that:
          - "'infrastructure/portainer' in helper_drill.stdout and 'infrastructure/pihole' in helper_drill.stdout"
          - "'restic_restore_drill_success 1' in (drill_metrics.content | b64decode).splitlines()"
          - drill_staging.matched == 0
          - "'0 12 1 * * /usr/local/bin/restic-restore drill 2>&1 | logger -t restic-restore-drill'
            in drill_crontab.stdout_lines"
        fail_msg: "drill: {{ helper_drill.stdout }} cron: {{ drill_crontab.stdout_lines | select('search', 'drill') }}"
