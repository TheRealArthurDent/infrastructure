# Dummy secrets instead of KeePass lookups, read by converge.yaml and verify.yaml. Every value containing LEAKCANARY
# is a secret; verify.yaml fails if one of them shows up in the Ansible log (raspberry#230).
#
# The values are awkward on purpose: $ and ${} for Compose's interpolation, {{ }} and {% %} for Jinja, quotes,
# backslashes, # and shell syntax. verify.yaml reads each .env file with Docker Compose and expects them back
# unchanged. !unsafe makes them what a KeePass lookup returns: data Ansible never renders as a template. InfluxDB
# passwords take no ' or \ and the VNC password no \ (the secrets role refuses them, see its tasks).
pihole_password: !unsafe 'LEAKCANARY-pihole tes$abc$bla{xyz}blub ${HOME} {{ x }} {% if y %} #c'
outbound_password: !unsafe 'LEAKCANARY-outbound "dq" ''sq'' \back\ `id` $(id) a=b'
containermonitor_notification_url: !unsafe 'discord://LEAKCANARY-webhook-token$x@id'
restic_passphrase: !unsafe 'LEAKCANARY-restic $x {{ y }} "q" \z'
resticprofile_ssh_private_key: LEAKCANARY-ssh-key
resticprofile_ssh_public_key: ssh-ed25519 LEAKCANARY-ssh-key-pub molecule@test
influxdb_admin_password: !unsafe 'LEAKCANARY-influx-admin $a${b}{{ c }} #d "e"'
influxdb_read_password: !unsafe 'LEAKCANARY-influx-read {% raw %}r{% endraw %} $$ %s'
influxdb_write_password: !unsafe 'LEAKCANARY-influx-write ${x:-y} äöü€'
grafana_password: !unsafe 'LEAKCANARY-grafana 0123 true null %(x)s !tag *ref &anchor'
mosquitto_password: !unsafe 'LEAKCANARY-mosquitto tes$abc$bla{xyz}blub \ '' "'
deconz_vnc_password: !unsafe 'LEAKCANARY-vnc $x ''y'' "z" #'
opencloud_admin_password: !unsafe 'LEAKCANARY-opencloud-admin $$ {% raw %}r{% endraw %} \n "'
