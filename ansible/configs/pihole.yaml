    address: "192.168.1.1"
  - domain: "raspi"
    address: "192.168.1.2"
  - domain: "erdbeere"
    address: "192.168.1.3"
  - domain: "dungeon"
    address: "192.168.1.5"
  - domain: "testbed"
    address: "192.168.1.7"
  - domain: "erika"
    address: "192.168.1.71"
  - domain: "himbeere"
    address: "192.168.1.106"

