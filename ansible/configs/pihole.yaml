  - domain: "portainer.dungeon"
    target: "dungeon"
  - domain: "nextcloud.erika"
    target: "erika"
  - domain: "portainer.erika"
    target: "erika"
  - domain: "pihole.testbed"
    target: "testbed"
  - domain: "outbound.testbed"
    target: "testbed"
  - domain: "nextcloud.testbed"
    target: "testbed"
  - domain: "iobroker.testbed"
