---
# Pi-hole configuration, one entry per instance, synced by setup-pihole.yaml through each instance's API.
#
# name: the instance; its API is reached at https://<name>.<inventory_hostname>, its password is the KeePass
#   entry Pihole/<name>. host, port and keepass_title override those defaults.
# a_records, cname_records, block_lists: always synced; an empty list removes everything.
# groups, clients, domains: synced only when the list is defined. Leave a list out (or set it to null) to leave
#   that part to the web interface. The Default group always exists and is not managed here. Groups are
#   referenced by name; clients and domains without groups are in Default.
# hosts: the inventory hosts that run the instance (without it: every host). setup-pihole.yaml configures only the
#   instances of the host it is limited to. Two entries may share a name when their hosts differ.
# domains: type allow or deny, kind exact or regex.

pihole_instances:
  - name: "pihole"
    hosts: ["raspi", "testbed"]
    a_records:
      - domain: "fritz.box"
        address: "192.168.1.1"
      - domain: "raspi"
        address: "192.168.1.2"
      - domain: "erdbeere"
        address: "192.168.1.3"
      - domain: "dungeon"
        address: "192.168.1.5"
      - domain: "testbed"
        address: "192.168.1.7"
      - domain: "erika"
        address: "192.168.1.71"
      - domain: "himbeere"
        address: "192.168.1.106"

    cname_records:
      - domain: "pihole.raspi"
        target: "raspi"
      - domain: "outbound.raspi"
        target: "raspi"
      - domain: "nextcloud.raspi"
        target: "raspi"
      - domain: "iobroker.raspi"
        target: "raspi"
      - domain: "ui.raspi"
        target: "raspi"
      - domain: "node-red.raspi"
        target: "raspi"
      - domain: "deconz.raspi"
        target: "raspi"
      - domain: "deconz-ui.raspi"
        target: "raspi"
      - domain: "grafana.raspi"
        target: "raspi"
      - domain: "portainer.raspi"
        target: "raspi"
      - domain: "outbound.dungeon"
        target: "dungeon"
      - domain: "nextcloud.dungeon"
        target: "dungeon"
      - domain: "portainer.dungeon"
        target: "dungeon"
      - domain: "opencloud.dungeon"
        target: "dungeon"
      - domain: "nextcloud.erika"
        target: "erika"
      - domain: "portainer.erika"
        target: "erika"
      - domain: "pihole.testbed"
        target: "testbed"
      - domain: "outbound.testbed"
        target: "testbed"
      - domain: "nextcloud.testbed"
        target: "testbed"
      - domain: "iobroker.testbed"
        target: "testbed"
      - domain: "ui.testbed"
        target: "testbed"
      - domain: "node-red.testbed"
        target: "testbed"
      - domain: "deconz.testbed"
        target: "testbed"
      - domain: "deconz-ui.testbed"
        target: "testbed"
      - domain: "grafana.testbed"
        target: "testbed"
      - domain: "portainer.testbed"
        target: "testbed"
      - domain: "opencloud.testbed"
        target: "testbed"

    block_lists:
      - "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"
      - "https://www.technoy.de/lists/FireTVAds.txt"
      - "https://adaway.org/hosts.txt"
      - "https://v.firebog.net/hosts/AdguardDNS.txt"
      - "https://v.firebog.net/hosts/Admiral.txt"
      - "https://raw.githubusercontent.com/anudeepND/blacklist/master/adservers.txt"
      - "https://s3.amazonaws.com/lists.disconnect.me/simple_ad.txt"
      - "https://v.firebog.net/hosts/Easylist.txt"
      - "https://pgl.yoyo.org/adservers/serverlist.php?hostformat=hosts&showintro=0&mimetype=plaintext"
      - "https://raw.githubusercontent.com/FadeMind/hosts.extras/master/UncheckyAds/hosts"
      - "https://raw.githubusercontent.com/bigdargon/hostsVN/master/hosts"
      - "https://raw.githubusercontent.com/jdlingyu/ad-wars/master/hosts"
      - "https://raw.githubusercontent.com/w13d/adblockListABP-PiHole/master/Spotify.txt"
      - "https://raw.githubusercontent.com/r-a-y/mobile-hosts/master/AdguardMobileAds.txt"
      - "https://raw.githubusercontent.com/r-a-y/mobile-hosts/master/AdguardMobileSpyware.txt"
      - "https://raw.githubusercontent.com/RPiList/specials/master/Blocklisten/samsung"
      - "https://raw.githubusercontent.com/kboghdady/youTube_ads_4_pi-hole/master/youtubelist.txt"
      - "https://blocklistproject.github.io/Lists/ads.txt"
      - "https://blocklistproject.github.io/Lists/abuse.txt"
      - "https://blocklistproject.github.io/Lists/crypto.txt"
      - "https://blocklistproject.github.io/Lists/fraud.txt"
      - "https://blocklistproject.github.io/Lists/malware.txt"
      - "https://blocklistproject.github.io/Lists/phishing.txt"
      - "https://blocklistproject.github.io/Lists/ransomware.txt"
      - "https://blocklistproject.github.io/Lists/scam.txt"
      - "https://blocklistproject.github.io/Lists/tracking.txt"

    groups:
      - name: "Rennknecht"
        comment: "The racing PC"

    clients:
      - client: "192.168.1.114"
        comment: "Rennknecht"
        groups: ["Default", "Rennknecht"]

    domains:
      - domain: "cognito-identity.us-east-1.amazonaws.com"
        type: "allow"
        kind: "exact"
        comment: "For TrackTitan"
        groups: ["Rennknecht"]

  # Egress filter for the containers on the outbound network (smart-home, nextcloud, healthmonitor): it denies
  # everything and allows only what they need (raspberry#293). The containers use it as their DNS server.
  - name: "outbound"
    hosts: ["raspi", "testbed"]
    a_records: []
    cname_records: []
    # '.*' already blocks everything; a block list would only cost a gravity download.
    block_lists: []
    groups: []
    clients: []
    domains:
      - domain: ".*"
        type: "deny"
        kind: "regex"
        comment: "Deny everything that isn't allowed below"
      - domain: '.*\.172\.in-addr\.arpa'
        type: "allow"
        kind: "regex"
        comment: "Reverse lookups of the Docker networks"
      - domain: "raw.githubusercontent.com"
        type: "allow"
        kind: "exact"
      - domain: "1.0.0.127.in-addr.arpa"
        type: "allow"
        kind: "exact"
      - domain: "discord.com"
        type: "allow"
        kind: "exact"
      - domain: "www.dwd.de"
        type: "allow"
        kind: "exact"
      - domain: "api.openweathermap.org"
        type: "allow"
        kind: "exact"
      - domain: "download.iobroker.net"
        type: "allow"
        kind: "exact"
      - domain: "nodejs.org"
        type: "allow"
        kind: "exact"
      - domain: "registry.npmjs.org"
        type: "allow"
        kind: "exact"
      - domain: "grafana.com"
        type: "allow"
        kind: "exact"
      - domain: "storage.googleapis.com"
        type: "allow"
        kind: "exact"
      - domain: "fw.ota.homesmart.ikea.net"
        type: "allow"
        kind: "exact"
      - domain: "api.sunrise-sunset.org"
        type: "allow"
        kind: "exact"
      - domain: "rating.iobroker.net"
        type: "allow"
        kind: "exact"
      - domain: "hub.docker.com"
        type: "allow"
        kind: "exact"
      - domain: "iobroker.live"
        type: "allow"
        kind: "exact"
      - domain: "deb.debian.org"
        type: "allow"
        kind: "exact"
      - domain: "github.com"
        type: "allow"
        kind: "exact"
      - domain: "api.github.com"
        type: "allow"
        kind: "exact"
      - domain: "ip.iobroker.in"
        type: "allow"
        kind: "exact"
      - domain: "deb.nodesource.com"
        type: "allow"
        kind: "exact"
      - domain: "release-assets.githubusercontent.com"
        type: "allow"
        kind: "exact"
      - domain: "sentry.iobroker.net"
        type: "allow"
        kind: "exact"
      - domain: "phoscon.de"
        type: "allow"
        kind: "exact"
      - domain: "telemetry.nodered.org"
        type: "allow"
        kind: "exact"

  # dungeon's egress filter: only healthmonitor uses it there, and it only needs discord.com (#15).
  - name: "outbound"
    hosts: ["dungeon"]
    a_records: []
    cname_records: []
    block_lists: []
    groups: []
    clients: []
    domains:
      - domain: ".*"
        type: "deny"
        kind: "regex"
        comment: "Deny everything that isn't allowed below"
      - domain: '.*\.172\.in-addr\.arpa'
        type: "allow"
        kind: "regex"
        comment: "Reverse lookups of the Docker networks"
      - domain: "1.0.0.127.in-addr.arpa"
        type: "allow"
        kind: "exact"
      - domain: "discord.com"
        type: "allow"
        kind: "exact"
