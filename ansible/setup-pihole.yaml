---
- name: Require --limit
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Ensure the run is limited to explicit hosts
      ansible.builtin.assert:
        that: ansible_limit is defined
        fail_msg: "Run with --limit <host>"
        quiet: true
      tags: always

# With --limit, the play above matches no host and is skipped. This one stops a limit that selects several hosts
# (all, *, a list or a group), so a run never reaches production by accident. assert needs no connection.
- name: Require --limit to select exactly one host
  hosts: all
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Ensure the run is limited to one host
      ansible.builtin.assert:
        that: ansible_play_hosts_all | length == 1
        fail_msg: "Run with --limit <one host>"
        quiet: true
      tags: always

# The Pi-hole is only talked to through its API, so everything runs on the control node: nothing connects to
# the Pi itself (raspberry#234).
- name: Configure the Pi-hole instances via their REST API
  hosts: all
  gather_facts: false
  vars:
    # FTL restarts after some changes (CNAME records, for example): nginx answers 502 until it's back, and FTL
    # then answers 500 database_error until its database is open again. Every API call waits that out instead
    # of failing the run. While FTL restarts, its DNS is down too, and the control node resolves the Pi-hole's
    # name through it: the uri module then reports status -1 (no connection) instead of 502.
    pihole_api_unavailable: [-1, 502, 503, 504]
    pihole_api_busy_errors: [database_error]
    pihole_api_retries: 10
    pihole_api_delay: 3
    # The root CA comes from its database, the instance passwords from the host's.
    # An instance with hosts: only belongs to those hosts; without it, to every host.
    pihole_host_instances: >-
      {{ pihole_instances | rejectattr('hosts', 'defined') | list
         + pihole_instances | selectattr('hosts', 'defined')
           | selectattr('hosts', 'contains', inventory_hostname) | list }}
    keepass_credentials_databases: "{{ [keepass_ca_database, keepass_database] | unique | list }}"

  tasks:
    - name: Load Pi-hole configuration
      ansible.builtin.include_vars:
        file: configs/pihole.yaml

    - name: Get the KeePass credentials
      ansible.builtin.import_tasks: tasks/keepass_credentials.yaml

    - name: Get the root CA certificate from KeePass
      ansible.builtin.set_fact:
        pihole_root_ca: "{{ lookup('keepass', db=keepass_ca_db, password=keepass_ca_password,
                                   key=keepass_ca_key, group='Domain', title='rootCA', attachment='rootCA.pem') }}"
      no_log: true

    - name: Configure Pi-hole from the control node
      delegate_to: localhost
      become: false
      block:
        # uri can only verify against a CA file, so the certificate goes into a temporary file. It's needed in
        # check mode too, where the API is read to report the changes.
        - name: Create temporary file for the root CA certificate
          ansible.builtin.tempfile:
            suffix: .pem
          register: pihole_ca_file
          changed_when: false
          check_mode: false

        - name: Ensure the root CA certificate is in the temporary file
          ansible.builtin.copy:
            content: "{{ pihole_root_ca }}"
            dest: "{{ pihole_ca_file.path }}"
            mode: '0600'
          changed_when: false
          check_mode: false

        - name: Configure each Pi-hole instance
          ansible.builtin.include_tasks: tasks/configure_pihole_instance.yaml
          loop: "{{ pihole_host_instances }}"
          loop_control:
            loop_var: pihole_instance
            label: "{{ pihole_instance.name }}"

      always:
        - name: Remove temporary root CA certificate file
          ansible.builtin.file:
            path: "{{ pihole_ca_file.path }}"
            state: absent
          when: pihole_ca_file.path is defined
          changed_when: false
          check_mode: false
