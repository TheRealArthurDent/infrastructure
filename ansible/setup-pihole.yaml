---
- name: Require --limit
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Ensure the run is limited to explicit hosts
      ansible.builtin.assert:
        that: ansible_limit is defined
        fail_msg: "Run with --limit <host>"
        quiet: true
      tags: always

# With --limit, the play above matches no host and is skipped. This one stops a limit that selects several hosts
# (all, *, a list or a group), so a run never reaches production by accident. assert needs no connection.
- name: Require --limit to select exactly one host
  hosts: all
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Ensure the run is limited to one host
      ansible.builtin.assert:
        that: ansible_play_hosts_all | length == 1
        fail_msg: "Run with --limit <one host>"
        quiet: true
      tags: always

# The Pi-hole is only talked to through its API, so everything runs on the control node: nothing connects to
# the Pi itself (#234).
- name: Configure Pi-hole via REST API
  hosts: all
  gather_facts: false
  vars:
    pihole_host: "{{ pihole_ip | default('pihole.' ~ inventory_hostname) }}"
    pihole_port: 443
    # FTL restarts after some changes (CNAME records, for example), and nginx answers 502 until it's back. Every
    # API call waits that out instead of failing the run.
    pihole_api_unavailable: [502, 503, 504]
    pihole_api_retries: 10
    pihole_api_delay: 3

  tasks:
    - name: Load Pi-hole configuration
      ansible.builtin.include_vars:
        file: configs/pihole.yaml

    - name: Get the KeePass credentials
      ansible.builtin.import_tasks: tasks/keepass_credentials.yaml

    - name: Get Pi-hole password and root CA certificate from KeePass
      ansible.builtin.set_fact:
        pihole_password: "{{ lookup('keepass', db=keepass_db, password=keepass_password, key=keepass_key,
                                    group='smart-home', title='pihole') }}"
        pihole_root_ca: "{{ lookup('keepass', db=keepass_db, password=keepass_password, key=keepass_key,
                                   group='Domain', title='rootCA', attachment='rootCA.pem') }}"
      no_log: true

    - name: Configure Pi-hole from the control node
      delegate_to: localhost
      become: false
      block:
        # uri can only verify against a CA file, so the certificate goes into a temporary file.
        - name: Create temporary file for the root CA certificate
          ansible.builtin.tempfile:
            suffix: .pem
          register: pihole_ca_file
          changed_when: false

        - name: Ensure the root CA certificate is in the temporary file
          ansible.builtin.copy:
            content: "{{ pihole_root_ca }}"
            dest: "{{ pihole_ca_file.path }}"
            mode: '0600'
          changed_when: false

        - name: Authenticate with Pi-hole API
          ansible.builtin.uri:
            url: "https://{{ pihole_host }}:{{ pihole_port }}/api/auth"
            method: POST
            body_format: json
            body:
              password: "{{ pihole_password }}"
            status_code: 200
            ca_path: "{{ pihole_ca_file.path }}"
          register: auth_response
          no_log: true
          until: auth_response.status not in pihole_api_unavailable
          retries: "{{ pihole_api_retries }}"
          delay: "{{ pihole_api_delay }}"

        - name: Extract session token
          ansible.builtin.set_fact:
            pihole_session: "{{ auth_response.json.session.sid }}"
          no_log: true

        - name: Manage A records (hosts)
          ansible.builtin.include_tasks: tasks/manage_pihole_records.yaml
          vars:
            record_type: "hosts"
            api_endpoint: "/api/config/dns/hosts"
            desired_records: "{{ dns_a_records }}"
            record_format: "objects"
            value_attribute: "address"
            domain_first: false
            separator: " "

        - name: Manage CNAME records
          ansible.builtin.include_tasks: tasks/manage_pihole_records.yaml
          vars:
            record_type: "cnameRecords"
            api_endpoint: "/api/config/dns/cnameRecords"
            desired_records: "{{ dns_cname_records }}"
            record_format: "objects"
            value_attribute: "target"
            domain_first: true
            separator: ","

        - name: Manage block lists
          ansible.builtin.include_tasks: tasks/manage_pihole_lists.yaml
          vars:
            list_type: "block"
            api_endpoint: "/api/lists"
            desired_records: "{{ dns_block_lists }}"
            record_format: "simple"

        # Groups, clients and domains are only synced when they're configured (missing or null), so a missing
        # list never wipes what was set up in the web interface (#234).
        - name: Manage groups
          ansible.builtin.include_tasks: tasks/manage_pihole_groups.yaml
          when: pihole_groups | default(none) is not none

        - name: Get group ids for clients and domains
          ansible.builtin.uri:
            url: "https://{{ pihole_host }}:{{ pihole_port }}/api/groups"
            method: GET
            headers:
              X-FTL-SID: "{{ pihole_session }}"
            status_code: 200
            ca_path: "{{ pihole_ca_file.path }}"
          register: group_ids_response
          when: pihole_clients | default(none) is not none or pihole_domains | default(none) is not none
          until: group_ids_response.status not in pihole_api_unavailable
          retries: "{{ pihole_api_retries }}"
          delay: "{{ pihole_api_delay }}"

        - name: Map group names to ids
          ansible.builtin.set_fact:
            pihole_group_ids: "{{ group_ids_response.json.groups | items2dict(key_name='name', value_name='id') }}"
          when: pihole_clients | default(none) is not none or pihole_domains | default(none) is not none

        - name: Ensure clients and domains only use existing groups
          ansible.builtin.assert:
            that: unknown_groups | length == 0
            fail_msg: "Unknown Pi-hole groups: {{ unknown_groups | join(', ') }}. Add them to pihole_groups."
            quiet: true
          vars:
            unknown_groups: >-
              {{ ((pihole_clients | default([], true)) + (pihole_domains | default([], true)))
                 | map(attribute='groups', default=['Default']) | flatten | unique
                 | difference(pihole_group_ids.keys()) }}
          when: pihole_clients | default(none) is not none or pihole_domains | default(none) is not none

        - name: Manage clients
          ansible.builtin.include_tasks: tasks/manage_pihole_clients.yaml
          when: pihole_clients | default(none) is not none

        - name: Manage domains
          ansible.builtin.include_tasks: tasks/manage_pihole_domains.yaml
          when: pihole_domains | default(none) is not none

      # Pi-hole allows only a few API sessions at a time, so log out even when a task above failed.
      always:
        - name: Logout from Pi-hole API
          ansible.builtin.uri:
            url: "https://{{ pihole_host }}:{{ pihole_port }}/api/auth"
            method: DELETE
            headers:
              X-FTL-SID: "{{ pihole_session }}"
            # 401: the session has already expired
            status_code: [204, 401]
            ca_path: "{{ pihole_ca_file.path }}"
          when: pihole_session is defined
          register: pihole_api_result
          until: pihole_api_result.status not in pihole_api_unavailable
          retries: "{{ pihole_api_retries }}"
          delay: "{{ pihole_api_delay }}"

        - name: Remove temporary root CA certificate file
          ansible.builtin.file:
            path: "{{ pihole_ca_file.path }}"
            state: absent
          when: pihole_ca_file.path is defined
          changed_when: false
