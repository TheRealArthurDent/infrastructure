- name: Require --limit
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Ensure the run is limited to explicit hosts
      ansible.builtin.assert:
        that: ansible_limit is defined
        fail_msg: "Run with --limit <host>"
        quiet: true
      tags: always

# With --limit, the play above matches no host and is skipped. This one stops a limit that selects several hosts
# (all, *, a list or a group), so a run never reaches production by accident. assert needs no connection.
- name: Require --limit to select exactly one host
  hosts: all
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Ensure the run is limited to one host
      ansible.builtin.assert:
        that: ansible_play_hosts_all | length == 1
        fail_msg: "Run with --limit <one host>"
        quiet: true
      tags: always

- name: Bootstrap Raspberry Pi
  hosts: all
  become: true

  vars:
    # https://containrrr.dev/shoutrrr/v0.8/services/overview/
    containermonitor_notification_url: "discord://{{ discord_docker_webhook_token }}@{{ discord_docker_webhook_id }}"

  gather_facts: false

  pre_tasks:
    # Tagged always, so `--tags stack` still has the secrets.
    - name: Get the KeePass credentials
      ansible.builtin.import_tasks: tasks/keepass_credentials.yaml
      tags: always

    # Resolved once per host. As play vars, every use would re-run the lookup (raspberry#235).
    - name: Read secrets from KeePass
      ansible.builtin.set_fact:
        pihole_password: >-
          {{ lookup('keepass', db=keepass_db, password=keepass_password, key=keepass_key,
                    group='smart-home', title='pihole') }}
        outbound_password: >-
          {{ lookup('keepass', db=keepass_db, password=keepass_password, key=keepass_key,
                    group='smart-home', title='outbound') }}
        discord_docker_webhook_id: >-
          {{ lookup('keepass', db=keepass_db, password=keepass_password, key=keepass_key,
                    group='Discord', title='Docker Webhook', field='id') }}
        discord_docker_webhook_token: >-
          {{ lookup('keepass', db=keepass_db, password=keepass_password, key=keepass_key,
                    group='Discord', title='Docker Webhook', field='token') }}
        restic_passphrase: >-
          {{ lookup('keepass', db=keepass_db, password=keepass_password, key=keepass_key,
                    group='Backup', title='Resticprofile', field='passphrase') }}
        dungeon_ssh_port: >-
          {{ lookup('keepass', db=keepass_db, password=keepass_password, key=keepass_key,
                    group='Backup', title='Dungeon', field='ssh-port') }}
        iobroker_states_redis_port: >-
          {{ lookup('keepass', db=keepass_db, password=keepass_password, key=keepass_key,
                    group='smart-home/ioBroker', title='States Redis', field='port') }}
        iobroker_objects_redis_port: >-
          {{ lookup('keepass', db=keepass_db, password=keepass_password, key=keepass_key,
                    group='smart-home/ioBroker', title='Objects Redis', field='port') }}
        influxdb_admin_password: >-
          {{ lookup('keepass', db=keepass_db, password=keepass_password, key=keepass_key,
                    group='smart-home/Influx DB', title='Influx admin') }}
        influxdb_read_password: >-
          {{ lookup('keepass', db=keepass_db, password=keepass_password, key=keepass_key,
                    group='smart-home/Influx DB', title='Influx read') }}
        influxdb_write_password: >-
          {{ lookup('keepass', db=keepass_db, password=keepass_password, key=keepass_key,
                    group='smart-home/Influx DB', title='Influx write') }}
        grafana_password: >-
          {{ lookup('keepass', db=keepass_db, password=keepass_password, key=keepass_key,
                    group='smart-home', title='Grafana') }}
        mosquitto_password: >-
          {{ lookup('keepass', db=keepass_db, password=keepass_password, key=keepass_key,
                    group='smart-home', title='mosquitto') }}
        deconz_vnc_password: >-
          {{ lookup('keepass', db=keepass_db, password=keepass_password, key=keepass_key,
                    group='smart-home/deconz - Phoscon-GW', title='Deconz VNC') }}
        nodered_github_user: >-
          {{ lookup('keepass', db=keepass_db, password=keepass_password, key=keepass_key,
                    group='GitHub', title='NodeRed', field='username') }}
        nodered_github_email: >-
          {{ lookup('keepass', db=keepass_db, password=keepass_password, key=keepass_key,
                    group='GitHub', title='NodeRed', field='email') }}
      no_log: true
      tags: always

  roles:
    - ssh
    - base
    - docker
    - secrets
    # Only hosts in the Argon ONE V2 case (raspberry#325)
    - role: argon_fan
      when: argon_fan_enabled | default(false) | bool
    - role: stack
      tags: stack
